<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INVERSIONES JORAN - Plataforma de Gestión PyMEs</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
:root{
  --navy-deep:#071427;
  --navy:#0d2340;
  --navy-mid:#123055;
  --navy-hover:#1a3d6b;
  --gold:#c9a227;
  --gold-light:#e0c05a;
  --bg-main:#f3f5f8;
  --card-bg:#ffffff;
  --text-main:#1c2733;
  --text-muted:#64748b;
  --border-color:#e2e8f0;
  --success-green:#0f9d58;
  --success-bg:#d9f2e6;
  --warning-amber:#b8860b;
  --warning-bg:#fbeecb;
  --risk-orange:#c05621;
  --risk-orange-bg:#fce3ce;
  --danger-red:#c0392b;
  --danger-bg:#fbe1de;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,sans-serif;}
body{background:var(--bg-main);color:var(--text-main);min-height:100vh;overflow-x:hidden;}
img.logo-img{display:block;object-fit:contain;}
.logo-badge{display:flex;align-items:center;justify-content:center;font-weight:800;letter-spacing:.5px;
  border-radius:50%;background:linear-gradient(160deg,var(--navy-mid) 0%,var(--navy-deep) 100%);
  color:var(--gold);border:2px solid var(--gold);flex-shrink:0;}

/* LOGIN */
#view-login{display:flex;justify-content:center;align-items:center;min-height:100vh;
  background:radial-gradient(circle at 30% 20%, #123055 0%, #071427 65%);padding:20px;}
.login-card{background:linear-gradient(160deg,var(--navy-mid) 0%,var(--navy-deep) 100%);border-radius:16px;padding:36px 30px;width:100%;max-width:430px;
  box-shadow:0 25px 60px -12px rgba(0,0,0,.6);text-align:center;color:#fff;
  border-top:4px solid var(--gold);border:1px solid rgba(201,162,39,.35);}
.login-card .logo-badge{width:90px;height:90px;margin:0 auto 14px auto;font-size:1.8rem;box-shadow:0 6px 14px rgba(0,0,0,.4);}
.login-card h2{font-size:1.25rem;font-weight:800;color:#fff;letter-spacing:.5px;margin-bottom:4px;}
.login-card .tagline{font-size:.7rem;color:var(--gold-light);text-transform:uppercase;font-weight:700;letter-spacing:1.5px;margin-bottom:24px;}
.form-group{text-align:left;margin-bottom:15px;}
.form-group label{display:block;font-size:.8rem;margin-bottom:6px;font-weight:600;color:var(--gold-light);letter-spacing:.2px;}
.login-card .form-control{background:rgba(255,255,255,.06);border:1px solid rgba(201,162,39,.4);color:#fff;}
.login-card .form-control::placeholder{color:rgba(255,255,255,.45);}
.login-card .form-control:focus{border-color:var(--gold);background:rgba(255,255,255,.1);}
.login-card select.form-control option{background:var(--navy-deep);color:#fff;}
.password-field{position:relative;}
.password-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:rgba(255,255,255,.55);cursor:pointer;font-size:.9rem;padding:0;}
.password-toggle:hover{color:var(--gold-light);}
.form-control{width:100%;border:1px solid var(--border-color);border-radius:8px;padding:10px 12px;font-size:.9rem;outline:none;background:#f8fafc;}
.form-control:focus{border-color:var(--navy);background:#fff;}
textarea.form-control{resize:vertical;font-family:inherit;}
.btn-login{width:100%;background:var(--gold);color:var(--navy-deep);border:none;padding:12px;border-radius:8px;
  font-weight:800;cursor:pointer;font-size:.95rem;transition:.2s;margin-top:8px;letter-spacing:.3px;}
.btn-login:hover{background:var(--gold-light);}
.btn-login:disabled{opacity:.55;cursor:not-allowed;}
.login-hint{font-size:.72rem;color:rgba(255,255,255,.5);margin-top:16px;}
.login-error{background:rgba(192,57,43,.18);border:1px solid rgba(192,57,43,.5);color:#ffd9d4;font-size:.78rem;
  padding:9px 12px;border-radius:8px;margin-bottom:14px;display:none;text-align:left;}
.login-error.show{display:block;}

/* APP LAYOUT */
#view-app{height:100vh;display:none;grid-template-columns:260px 1fr;position:relative;}
aside{background:linear-gradient(180deg,var(--navy-deep),var(--navy));color:#fff;padding:20px 15px;display:flex;flex-direction:column;justify-content:space-between;z-index:100;}
.brand-area{display:flex;align-items:center;gap:12px;padding-bottom:18px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:15px;}
.brand-area .logo-badge{width:42px;height:42px;font-size:.82rem;}
.brand-title h1{font-size:.92rem;letter-spacing:.4px;font-weight:800;}
.brand-title span{font-size:.62rem;color:var(--gold-light);text-transform:uppercase;font-weight:700;letter-spacing:.5px;}
.nav-menu{list-style:none;overflow-y:auto;max-height:calc(100vh - 150px);}
.nav-link{display:flex;align-items:center;gap:12px;padding:10px 14px;color:#c7d2e3;border-radius:8px;margin-bottom:4px;
  cursor:pointer;font-size:.86rem;font-weight:500;transition:.2s;text-decoration:none;}
.nav-link i{width:18px;text-align:center;font-size:.88rem;color:var(--gold-light);}
.nav-link.active,.nav-link:hover{background:rgba(201,162,39,.18);color:#fff;}
.sidebar-foot{font-size:.68rem;color:#7d8ba3;text-align:center;padding-top:10px;border-top:1px solid rgba(255,255,255,.08);}

main{display:flex;flex-direction:column;height:100vh;overflow-y:auto;background:var(--bg-main);}
header{background:var(--card-bg);border-bottom:1px solid var(--border-color);padding:14px 24px;
  display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 3px rgba(0,0,0,.03);position:sticky;top:0;z-index:50;}
.header-left{display:flex;align-items:center;gap:14px;}
.btn-menu-mobile{display:none;background:none;border:none;font-size:1.2rem;color:var(--navy);cursor:pointer;padding:6px;}
.user-profile-widget{display:flex;align-items:center;gap:10px;}
.user-avatar{width:36px;height:36px;background:var(--navy);color:var(--gold-light);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.8rem;}

.content-container{padding:24px 24px;max-width:1400px;margin:0 auto;width:100%;}

.metrics-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-bottom:20px;}
.metric-card{background:var(--card-bg);border:1px solid var(--border-color);border-radius:12px;padding:16px;
  box-shadow:0 1px 3px rgba(0,0,0,.03);display:flex;justify-content:space-between;align-items:flex-start;}
.metric-card p{font-size:.72rem;color:var(--text-muted);font-weight:700;text-transform:uppercase;margin-bottom:6px;letter-spacing:.3px;}
.metric-card h2{font-size:1.35rem;color:var(--text-main);font-weight:800;}
.metric-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0;}

.card-table{background:var(--card-bg);border:1px solid var(--border-color);border-radius:12px;padding:20px;margin-bottom:20px;box-shadow:0 1px 3px rgba(0,0,0,.03);}
.card-table-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;flex-wrap:wrap;gap:10px;}
.card-table-header h3{font-size:.98rem;color:var(--navy);font-weight:800;}
.card-table-header .subtitle{font-size:.75rem;color:var(--text-muted);margin-top:2px;}

table{width:100%;border-collapse:collapse;text-align:left;}
th{padding:10px 12px;font-size:.7rem;text-transform:uppercase;color:var(--text-muted);background:#f8fafc;border-bottom:2px solid var(--border-color);font-weight:800;letter-spacing:.3px;white-space:nowrap;}
td{padding:11px 12px;font-size:.84rem;border-bottom:1px solid var(--border-color);color:#334155;}
tr:hover td{background:#fbfbfd;}
.table-scroll{overflow-x:auto;}

.badge{padding:4px 10px;border-radius:20px;font-size:.72rem;font-weight:700;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;}
.badge-green{background:var(--success-bg);color:var(--success-green);}
.badge-amber{background:var(--warning-bg);color:var(--warning-amber);}
.badge-orange{background:var(--risk-orange-bg);color:var(--risk-orange);}
.badge-red{background:var(--danger-bg);color:var(--danger-red);}

.btn-main{background:var(--navy);color:var(--gold-light);border:none;padding:9px 15px;border-radius:7px;font-weight:700;cursor:pointer;font-size:.82rem;display:inline-flex;align-items:center;gap:6px;transition:.2s;}
.btn-main:hover{background:var(--navy-hover);}
.btn-main:disabled{opacity:.5;cursor:not-allowed;}
.btn-secondary{background:#eef1f5;color:#334155;border:none;padding:7px 12px;border-radius:7px;font-weight:600;cursor:pointer;font-size:.78rem;display:inline-flex;align-items:center;gap:5px;transition:.2s;}
.btn-secondary:hover{background:#e2e8f0;}
.btn-danger{background:var(--danger-bg);color:var(--danger-red);border:none;padding:7px 12px;border-radius:7px;font-weight:700;cursor:pointer;font-size:.78rem;}
.btn-gold{background:var(--gold);color:#1c2733;border:none;padding:9px 15px;border-radius:7px;font-weight:800;cursor:pointer;font-size:.82rem;display:inline-flex;align-items:center;gap:6px;}
.btn-gold:hover{background:var(--gold-light);}

.form-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:12px;}
.form-grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:12px;}
.form-grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:12px;}
.form-box{background:#f8fafc;border:1px solid var(--border-color);padding:16px;border-radius:10px;margin-bottom:16px;}
.form-box h4{font-size:.8rem;color:var(--navy);text-transform:uppercase;margin-bottom:12px;font-weight:800;border-bottom:2px solid var(--gold);padding-bottom:6px;letter-spacing:.3px;display:inline-block;}
.field label{display:block;font-size:.76rem;font-weight:700;color:#475569;margin-bottom:4px;}
.field label .req{color:var(--danger-red);}

.tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--border-color);flex-wrap:wrap;}
.tab-btn{padding:9px 15px;font-size:.8rem;font-weight:700;color:var(--text-muted);background:none;border:none;cursor:pointer;border-bottom:3px solid transparent;}
.tab-btn.active{color:var(--navy);border-bottom-color:var(--gold);}
.tab-content{display:none;}
.tab-content.active{display:block;}

.progress-bar-track{background:#e2e8f0;border-radius:10px;height:14px;width:100%;overflow:hidden;}
.progress-bar-fill{height:100%;border-radius:10px;transition:width .3s ease;}

.modal-overlay{position:fixed;inset:0;background:rgba(7,20,39,.75);display:none;justify-content:center;align-items:center;z-index:1000;padding:20px;}
.modal-overlay.open{display:flex;}
.modal-box{background:#fff;padding:24px;border-radius:14px;width:100%;max-width:820px;max-height:90vh;overflow-y:auto;color:var(--text-main);box-shadow:0 20px 40px rgba(0,0,0,.3);}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:12px;border-bottom:2px solid var(--gold);}
.modal-header h3{color:var(--navy);font-size:1.05rem;font-weight:800;}
.modal-close{background:none;border:none;font-size:1.1rem;cursor:pointer;color:var(--text-muted);padding:4px;}

.chip-list{display:flex;flex-wrap:wrap;gap:8px;}
.chip{background:#eef1f5;border-radius:20px;padding:6px 12px;font-size:.78rem;font-weight:600;color:#334155;}
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;}

.file-drop{border:2px dashed var(--border-color);border-radius:10px;padding:16px;text-align:center;color:var(--text-muted);font-size:.8rem;cursor:pointer;background:#fbfcfe;}
.file-drop:hover{border-color:var(--gold);color:var(--navy);}

#toast{position:fixed;bottom:22px;right:22px;background:var(--navy-deep);color:#fff;padding:12px 18px;border-radius:9px;
  border-left:4px solid var(--gold);display:none;z-index:2000;font-size:.85rem;box-shadow:0 10px 25px rgba(0,0,0,.25);max-width:340px;}
#toast.toast-error{border-left-color:var(--danger-red);}

.empty-state{text-align:center;padding:25px;color:var(--text-muted);font-size:.85rem;}
.risk-list-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border-color);font-size:.85rem;}
.risk-list-item:last-child{border-bottom:none;}

#loading-overlay{position:fixed;inset:0;background:var(--navy-deep);display:flex;flex-direction:column;
  justify-content:center;align-items:center;z-index:5000;color:#fff;gap:14px;}
#loading-overlay .spinner{width:38px;height:38px;border:3px solid rgba(201,162,39,.25);border-top-color:var(--gold);
  border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

#sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:90;}

@media(max-width:900px){
  #view-app{grid-template-columns:1fr;}
  aside{
    position:fixed;top:0;left:-280px;bottom:0;width:260px;transition:left .25s ease;
  }
  aside.mobile-active{left:0;}
  #sidebar-backdrop.active{display:block;}
  .btn-menu-mobile{display:block;}
  .form-grid-3,.form-grid-4,.form-grid-2{grid-template-columns:1fr;}
  .content-container{padding:16px;}
}
</style>
</head>
<body>

<div id="loading-overlay">
  <div class="spinner"></div>
  <p style="font-size:.82rem;color:var(--gold-light);letter-spacing:.3px;">Cargando información de JORAN...</p>
</div>

<div id="sidebar-backdrop" onclick="toggleMenuMobile(false)"></div>

<section id="view-login">
  <div class="login-card">
    <div class="logo-badge">JR</div>
    <h2>INVERSIONES JORAN</h2>
    <div class="tagline">Plataforma de gestión PyMEs</div>
    <div class="login-error" id="login-error"></div>
    <form onsubmit="realizarLogin(event)" id="form-login">
      <div class="form-group">
        <label>Rol de Usuario</label>
        <select id="selectRol" class="form-control" required onchange="handleRolChange()">
          <option value="" disabled selected>Seleccione rol...</option>
          <option value="client">Cliente (Mi Negocio &amp; Finanzas)</option>
          <option value="worker">Trabajador (Seguimientos &amp; Campo)</option>
          <option value="admin">Administrador (Control General &amp; Reportes)</option>
        </select>
      </div>
      <div class="form-group" id="grupo-entidad" style="display:none;">
        <label id="label-entidad">Seleccione su usuario</label>
        <select id="selectEntidad" class="form-control"></select>
      </div>
      <div class="form-group">
        <label>Nombre de Usuario</label>
        <input type="text" id="inputUsuario" class="form-control" required placeholder="Ingrese su nombre" readonly>
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <div class="password-field">
          <input type="password" id="inputPassword" class="form-control" required placeholder="Ingrese su contraseña" style="padding-right:42px;">
          <button type="button" class="password-toggle" onclick="togglePassword()"><i class="fa-solid fa-eye" id="password-eye"></i></button>
        </div>
      </div>
      <button type="submit" class="btn-login" id="btn-login"><i class="fa-solid fa-lock"></i> Acceder a la Plataforma</button>
    </form>
    <button type="button" class="btn-secondary" style="width:100%;margin-top:10px;background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(201,162,39,.35);" onclick="abrirModalCrearCuenta()"><i class="fa-solid fa-user-plus"></i> Crear cuenta de cliente</button>
    <p class="login-hint"><a href="javascript:void(0)" onclick="verPoliticaDatosLogin()" style="color:var(--gold-light);text-decoration:underline;">Política de Tratamiento de Datos</a></p>
  </div>
</section>

<div id="view-app">
  <aside id="app-sidebar">
    <div>
      <div class="brand-area">
        <div class="logo-badge">JR</div>
        <div class="brand-title">
          <h1>INVERSIONES JORAN</h1>
          <span>Portal PyMEs</span>
        </div>
      </div>
      <ul class="nav-menu" id="menuLateral"></ul>
    </div>
    <div class="sidebar-foot">JORAN S.A.S. &copy; 2026</div>
  </aside>

  <main>
    <header>
      <div class="header-left">
        <button class="btn-menu-mobile" onclick="toggleMenuMobile(true)"><i class="fa-solid fa-bars"></i></button>
        <h2 id="titulo-pagina" style="font-size:1.05rem;font-weight:800;color:var(--navy);">Panel Principal</h2>
      </div>
      <div class="user-profile-widget">
        <div class="user-avatar" id="header-avatar-initials">US</div>
        <div>
          <div id="header-user-name" style="font-size:.85rem;font-weight:700;">Usuario</div>
          <div id="header-user-role" style="font-size:.7rem;color:var(--text-muted);">Rol</div>
        </div>
        <button onclick="actualizarDatosManual()" class="btn-secondary" style="margin-left:10px;" title="Actualizar datos"><i class="fa-solid fa-rotate"></i></button>
        <button onclick="cerrarSesion()" class="btn-secondary" style="margin-left:4px;color:var(--danger-red);"><i class="fa-solid fa-power-off"></i></button>
      </div>
    </header>
    <div class="content-container" id="content-container"></div>
  </main>
</div>

<div class="modal-overlay" id="modal-overlay" onclick="handleModalOverlayClick(event)">
  <div class="modal-box" id="modal-box"></div>
</div>

<div id="toast"><span id="toast-msg">Notificación</span></div>

<script>
/* =========================================================
   INVERSIONES JORAN - Motor de Aplicación
   ========================================================= */

let SESSION = { rol: null, usuario: null, usuarioId: null, clienteId: null, trabajadorId: null, vista: null };

const DB = {
  clientes: [],
  trabajadores: [],
  seguimientos: [],
  usuarios: [],
  solicitudesInversion: [],
  pagos: [],
  alertas: [],
  notificaciones: [],
  solicitudesEdicion: [],
  auditoria: [],
  capital: { total: 0, recuperado: 0 },
  categorias: ['Tienda de barrio', 'Panadería', 'Barbería', 'Papelería', 'Restaurante', 'Ferretería', 'Otro'],
  parametros: {
    moneda: 'COP', periodoSeguimiento: 'Semanal', metaCumplimientoMinimo: 80, nombreEmpresa: 'INVERSIONES JORAN S.A.S.',
    mesesMinimoFuncionamiento: 6, puntajeMinimoAprobacion: 70, montoMaximoInversion: 20000000,
    reglamentoTexto: 'Toda inversión debe destinarse exclusivamente al fin declarado por el cliente. El incumplimiento de compromisos puede derivar en la suspensión del desembolso.',
    politicaDatos: 'INVERSIONES JORAN S.A.S. recolecta datos personales y financieros únicamente para evaluar y hacer seguimiento a sus inversiones según la ley de protección de datos vigentes.'
  },
  nextId: { cliente: 1, trabajador: 1, seguimiento: 1, usuario: 1, solicitud: 1, solicitudInversion: 1, pago: 1, alerta: 1, notificacion: 1 }
};

const SESSION_KEY = 'joran_sesion_v1';
const DB_CACHE_KEY = 'joran_cache_db_v1';
const API_BASE = '';

let _guardadoPendiente = false;
let _guardadoEnCurso = false;
let _timerGuardadoRemoto = null;
let VISTA_ACTUAL = null;
let CURRENT_ROLE_ROUTES = {};

/* ---------------- Utilidades de Fecha y Formato ---------------- */
function obtenerFechaLocal() {
  const d = new Date();
  const year = d.getFullYear();
  const month = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
}

const copFormatter = new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', maximumFractionDigits: 0 });
function formatCOP(n) {
  return copFormatter.format(Number(n) || 0);
}

function fechaLarga(f) {
  if (!f) return '-';
  const d = new Date(f + 'T00:00:00');
  return isNaN(d) ? f : d.toLocaleDateString('es-CO', { day: '2-digit', month: '2-digit', year: 'numeric' });
}

function estadoInfo(estado) {
  const map = {
    normal: { label: 'Normal', cls: 'badge-green', dot: 'var(--success-green)', emoji: '🟢' },
    atencion: { label: 'Atención', cls: 'badge-amber', dot: 'var(--warning-amber)', emoji: '🟡' },
    riesgo: { label: 'Riesgo', cls: 'badge-orange', dot: 'var(--risk-orange)', emoji: '🟠' },
    critico: { label: 'Crítico', cls: 'badge-red', dot: 'var(--danger-red)', emoji: '🔴' }
  };
  return map[estado] || map.normal;
}

function badgeEstado(estado) {
  const info = estadoInfo(estado);
  return `<span class="badge ${info.cls}"><span class="status-dot" style="background:${info.dot}"></span>${info.label}</span>`;
}

function el(id) { return document.getElementById(id); }
function escapeHTML(str) {
  if (str === undefined || str === null) return '';
  return String(str).replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[m]);
}

function getCliente(id) { return DB.clientes.find(c => c.id === Number(id)); }
function getTrabajador(id) { return DB.trabajadores.find(t => t.id === Number(id)); }
function nombreTrabajador(id) { const t = getTrabajador(id); return escapeHTML(t ? t.nombre : 'Trabajador'); }
function nombreNegocio(id) { const c = getCliente(id); return escapeHTML(c ? c.negocio.nombre : 'Negocio'); }
function seguimientosDeCliente(id) { return DB.seguimientos.filter(s => s.clienteId === Number(id)).sort((a,b) => b.fecha.localeCompare(a.fecha)); }
function seguimientosDeTrabajador(id) { return DB.trabajadores.find(t => t.id === Number(id)) ? DB.seguimientos.filter(s => s.trabajadorId === Number(id)).sort((a,b) => b.fecha.localeCompare(a.fecha)) : []; }
function ultimoSeguimiento(clienteId) { const list = seguimientosDeCliente(clienteId); return list.length ? list[0] : null; }

function infoSemanaISO(fechaStr) {
  const d = new Date((fechaStr || '') + 'T00:00:00');
  if (isNaN(d)) return null;
  const target = new Date(d.valueOf());
  const dayNr = (d.getDay() + 6) % 7;
  target.setDate(target.getDate() - dayNr + 3);
  const firstThursday = new Date(target.getFullYear(), 0, 4);
  return { anio: target.getFullYear(), semana: 1 + Math.round((target - firstThursday) / (7 * 86400000)) };
}
function semanaActualLabel() {
  const info = infoSemanaISO(obtenerFechaLocal());
  return info ? `Semana ${info.semana} · ${info.anio}` : '';
}

  document.querySelectorAll(`[data-tabgroup="${groupId}"]`).forEach(x => x.classList.remove('active'));

function mostrarNotificacion(msg, esError) {

  el('toast-msg').innerText = msg;
  toast.classList.toggle('toast-error', !!esError);
  toast.style.display = 'block';
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => toast.style.display = 'none', 3200);
}

/* ---------------- Persistencia Segura ---------------- */
function guardarSesionLocal() {
  try { localStorage.setItem(SESSION_KEY, JSON.stringify(SESSION)); } catch (e) {}
}
function cargarSesionLocal() {
  try {
    const raw = localStorage.getItem(SESSION_KEY);
    if (raw) Object.assign(SESSION, JSON.parse(raw));
  } catch (e) {}
}
function guardarCacheDB() {
  try {
    localStorage.setItem(DB_CACHE_KEY, JSON.stringify(DB));
  } catch (e) {
    console.warn('LocalStorage saturado (posible exceso de fotos Base64)', e);
  }
}
function cargarCacheDB() {
  try {
    const raw = localStorage.getItem(DB_CACHE_KEY);
    if (raw) Object.assign(DB, JSON.parse(raw));
  } catch (e) {}
}

async function cargarEstadoRemoto() {
  try {
    const res = await fetch(API_BASE + '/api/estado');
    if (!res.ok) return { ok: false };
    const datos = await res.json();
    if (datos && typeof datos === 'object' && Object.keys(datos).length) {
      Object.assign(DB, datos);
      guardarCacheDB();
      return { ok: true };
    }
  } catch (e) {
    return { ok: false };
  }
  return { ok: false };
}

function guardarEstado() {
  guardarSesionLocal();
  guardarCacheDB();
  _guardadoPendiente = true;
  clearTimeout(_timerGuardadoRemoto);
  _timerGuardadoRemoto = setTimeout(enviarEstadoRemoto, 800);
}

async function enviarEstadoRemoto() {
  if (_guardadoEnCurso || !_guardadoPendiente) return;
  _guardadoPendiente = false;
  _guardadoEnCurso = true;
  try {
    await fetch(API_BASE + '/api/estado', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(DB)
    });
  } catch (e) {
    _guardadoPendiente = true;
  } finally {
    _guardadoEnCurso = false;
  }
}

async function actualizarDatosManual() {
  mostrarNotificacion('Sincronizando información...');
  const { ok } = await cargarEstadoRemoto();
  if (ok) {
    const activo = document.querySelector('.nav-link.active');
    if (activo) activo.click();
    mostrarNotificacion('Datos sincronizados');
  } else {
    mostrarNotificacion('No se pudo conectar al servidor local', true);
  }
}

function registrarAuditoria(accion, detalle) {
  if (!DB.auditoria) DB.auditoria = [];
  const d = new Date();
  DB.auditoria.unshift({
    fecha: obtenerFechaLocal(),
    hora: d.toTimeString().slice(0, 5),
    usuario: SESSION.usuario || 'Sistema',
    rol: SESSION.rol || '-',
    accion,
    detalle: detalle || ''
  });
  if (DB.auditoria.length > 300) DB.auditoria.length = 300;
}

function crearNotificacion(rol, entidadId, titulo, mensaje, tipo) {
  if (!DB.notificaciones) DB.notificaciones = [];
  DB.notificaciones.unshift({
    id: DB.nextId.notificacion++,
    rol,
    entidadId,
    titulo,
    mensaje,
    tipo: tipo || 'info',
    leida: false,
    fecha: obtenerFechaLocal()
  });
}

/* ---------------- Autenticación y Navegación ---------------- */
function handleRolChange() {
  const rol = el('selectRol').value;
  const grupo = el('grupo-entidad');
  const sel = el('selectEntidad');
  const inp = el('inputUsuario');
  el('login-error').classList.remove('show');

  const candidatos = DB.usuarios.filter(u => u.rol === rol && u.activo);
  if (rol === 'admin' && !DB.usuarios.some(u => u.rol === 'admin')) {
    grupo.style.display = 'none';
    inp.value = 'Administrador Inicial';
    return;
  }
  grupo.style.display = 'block';
  sel.innerHTML = candidatos.length
    ? candidatos.map(u => `<option value="${u.id}">${escapeHTML(u.nombre)} ${u.entidadNombre ? '— ' + escapeHTML(u.entidadNombre) : ''}</option>`).join('')
    : `<option value="">No hay usuarios registrados</option>`;
  sel.onchange = () => {
    const u = DB.usuarios.find(x => x.id === Number(sel.value));
    inp.value = u ? u.nombre : '';
  };
  const primero = DB.usuarios.find(x => x.id === Number(sel.value));
  inp.value = primero ? primero.nombre : (candidatos[0] ? candidatos[0].nombre : '');
}

function togglePassword() {
  const p = el('inputPassword');
  const eye = el('password-eye');
  const isHide = p.type === 'password';
  p.type = isHide ? 'text' : 'password';
  eye.className = isHide ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
}

async function realizarLogin(e) {
  e.preventDefault();
  const rol = el('selectRol').value;
  const pass = el('inputPassword').value;
  const isBootstrap = rol === 'admin' && !DB.usuarios.some(u => u.rol === 'admin');

  if (!isBootstrap) {
    const uid = Number(el('selectEntidad').value);
    const u = DB.usuarios.find(x => x.id === uid && x.rol === rol);
    if (!u || !u.activo) {
      el('login-error').innerText = 'Usuario no encontrado o inactivo.';
      el('login-error').classList.add('show');
      return;
    }
    if (u.password !== pass) {
      el('login-error').innerText = 'Contraseña incorrecta.';
      el('login-error').classList.add('show');
      return;
    }
    SESSION = { rol, usuario: u.nombre, usuarioId: u.id, clienteId: u.entidadId, trabajadorId: u.entidadId, vista: null };
  } else {
    SESSION = { rol: 'admin', usuario: 'Administrador Inicial', usuarioId: null, clienteId: null, trabajadorId: null, vista: null };
  }

  el('view-login').style.display = 'none';
  el('view-app').style.display = 'grid';
  el('header-user-name').innerText = SESSION.usuario;
  el('header-avatar-initials').innerText = SESSION.usuario.slice(0,2).toUpperCase();

  if (rol === 'client') initClienteUI();
  else if (rol === 'worker') initTrabajadorUI();
  else initAdminUI();

  guardarSesionLocal();
  registrarAuditoria('Inicio de sesión', `Rol: ${rol}`);
  guardarEstado();
}

function cerrarSesion() {
  SESSION = { rol: null, usuario: null, usuarioId: null, clienteId: null, trabajadorId: null, vista: null };
  guardarSesionLocal();
  el('view-app').style.display = 'none';
  el('view-login').style.display = 'flex';
  el('form-login').reset();
  el('grupo-entidad').style.display = 'none';
}

function setMenu(items) {
  el('menuLateral').innerHTML = items.map((it, i) =>
    `<li><a class="nav-link ${i===0?'active':''}" data-id="${it.id}" onclick="navegar('${it.id}', this)"><i class="fa-solid ${it.icon}"></i> ${it.label}</a></li>`
  ).join('');
}

function navegar(id, linkEl) {
  document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
  if (linkEl) linkEl.classList.add('active');
  const route = CURRENT_ROLE_ROUTES[id];
  if (!route) return;
  VISTA_ACTUAL = id;
  SESSION.vista = id;
  el('titulo-pagina').innerText = route.titulo;
  el('content-container').innerHTML = route.render();
  if (route.after) route.after();
  toggleMenuMobile(false);
  guardarSesionLocal();
}

      <h3>Directorio General de Clientes</h3>
      <div style="display:flex;gap:8px;">
        <input type="text" class="form-control" style="width:220px;" placeholder="Buscar negocio o cliente..." oninput="filtrarClientesEnVivo(this.value)">
        <button class="btn-main" onclick="abrirModalRegistrarCliente()"><i class="fa-solid fa-plus"></i> Nuevo Cliente</button>
      </div>
    </div>
    <div class="table-scroll"><table id="tabla-admin-clientes">
      <thead><tr><th>Cliente</th><th>Negocio</th><th>Ciudad</th><th>Teléfono</th><th>Capital Invertido</th><th>Estado</th><th>Acciones</th></tr></thead>
      <tbody>${renderFilasClientes(DB.clientes)}</tbody>
    </table></div>
  </div>`;
}

function renderFilasClientes(lista) {
  if (!lista.length) return '<tr><td colspan="7" class="empty-state">No hay clientes encontrados.</td></tr>';
  return lista.map(c => `
    <tr>
      <td><b>${escapeHTML(c.nombre)}</b></td>
      <td>${escapeHTML(c.negocio.nombre)}</td>
      <td>${escapeHTML(c.negocio.ciudad || '-')}</td>
      <td>${escapeHTML(c.telefono)}</td>
      <td>${formatCOP(c.inversion?.aprobado)}</td>
      <td>${badgeEstado(c.estado)}</td>
      <td><button class="btn-secondary" onclick="verClienteDetalle(${c.id})"><i class="fa-solid fa-eye"></i> Ver</button></td>
    </tr>`).join('');
}

function filtrarClientesEnVivo(termino) {
  const t = termino.toLowerCase().trim();
  const filtrados = DB.clientes.filter(c => c.nombre.toLowerCase().includes(t) || c.negocio.nombre.toLowerCase().includes(t));
  const tbody = document.querySelector('#tabla-admin-clientes tbody');
  if (tbody) tbody.innerHTML = renderFilasClientes(filtrados);
}

function verClienteDetalle(id) {
  const c = getCliente(id);
  if (!c) return;
  openModal(`${escapeHTML(c.negocio.nombre)} — ${escapeHTML(c.nombre)}`, `
    <div class="form-grid-3">
      ${field('Documento', c.documento)}
      ${field('Teléfono', c.telefono)}
      ${field('Correo', c.correo)}
    </div>
    <div class="form-grid-3">
      ${field('Ciudad', c.negocio.ciudad)}
      ${field('Dirección', c.negocio.direccion)}
      ${field('Tipo de Negocio', c.negocio.tipo)}
    </div>
    <div class="form-box">
      <h4>Inversión JORAN</h4>
      <div class="form-grid-3">
        ${field('Capital Aprobado', formatCOP(c.inversion?.aprobado))}
        ${field('Participación', (c.inversion?.participacion || 0) + '%')}
        ${field('Estado', c.inversion?.estado)}
      </div>
      ${field('Destino', c.inversion?.destino)}
    </div>
  `);
}

function abrirModalRegistrarCliente() {
  openModal('Registrar Nuevo Cliente', `
    <div class="form-grid-2">
      <div class="field"><label>Nombre Completo *</label><input class="form-control" id="nc-nombre" required></div>
      <div class="field"><label>Documento de Identidad</label><input class="form-control" id="nc-doc"></div>
    </div>
    <div class="form-grid-2">
      <div class="field"><label>Teléfono *</label><input class="form-control" id="nc-tel" required></div>
      <div class="field"><label>Correo Electrónico</label><input type="email" class="form-control" id="nc-email"></div>
    </div>
    <div class="form-grid-3">
      <div class="field"><label>Nombre del Negocio *</label><input class="form-control" id="nc-neg" required></div>
      <div class="field"><label>Categoría</label><select class="form-control" id="nc-tipo">${DB.categorias.map(k=>`<option>${escapeHTML(k)}</option>`).join('')}</select></div>
      <div class="field"><label>Ciudad</label><input class="form-control" id="nc-ciudad" value="Bogotá"></div>
    </div>
    <div class="form-grid-2">
      <div class="field"><label>Capital Aprobado (COP)</label><input type="number" min="0" class="form-control" id="nc-capital" value="0"></div>
      <div class="field"><label>Participación JORAN (%)</label><input type="number" min="0" max="100" class="form-control" id="nc-part" value="10"></div>
    </div>
    <button class="btn-main" onclick="guardarNuevoCliente()"><i class="fa-solid fa-floppy-disk"></i> Guardar Cliente</button>
  `);
}

function guardarNuevoCliente() {
  const nombre = el('nc-nombre').value.trim();
  const tel = el('nc-tel').value.trim();
  const neg = el('nc-neg').value.trim();
  if (!nombre || !tel || !neg) {
    mostrarNotificacion('Por favor completa nombre, teléfono y nombre del negocio.', true);
    return;
  }
  const id = DB.nextId.cliente++;
  const capital = Number(el('nc-capital').value) || 0;
  DB.clientes.push({
    id,
    nombre,
    documento: el('nc-doc').value.trim(),
    telefono: tel,
    correo: el('nc-email').value.trim(),
    negocio: { nombre: neg, tipo: el('nc-tipo').value, ciudad: el('nc-ciudad').value.trim(), direccion: '', descripcion: '' },
    inversion: { solicitado: capital, aprobado: capital, recibido: capital, fecha: obtenerFechaLocal(), tipo: 'Semilla', participacion: Number(el('nc-part').value)||0, estado: capital>0?'Activa':'Pendiente' },
    resultados: { ventas: 0, gastos: 0, utilidad: 0, inventario: 0 },
    estado: 'normal'
  });
  registrarAuditoria('Cliente registrado', `${nombre} — ${neg}`);
  guardarEstado();
  closeModal();
  mostrarNotificacion('Cliente registrado exitosamente');
  navegar('a-clientes');
}

function renderAdminTrabajadores() {
  return `
  <div class="card-table">
    <div class="card-table-header"><h3>Trabajadores y Asesores de Campo</h3></div>
    <div class="table-scroll"><table>
      <thead><tr><th>Nombre</th><th>Teléfono</th><th>Negocios a Cargo</th><th>Seguimientos</th></tr></thead>
      <tbody>${DB.trabajadores.length ? DB.trabajadores.map(t => `<tr><td><b>${escapeHTML(t.nombre)}</b></td><td>${escapeHTML(t.telefono)}</td><td>${(t.negocios||[]).length} negocios</td><td>${seguimientosDeTrabajador(t.id).length}</td></tr>`).join('') : '<tr><td colspan="4" class="empty-state">No hay trabajadores registrados.</td></tr>'}</tbody>
    </table></div>
  </div>`;
}

function renderAdminInversiones() {
  return `
  <div class="card-table">
    <div class="card-table-header"><h3>Inversiones por Negocio</h3></div>
    <div class="table-scroll"><table>
      <thead><tr><th>Negocio</th><th>Cliente</th><th>Monto Invertido</th><th>Participación</th><th>Estado</th></tr></thead>
      <tbody>${DB.clientes.length ? DB.clientes.map(c => `<tr><td><b>${escapeHTML(c.negocio.nombre)}</b></td><td>${escapeHTML(c.nombre)}</td><td>${formatCOP(c.inversion?.aprobado)}</td><td>${c.inversion?.participacion || 0}%</td><td><span class="badge badge-green">${escapeHTML(c.inversion?.estado || 'Activa')}</span></td></tr>`).join('') : '<tr><td colspan="5" class="empty-state">Sin inversiones registradas.</td></tr>'}</tbody>
    </table></div>
  </div>`;
}

function renderAdminSolicitudes() {
  const sols = DB.solicitudesInversion;
  return `
  <div class="card-table">
    <div class="card-table-header"><h3>Solicitudes de Inversión Pendientes</h3></div>
    <div class="table-scroll"><table>
      <thead><tr><th>Fecha</th><th>Cliente</th><th>Negocio</th><th>Monto</th><th>Estado</th><th>Acción</th></tr></thead>
      <tbody>${sols.length ? sols.map(s => `<tr><td>${fechaLarga(s.fecha)}</td><td>${escapeHTML(s.clienteNombre)}</td><td>${escapeHTML(s.negocioNombre)}</td><td>${formatCOP(s.montoSolicitado)}</td><td><span class="badge badge-amber">${escapeHTML(s.estado)}</span></td><td>${s.estado==='Pendiente'?`<button class="btn-main" onclick="abrirModalResolverSolicitud(${s.id})">Resolver</button>`:'-'}</td></tr>`).join('') : '<tr><td colspan="6" class="empty-state">No hay solicitudes de inversión pendientes.</td></tr>'}</tbody>
    </table></div>
  </div>`;
}

function abrirModalResolverSolicitud(id) {
  const s = DB.solicitudesInversion.find(x => x.id === id);
  if (!s) return;
  openModal('Resolver Solicitud de Inversión', `
    <p style="margin-bottom:12px;"><b>${escapeHTML(s.negocioNombre)}</b> solicita ${formatCOP(s.montoSolicitado)}.</p>
    <div class="field" style="margin-bottom:12px;"><label>Decisión</label><select class="form-control" id="dec-sol"><option value="Aprobada">Aprobar</option><option value="Rechazada">Rechazar</option></select></div>
    <div class="field" style="margin-bottom:16px;"><label>Observación</label><textarea class="form-control" id="dec-obs" rows="3"></textarea></div>
    <button class="btn-main" onclick="confirmarResolucionSolicitud(${id})">Confirmar Decisión</button>
  `);
}

function confirmarResolucionSolicitud(id) {
  const s = DB.solicitudesInversion.find(x => x.id === id);
  if (!s) return;
  const estado = el('dec-sol').value;
  s.estado = estado;
  s.comentario = el('dec-obs').value.trim();
  const c = getCliente(s.clienteId);
  if (c && estado === 'Aprobada') {
    c.inversion.aprobado = s.montoSolicitado;
    c.inversion.recibido = s.montoSolicitado;
    c.inversion.estado = 'Activa';
  }
  registrarAuditoria('Solicitud de inversión resuelta', `${s.negocioNombre}: ${estado}`);
  guardarEstado();
  closeModal();
  mostrarNotificacion(`Solicitud ${estado.toLowerCase()}`);
  navegar('a-solicitudes');
}

function renderAdminSeguimientos() {
  const list = DB.seguimientos;
  return `
  <div class="card-table">
    <div class="card-table-header"><h3>Historial de Seguimientos en Campo</h3></div>
    <div class="table-scroll"><table>
      <thead><tr><th>Fecha</th><th>Semana</th><th>Negocio</th><th>Ventas</th><th>Gastos</th><th>Utilidad</th><th>Alerta</th></tr></thead>
      <tbody>${list.length ? list.map(s => `<tr><td>${fechaLarga(s.fecha)}</td><td>${escapeHTML(s.semana)}</td><td>${nombreNegocio(s.clienteId)}</td><td>${formatCOP(s.ventas)}</td><td>${formatCOP(s.gastos)}</td><td>${formatCOP(s.utilidad)}</td><td>${badgeEstado(s.estado)}</td></tr>`).join('') : '<tr><td colspan="7" class="empty-state">No hay visitas registradas.</td></tr>'}</tbody>
    </table></div>
  </div>`;
}

/* ---------------- Vistas: Trabajador ---------------- */
function initTrabajadorUI() {
  el('header-user-role').innerText = 'Trabajador / Asesor JORAN';
  const t = getTrabajador(SESSION.trabajadorId);
  setMenu([
    { id: 'w-nuevo', label: 'Nuevo Seguimiento', icon: 'fa-plus-circle' },
    { id: 'w-negocios', label: 'Mis Negocios', icon: 'fa-store' },
    { id: 'w-historial', label: 'Mis Visitas', icon: 'fa-list-check' }
  ]);
  CURRENT_ROLE_ROUTES = {
    'w-nuevo': { titulo: 'Registrar Visita Semanal', render: () => renderTrabajadorNuevo(t) },
    'w-negocios': { titulo: 'Negocios Asignados', render: () => renderTrabajadorNegocios(t) },
    'w-historial': { titulo: 'Historial de Visitas', render: () => renderTrabajadorHistorial(t) }
  };
  navegar('w-nuevo', document.querySelector('.nav-link'));
}

function renderTrabajadorNuevo(t) {
  const negocios = t ? (t.negocios || []).map(id => getCliente(id)).filter(Boolean) : DB.clientes;
  const hoy = obtenerFechaLocal();
  return `
  <div class="card-table">
    <div class="card-table-header"><h3>Datos del Seguimiento</h3></div>
    <div class="form-box">
      <div class="form-grid-3">
        <div class="field"><label>Negocio *</label>
          <select class="form-control" id="seg-negocio">
            ${negocios.map(c => `<option value="${c.id}">${escapeHTML(c.negocio.nombre)}</option>`).join('')}
          </select>
        </div>
        <div class="field"><label>Fecha de Visita</label><input type="date" class="form-control" id="seg-fecha" value="${hoy}"></div>
        <div class="field"><label>Semana</label><input type="text" class="form-control" id="seg-semana" value="${semanaActualLabel()}"></div>
      </div>
    </div>
    <div class="form-box">
      <h4>Resultados Financieros de la Semana</h4>
      <div class="form-grid-3">
        <div class="field"><label>Ventas de la semana</label><input type="number" class="form-control" id="seg-ventas" value="0"></div>
        <div class="field"><label>Gastos de la semana</label><input type="number" class="form-control" id="seg-gastos" value="0"></div>
        <div class="field"><label>Utilidad estimada</label><input type="number" class="form-control" id="seg-utilidad" value="0"></div>
      </div>
      <div class="form-grid-2">
        <div class="field"><label>Alerta / Estado del negocio</label>
          <select class="form-control" id="seg-estado">
            <option value="normal">🟢 Normal — Sin inconvenientes</option>
            <option value="atencion">🟡 Atención — Disminución leve de ventas</option>
            <option value="riesgo">🟠 Riesgo — Problemas de inventario o liquidez</option>
            <option value="critico">🔴 Crítico — Pérdidas o riesgo de cierre</option>
          </select>
        </div>
        <div class="field"><label>Compromisos del cliente</label><input type="text" class="form-control" id="seg-compromisos" placeholder="Ej: Mejorar control de caja"></div>
      </div>
    </div>
    <button class="btn-main" onclick="guardarSeguimientoTrabajador()"><i class="fa-solid fa-floppy-disk"></i> Guardar Seguimiento</button>
  </div>`;
}

function guardarSeguimientoTrabajador() {
  const cid = Number(el('seg-negocio').value);
  const ventas = Number(el('seg-ventas').value) || 0;
  const gastos = Number(el('seg-gastos').value) || 0;
  const utilidad = Number(el('seg-utilidad').value) || 0;
  const estado = el('seg-estado').value;

  DB.seguimientos.unshift({
    id: DB.nextId.seguimiento++,
    clienteId: cid,
    trabajadorId: SESSION.trabajadorId || 1,
    fecha: el('seg-fecha').value || obtenerFechaLocal(),
    semana: el('seg-semana').value,
    ventas, gastos, utilidad, estado,
    compromisos: el('seg-compromisos').value.trim()
  });

  const cli = getCliente(cid);
  if (cli) {
    cli.estado = estado;
    cli.resultados.ventas = ventas;
    cli.resultados.gastos = gastos;
    cli.resultados.utilidad = utilidad;
  }

  registrarAuditoria('Seguimiento guardado', `${cli ? cli.negocio.nombre : 'Negocio'} — ${estado}`);
  guardarEstado();
  mostrarNotificacion('Seguimiento guardado con éxito');
  navegar('w-nuevo');
}

function renderTrabajadorNegocios(t) {
  const negocios = t ? (t.negocios || []).map(id => getCliente(id)).filter(Boolean) : DB.clientes;
  return `
  <div class="card-table">
    <div class="card-table-header"><h3>Negocios Asignados</h3></div>
    <div class="table-scroll"><table>
      <thead><tr><th>Negocio</th><th>Cliente</th><th>Ciudad</th><th>Teléfono</th><th>Estado</th></tr></thead>
      <tbody>${negocios.length ? negocios.map(c => `<tr><td><b>${escapeHTML(c.negocio.nombre)}</b></td><td>${escapeHTML(c.nombre)}</td><td>${escapeHTML(c.negocio.ciudad||'-')}</td><td>${escapeHTML(c.telefono)}</td><td>${badgeEstado(c.estado)}</td></tr>`).join('') : '<tr><td colspan="5" class="empty-state">No tienes negocios asignados.</td></tr>'}</tbody>
    </table></div>
  </div>`;
}

function renderTrabajadorHistorial(t) {
  const hist = t ? seguimientosDeTrabajador(t.id) : DB.seguimientos;
  return `
  <div class="card-table">
    <div class="card-table-header"><h3>Visitas Realizadas</h3></div>
    <div class="table-scroll"><table>
      <thead><tr><th>Fecha</th><th>Semana</th><th>Negocio</th><th>Ventas</th><th>Utilidad</th><th>Estado</th></tr></thead>
      <tbody>${hist.length ? hist.map(s => `<tr><td>${fechaLarga(s.fecha)}</td><td>${escapeHTML(s.semana)}</td><td>${nombreNegocio(s.clienteId)}</td><td>${formatCOP(s.ventas)}</td><td>${formatCOP(s.utilidad)}</td><td>${badgeEstado(s.estado)}</td></tr>`).join('') : '<tr><td colspan="6" class="empty-state">No hay visitas registradas.</td></tr>'}</tbody>
    </table></div>
  </div>`;
}

/* ---------------- Arranque de la Aplicación ---------------- */
async function iniciarApp() {
  cargarSesionLocal();
  cargarCacheDB();
  await cargarEstadoRemoto();
  el('loading-overlay').style.display = 'none';

  if (SESSION.rol) {
    el('view-login').style.display = 'none';
    el('view-app').style.display = 'grid';
    el('header-user-name').innerText = SESSION.usuario || 'Usuario';
    el('header-avatar-initials').innerText = (SESSION.usuario || 'US').slice(0,2).toUpperCase();
    if (SESSION.rol === 'client') initClienteUI();
    else if (SESSION.rol === 'worker') initTrabajadorUI();
    else initAdminUI();
  }
}

document.addEventListener('DOMContentLoaded', iniciarApp);
</script>
</body>
</html>
