<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INVERSIONES JORAN - Plataforma de Gestión PyMEs</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
:root{
  --navy-deep:#071427;
  --navy:#0d2340;
  --navy-mid:#123055;
  --navy-hover:#1a3d6b;
  --gold:#c9a227;
  --gold-light:#e0c05a;
  --bg-main:#f3f5f8;
  --card-bg:#ffffff;
  --text-main:#1c2733;
  --text-muted:#64748b;
  --border-color:#e2e8f0;
  --success-green:#0f9d58;
  --success-bg:#d9f2e6;
  --warning-amber:#b8860b;
  --warning-bg:#fbeecb;
  --risk-orange:#c05621;
  --risk-orange-bg:#fce3ce;
  --danger-red:#c0392b;
  --danger-bg:#fbe1de;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,sans-serif;}
body{background:var(--bg-main);color:var(--text-main);min-height:100vh;overflow-x:hidden;}
img.logo-img{display:block;object-fit:contain;}
.logo-badge{display:flex;align-items:center;justify-content:center;font-weight:800;letter-spacing:.5px;
  border-radius:50%;background:linear-gradient(160deg,var(--navy-mid) 0%,var(--navy-deep) 100%);
  color:var(--gold);border:2px solid var(--gold);flex-shrink:0;}

/* LOGIN */
#view-login{display:flex;justify-content:center;align-items:center;min-height:100vh;
  background:radial-gradient(circle at 30% 20%, #123055 0%, #071427 65%);padding:20px;}
.login-card{background:linear-gradient(160deg,var(--navy-mid) 0%,var(--navy-deep) 100%);border-radius:16px;padding:42px 34px;width:100%;max-width:430px;
  box-shadow:0 25px 60px -12px rgba(0,0,0,.6);text-align:center;color:#fff;
  border-top:4px solid var(--gold);border:1px solid rgba(201,162,39,.35);}
.login-card .logo-img{width:110px;height:110px;margin:0 auto 14px auto;filter:drop-shadow(0 6px 14px rgba(0,0,0,.4));}
.login-card .logo-badge{width:110px;height:110px;margin:0 auto 14px auto;font-size:2.1rem;box-shadow:0 6px 14px rgba(0,0,0,.4);}
.login-card h2{font-size:1.25rem;font-weight:800;color:#fff;letter-spacing:.5px;margin-bottom:4px;}
.login-card .tagline{font-size:.7rem;color:var(--gold-light);text-transform:uppercase;font-weight:700;letter-spacing:1.5px;margin-bottom:26px;}
.form-group{text-align:left;margin-bottom:16px;}
.form-group label{display:block;font-size:.8rem;margin-bottom:6px;font-weight:600;color:var(--gold-light);letter-spacing:.2px;}
.login-card .form-control{background:rgba(255,255,255,.06);border:1px solid rgba(201,162,39,.4);color:#fff;}
.login-card .form-control::placeholder{color:rgba(255,255,255,.45);}
.login-card .form-control:focus{border-color:var(--gold);background:rgba(255,255,255,.1);}
.login-card select.form-control option{background:var(--navy-deep);color:#fff;}
.password-field{position:relative;}
.password-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:rgba(255,255,255,.55);cursor:pointer;font-size:.9rem;padding:0;}
.password-toggle:hover{color:var(--gold-light);}
.form-control{width:100%;border:1px solid var(--border-color);border-radius:8px;padding:11px 12px;font-size:.92rem;outline:none;background:#f8fafc;}
.form-control:focus{border-color:var(--navy);background:#fff;}
textarea.form-control{resize:vertical;font-family:inherit;}
.btn-login{width:100%;background:var(--gold);color:var(--navy-deep);border:none;padding:12px;border-radius:8px;
  font-weight:800;cursor:pointer;font-size:.98rem;transition:.2s;margin-top:8px;letter-spacing:.3px;}
.btn-login:hover{background:var(--gold-light);}
.btn-login:disabled{opacity:.55;cursor:not-allowed;}
.login-hint{font-size:.68rem;color:rgba(255,255,255,.4);margin-top:16px;}
.login-error{background:rgba(192,57,43,.18);border:1px solid rgba(192,57,43,.5);color:#ffd9d4;font-size:.78rem;
  padding:9px 12px;border-radius:8px;margin-bottom:14px;display:none;text-align:left;}
.login-error.show{display:block;}
.field-error{border-color:var(--danger-red) !important;}

/* APP LAYOUT */
#view-app{height:100vh;display:none;grid-template-columns:262px 1fr;position:relative;}
aside{background:linear-gradient(180deg,var(--navy-deep),var(--navy));color:#fff;padding:20px 15px;display:flex;flex-direction:column;justify-content:space-between;z-index:100;}
.brand-area{display:flex;align-items:center;gap:12px;padding-bottom:18px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:15px;}
.brand-area .logo-img{width:42px;height:42px;}
.brand-area .logo-badge{width:42px;height:42px;font-size:.82rem;}
.brand-title h1{font-size:.92rem;letter-spacing:.4px;font-weight:800;}
.brand-title span{font-size:.62rem;color:var(--gold-light);text-transform:uppercase;font-weight:700;letter-spacing:.5px;}
.nav-menu{list-style:none;overflow-y:auto;max-height:calc(100vh - 150px);}
.nav-link{display:flex;align-items:center;gap:12px;padding:10px 14px;color:#c7d2e3;border-radius:8px;margin-bottom:3px;
  cursor:pointer;font-size:.86rem;font-weight:500;transition:.2s;text-decoration:none;}
.nav-link i{width:18px;text-align:center;font-size:.88rem;color:var(--gold-light);}
.nav-link.active,.nav-link:hover{background:rgba(201,162,39,.16);color:#fff;}
.sidebar-foot{font-size:.68rem;color:#7d8ba3;text-align:center;padding-top:10px;border-top:1px solid rgba(255,255,255,.08);}

main{display:flex;flex-direction:column;height:100vh;overflow-y:auto;background:var(--bg-main);}
header{background:var(--card-bg);border-bottom:1px solid var(--border-color);padding:14px 30px;
  display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 3px rgba(0,0,0,.03);position:sticky;top:0;z-index:50;}
.header-left{display:flex;align-items:center;gap:14px;}
.btn-menu-mobile{display:none;background:none;border:none;font-size:1.25rem;color:var(--navy);cursor:pointer;padding:4px;}
.user-profile-widget{display:flex;align-items:center;gap:12px;}
.user-avatar{width:38px;height:38px;background:var(--navy);color:var(--gold-light);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.8rem;}

.content-container{padding:28px 30px;max-width:1400px;margin:0 auto;width:100%;}
.hub-module{display:none;}
.hub-module.active{display:block;}

.metrics-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px;margin-bottom:24px;}
.metric-card{background:var(--card-bg);border:1px solid var(--border-color);border-radius:12px;padding:18px;
  box-shadow:0 1px 3px rgba(0,0,0,.03);display:flex;justify-content:space-between;align-items:flex-start;}
.metric-card p{font-size:.72rem;color:var(--text-muted);font-weight:700;text-transform:uppercase;margin-bottom:6px;letter-spacing:.3px;}
.metric-card h2{font-size:1.4rem;color:var(--text-main);font-weight:800;}
.metric-icon{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.05rem;flex-shrink:0;}

.card-table{background:var(--card-bg);border:1px solid var(--border-color);border-radius:12px;padding:20px;margin-bottom:24px;box-shadow:0 1px 3px rgba(0,0,0,.03);}
.card-table-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;flex-wrap:wrap;gap:10px;}
.card-table-header h3{font-size:.98rem;color:var(--navy);font-weight:800;}
.card-table-header .subtitle{font-size:.75rem;color:var(--text-muted);margin-top:2px;}

table{width:100%;border-collapse:collapse;text-align:left;}
th{padding:11px;font-size:.7rem;text-transform:uppercase;color:var(--text-muted);background:#f8fafc;border-bottom:2px solid var(--border-color);font-weight:800;letter-spacing:.3px;white-space:nowrap;}
td{padding:11px;font-size:.85rem;border-bottom:1px solid var(--border-color);color:#334155;}
tr:hover td{background:#fbfbfd;}
.table-scroll{overflow-x:auto;}

.badge{padding:4px 10px;border-radius:20px;font-size:.72rem;font-weight:700;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;}
.badge-green{background:var(--success-bg);color:var(--success-green);}
.badge-amber{background:var(--warning-bg);color:var(--warning-amber);}
.badge-orange{background:var(--risk-orange-bg);color:var(--risk-orange);}
.badge-red{background:var(--danger-bg);color:var(--danger-red);}

.btn-main{background:var(--navy);color:var(--gold-light);border:none;padding:9px 16px;border-radius:7px;font-weight:700;cursor:pointer;font-size:.82rem;display:inline-flex;align-items:center;gap:6px;transition:.2s;}
.btn-main:hover{background:var(--navy-hover);}
.btn-main:disabled{opacity:.5;cursor:not-allowed;}
.btn-secondary{background:#eef1f5;color:#334155;border:none;padding:7px 13px;border-radius:7px;font-weight:600;cursor:pointer;font-size:.78rem;display:inline-flex;align-items:center;gap:5px;}
.btn-secondary:hover{background:#e2e8f0;}
.btn-danger{background:var(--danger-bg);color:var(--danger-red);border:none;padding:7px 13px;border-radius:7px;font-weight:700;cursor:pointer;font-size:.78rem;}
.btn-gold{background:var(--gold);color:#1c2733;border:none;padding:9px 16px;border-radius:7px;font-weight:800;cursor:pointer;font-size:.82rem;display:inline-flex;align-items:center;gap:6px;}
.btn-gold:hover{background:var(--gold-light);}

.form-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:15px;}
.form-grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:15px;}
.form-grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:15px;}
.form-box{background:#f8fafc;border:1px solid var(--border-color);padding:16px;border-radius:10px;margin-bottom:16px;}
.form-box h4{font-size:.8rem;color:var(--navy);text-transform:uppercase;margin-bottom:12px;font-weight:800;border-bottom:2px solid var(--gold);padding-bottom:6px;letter-spacing:.3px;display:inline-block;}
.field label{display:block;font-size:.76rem;font-weight:700;color:#475569;margin-bottom:4px;}
.field label .req{color:var(--danger-red);}

.tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--border-color);flex-wrap:wrap;}
.tab-btn{padding:9px 16px;font-size:.8rem;font-weight:700;color:var(--text-muted);background:none;border:none;cursor:pointer;border-bottom:3px solid transparent;}
.tab-btn.active{color:var(--navy);border-bottom-color:var(--gold);}
.tab-content{display:none;}
.tab-content.active{display:block;}

.progress-bar-track{background:#e2e8f0;border-radius:10px;height:14px;width:100%;overflow:hidden;}
.progress-bar-fill{height:100%;border-radius:10px;transition:width .3s ease;}

.modal-overlay{position:fixed;inset:0;background:rgba(7,20,39,.72);display:none;justify-content:center;align-items:center;z-index:1000;padding:20px;}
.modal-overlay.open{display:flex;}
.modal-box{background:#fff;padding:26px;border-radius:14px;width:100%;max-width:820px;max-height:90vh;overflow-y:auto;color:var(--text-main);}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;padding-bottom:12px;border-bottom:2px solid var(--gold);}
.modal-header h3{color:var(--navy);font-size:1.05rem;font-weight:800;}
.modal-close{background:none;border:none;font-size:1.1rem;cursor:pointer;color:var(--text-muted);}

.chip-list{display:flex;flex-wrap:wrap;gap:8px;}
.chip{background:#eef1f5;border-radius:20px;padding:6px 12px;font-size:.78rem;font-weight:600;color:#334155;}

.status-dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px;}

.file-drop{border:2px dashed var(--border-color);border-radius:10px;padding:18px;text-align:center;color:var(--text-muted);font-size:.8rem;cursor:pointer;background:#fbfcfe;}
.file-drop:hover{border-color:var(--gold);color:var(--navy);}

#toast{position:fixed;bottom:22px;right:22px;background:var(--navy-deep);color:#fff;padding:13px 20px;border-radius:9px;
  border-left:4px solid var(--gold);display:none;z-index:2000;font-size:.88rem;box-shadow:0 10px 25px rgba(0,0,0,.25);max-width:320px;}
#toast.toast-error{border-left-color:var(--danger-red);}

.empty-state{text-align:center;padding:30px;color:var(--text-muted);font-size:.85rem;}
.risk-list-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border-color);font-size:.85rem;}
.risk-list-item:last-child{border-bottom:none;}

/* CARGA INICIAL */
#loading-overlay{position:fixed;inset:0;background:var(--navy-deep);display:flex;flex-direction:column;
  justify-content:center;align-items:center;z-index:5000;color:#fff;gap:14px;}
#loading-overlay .spinner{width:38px;height:38px;border:3px solid rgba(201,162,39,.25);border-top-color:var(--gold);
  border-radius:50%;animation:spin .8s linear infinite;}
#loading-overlay p{font-size:.82rem;color:var(--gold-light);letter-spacing:.3px;}
@keyframes spin{to{transform:rotate(360deg);}}

/* AVISO DE DATOS NUEVOS (sincronización de fondo) */
#banner-actualizacion{position:fixed;top:14px;left:50%;transform:translateX(-50%);display:none;
  align-items:center;gap:12px;background:var(--navy-deep);color:#fff;padding:10px 16px;border-radius:9px;
  border-left:4px solid var(--gold);z-index:1500;font-size:.83rem;box-shadow:0 10px 25px rgba(0,0,0,.25);}
#banner-actualizacion button{background:var(--gold);color:var(--navy-deep);border:none;padding:6px 12px;
  border-radius:6px;font-weight:800;font-size:.78rem;cursor:pointer;}
#banner-actualizacion button:hover{background:var(--gold-light);}

#sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:90;}

@media(max-width:900px){
  #view-app{grid-template-columns:1fr;}
  aside{
    position:fixed;left:-280px;top:0;bottom:0;width:262px;transition:left .25s ease;
    box-shadow:4px 0 20px rgba(0,0,0,.3);display:flex;
  }
  aside.mobile-active{left:0;}
  #sidebar-backdrop.active{display:block;}
  .btn-menu-mobile{display:inline-block;}
  .form-grid-3,.form-grid-4,.form-grid-2{grid-template-columns:1fr;}
  .content-container{padding:18px;}
}
</style>
</head>
<body>

<div id="loading-overlay">
  <div class="spinner"></div>
  <p>Cargando información de JORAN...</p>
</div>

<div id="sidebar-backdrop" onclick="toggleMenuMobile(false)"></div>

<div id="banner-actualizacion">
  <span><i class="fa-solid fa-circle-info"></i> Hay información nueva de otro dispositivo.</span>
  <button onclick="actualizarDatosManual()">Actualizar ahora</button>
</div>

<section id="view-login">
  <div class="login-card">
    <div class="logo-badge">JR</div>
    <h2>INVERSIONES JORAN</h2>
    <div class="tagline">Plataforma de gestión PyMEs</div>
    <div class="login-error" id="login-error"></div>
    <form onsubmit="realizarLogin(event)" id="form-login">
      <div class="form-group">
        <label>Rol de Usuario</label>
        <select id="selectRol" class="form-control" required onchange="handleRolChange()">
          <option value="" disabled selected>Seleccione rol...</option>
          <option value="client">Cliente (Mi Negocio &amp; Finanzas)</option>
          <option value="worker">Trabajador (Seguimientos &amp; Campo)</option>
          <option value="admin">Administrador (Control General &amp; Reportes)</option>
        </select>
      </div>
      <div class="form-group" id="grupo-entidad" style="display:none;">
        <label id="label-entidad">Seleccione su usuario</label>
        <select id="selectEntidad" class="form-control"></select>
      </div>
      <div class="form-group">
        <label>Nombre de Usuario</label>
        <input type="text" id="inputUsuario" class="form-control" required placeholder="Ingrese su nombre" readonly>
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <div class="password-field">
          <input type="password" id="inputPassword" class="form-control" required placeholder="Ingrese su contraseña" style="padding-right:42px;">
          <button type="button" class="password-toggle" onclick="togglePassword()"><i class="fa-solid fa-eye" id="password-eye"></i></button>
        </div>
      </div>
      <button type="submit" class="btn-login" id="btn-login"><i class="fa-solid fa-lock"></i> Acceder a la Plataforma</button>
    </form>
    <button type="button" class="btn-secondary" style="width:100%;margin-top:10px;background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(201,162,39,.35);" onclick="abrirModalCrearCuenta()"><i class="fa-solid fa-user-plus"></i> Crear cuenta de cliente</button>
    <p class="login-hint"><a href="javascript:void(0)" onclick="verPoliticaDatosLogin()" style="color:var(--gold-light);text-decoration:underline;">Política de Tratamiento de Datos</a></p>
  </div>
</section>

<div id="view-app">
  <aside id="app-sidebar">
    <div>
      <div class="brand-area">
        <div class="logo-badge">JR</div>
        <div class="brand-title">
          <h1>INVERSIONES JORAN</h1>
          <span>Portal PyMEs</span>
        </div>
      </div>
      <ul class="nav-menu" id="menuLateral"></ul>
    </div>
    <div class="sidebar-foot">JORAN S.A.S. &copy; 2026</div>
  </aside>

  <main>
    <header>
      <div class="header-left">
        <button class="btn-menu-mobile" onclick="toggleMenuMobile(true)" title="Abrir menú"><i class="fa-solid fa-bars"></i></button>
        <h2 id="titulo-pagina" style="font-size:1.1rem;font-weight:800;color:var(--navy);">Panel Principal</h2>
      </div>
      <div class="user-profile-widget">
        <div class="user-avatar" id="header-avatar-initials">US</div>
        <div>
          <div id="header-user-name" style="font-size:.86rem;font-weight:700;">Usuario</div>
          <div id="header-user-role" style="font-size:.7rem;color:var(--text-muted);">Rol</div>
        </div>
        <button onclick="actualizarDatosManual()" class="btn-secondary" style="margin-left:14px;" title="Traer los últimos datos guardados por otros dispositivos"><i class="fa-solid fa-rotate"></i></button>
        <button onclick="cerrarSesion()" class="btn-secondary" style="margin-left:6px;color:var(--danger-red);" title="Cerrar sesión"><i class="fa-solid fa-power-off"></i></button>
      </div>
    </header>
    <div class="content-container" id="content-container"></div>
  </main>
</div>

<div class="modal-overlay" id="modal-overlay" onclick="handleModalOverlayClick(event)">
  <div class="modal-box" id="modal-box"></div>
</div>

<div id="toast"><span id="toast-msg">Notificación</span></div>

<script>
/* =========================================================
   INVERSIONES JORAN - Lógica de la plataforma
   ========================================================= */

let SESSION = { rol: null, usuario: null, usuarioId: null, clienteId: null, trabajadorId: null, vista: null };
const CHARTS = {}; // Control centralizado para evitar errores de canvas en Chart.js

const DB = {
  clientes: [],
  trabajadores: [],
  seguimientos: [],
  usuarios: [],
  solicitudesInversion: [],
  pagos: [],
  alertas: [],
  notificaciones: [],
  solicitudesEdicion: [],
  auditoria: [],
  capital: { total: 50000000, recuperado: 0 },
  categorias: ['Tienda de barrio', 'Panadería', 'Barbería', 'Papelería', 'Restaurante', 'Ferretería', 'Otro'],
  parametros: {
    moneda: 'COP', periodoSeguimiento: 'Semanal', metaCumplimientoMinimo: 80, nombreEmpresa: 'INVERSIONES JORAN S.A.S.',
    mesesMinimoFuncionamiento: 6, puntajeMinimoAprobacion: 70, montoMaximoInversion: 20000000,
    reglamentoTexto: 'Toda inversión debe destinarse exclusivamente al fin declarado por el cliente. El incumplimiento de compromisos o el hallazgo de información inconsistente puede derivar en la suspensión del desembolso o la liquidación anticipada del contrato.',
    politicaDatos: 'INVERSIONES JORAN S.A.S. recolecta datos personales y financieros de clientes únicamente para evaluar, aprobar y hacer seguimiento a sus inversiones. La información se almacena de forma segura, solo el personal autorizado según su rol puede consultarla o modificarla, y no se comparte con terceros sin autorización del titular, salvo requerimiento legal. Los titulares pueden solicitar la consulta, corrección o eliminación de sus datos a través de su asesor JORAN.'
  },
  permisos: { client: {}, worker: {}, admin: {} },
  nextId: { cliente: 1, trabajador: 1, seguimiento: 1, usuario: 1, solicitud: 1, solicitudInversion: 1, pago: 1, alerta: 1, notificacion: 1 }
};

const SESSION_KEY = 'joran_sesion_v1';
const API_BASE = '';

let _guardadoPendiente = false;
let _guardadoEnCurso = false;
let _timerGuardadoRemoto = null;

function fechaHoyLocal() {
  const d = new Date();
  const year = d.getFullYear();
  const month = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
}

function guardarSesionLocal() {
  try { localStorage.setItem(SESSION_KEY, JSON.stringify(SESSION)); } catch (e) {}
}
function cargarSesionLocal() {
  try {
    const raw = localStorage.getItem(SESSION_KEY);
    if (!raw) return false;
    Object.assign(SESSION, JSON.parse(raw));
    return true;
  } catch (e) { return false; }
}

const DB_CACHE_KEY = 'joran_cache_db_v1';
function guardarCacheDB() {
  try { localStorage.setItem(DB_CACHE_KEY, JSON.stringify(DB)); } catch (e) { console.warn('LocalStorage al límite.', e); }
}
function cargarCacheDB() {
  try {
    const raw = localStorage.getItem(DB_CACHE_KEY);
    if (!raw) return false;
    Object.assign(DB, JSON.parse(raw));
    return true;
  } catch (e) { return false; }
}

async function cargarEstadoRemoto() {
  try {
    const res = await fetch(API_BASE + '/api/estado');
    if (!res.ok) throw new Error('Respuesta no válida del servidor');
    const datos = await res.json();
    if (_guardadoPendiente || _guardadoEnCurso) return { ok: true, cambio: false };
    let cambio = false;
    if (datos && typeof datos === 'object' && Object.keys(datos).length) {
      const anterior = JSON.stringify(DB);
      Object.assign(DB, datos);
      cambio = JSON.stringify(DB) !== anterior;
    }
    guardarCacheDB();
    return { ok: true, cambio };
  } catch (e) {
    return { ok: false, cambio: false };
  }
}

async function cargarEstadoRemotoConReintentos(intentos) {
  let resultado = { ok: false, cambio: false };
  for (let i = 0; i < intentos; i++) {
    resultado = await cargarEstadoRemoto();
    if (resultado.ok) return resultado;
    await new Promise(r => setTimeout(r, 1000));
  }
  return resultado;
}

function guardarEstado() {
  guardarSesionLocal();
  guardarCacheDB();
  _guardadoPendiente = true;
  clearTimeout(_timerGuardadoRemoto);
  _timerGuardadoRemoto = setTimeout(enviarEstadoRemoto, 700);
}

async function enviarEstadoRemoto() {
  if (_guardadoEnCurso) { _timerGuardadoRemoto = setTimeout(enviarEstadoRemoto, 700); return; }
  if (!_guardadoPendiente) return;
  _guardadoPendiente = false;
  _guardadoEnCurso = true;
  try {
    const res = await fetch(API_BASE + '/api/estado', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(DB)
    });
    if (!res.ok) throw new Error('El servidor rechazó el guardado');
  } catch (e) {
    _guardadoPendiente = true;
  } finally {
    _guardadoEnCurso = false;
  }
}

async function actualizarDatosManual() {
  mostrarNotificacion('Buscando datos actualizados...');
  const { ok } = await cargarEstadoRemoto();
  if (ok) {
    ocultarBannerActualizacion();
    const activo = document.querySelector('.nav-link.active');
    if (activo) activo.click();
    mostrarNotificacion('Datos actualizados');

}

/* ---------------- Utilidades ---------------- */
function infoSemanaISO(fechaStr) {
  const d = new Date((fechaStr || '') + 'T00:00:00');
  if (isNaN(d)) return null;
  const objetivo = new Date(d.valueOf());
  const diaNr = (d.getDay() + 6) % 7;
  objetivo.setDate(objetivo.getDate() - diaNr + 3);
  const primerJueves = new Date(objetivo.getFullYear(), 0, 4);
  const diff = objetivo - primerJueves;
  const semana = 1 + Math.round(diff / (7 * 24 * 60 * 60 * 1000));
  return { anio: objetivo.getFullYear(), semana };
}
function esMismaSemanaISO(fechaStr, referencia) {
  const info = infoSemanaISO(fechaStr);
  return !!(info && referencia && info.anio === referencia.anio && info.semana === referencia.semana);
}
function semanaActualLabel() {
  const info = infoSemanaISO(fechaHoyLocal());
  return info ? `Semana ${info.semana} · ${info.anio}` : '';
}

const copFormatter = new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', maximumFractionDigits: 0 });
function formatCOP(n) {
  return copFormatter.format(Number(n) || 0);
}

function fechaLarga(f) {
  if (!f) return '-';
  const d = new Date(f + 'T00:00:00');
  if (isNaN(d)) return f;
  return d.toLocaleDateString('es-CO', { day: '2-digit', month: '2-digit', year: 'numeric' });
}

function estadoInfo(estado) {
  const map = {
    normal: { label: 'Normal', cls: 'badge-green', dot: 'var(--success-green)', emoji: '🟢', desc: 'Negocio funcionando correctamente.' },
    atencion: { label: 'Atención', cls: 'badge-amber', dot: 'var(--warning-amber)', emoji: '🟡', desc: 'Ventas disminuyeron 10–20%.' },
    riesgo: { label: 'Riesgo', cls: 'badge-orange', dot: 'var(--risk-orange)', emoji: '🟠', desc: 'Problemas de liquidez, inventario o pagos.' },
    critico: { label: 'Crítico', cls: 'badge-red', dot: 'var(--danger-red)', emoji: '🔴', desc: 'Pérdidas, cierre, incumplimiento o información inconsistente.' }
  };
  return map[estado] || map.normal;
}
function badgeEstado(estado) {
  const info = estadoInfo(estado);
  return `<span class="badge ${info.cls}"><span class="status-dot" style="background:${info.dot}"></span>${info.label}</span>`;
}

function getCliente(id) { return DB.clientes.find(c => c.id === Number(id)); }
function getTrabajador(id) { return DB.trabajadores.find(t => t.id === Number(id)); }
function nombreTrabajador(id) { const t = getTrabajador(id); return escapeHTML(t ? t.nombre : 'Trabajador eliminado'); }
function nombreNegocio(id) { const c = getCliente(id); return escapeHTML(c ? c.negocio.nombre : 'Negocio eliminado'); }
function seguimientosDeCliente(id) { return DB.seguimientos.filter(s => s.clienteId === Number(id)).sort((a, b) => b.fecha.localeCompare(a.fecha)); }
function seguimientosDeTrabajador(id) { return DB.seguimientos.filter(s => s.trabajadorId === Number(id)).sort((a, b) => b.fecha.localeCompare(a.fecha)); }
function ultimoSeguimiento(clienteId) { const list = seguimientosDeCliente(clienteId); return list.length ? list[0] : null; }
function escapeHTML(str) {
  if (str === undefined || str === null) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}
function el(id) { return document.getElementById(id); }

function toggleMenuMobile(abrir) {
  const sidebar = el('app-sidebar');
  const backdrop = el('sidebar-backdrop');
  if (abrir === undefined) {
    sidebar.classList.toggle('mobile-active');
    backdrop.classList.toggle('active');
  } else {
    sidebar.classList.toggle('mobile-active', !!abrir);
    backdrop.classList.toggle('active', !!abrir);
  }
}

function registrarAuditoria(accion, detalle) {
  if (!DB.auditoria) DB.auditoria = [];
  const ahora = new Date();
  DB.auditoria.unshift({
    fecha: fechaHoyLocal(),
    hora: ahora.toTimeString().slice(0, 5),
    usuario: SESSION.usuario || 'Sistema',
    rol: SESSION.rol || '-',
    accion,
    detalle: detalle || ''
  });
  if (DB.auditoria.length > 300) DB.auditoria.length = 300;
}

function asegurarProcesoCliente(c) {
  if (!c.proceso) c.proceso = {};
  if (!c.proceso.requisitos) c.proceso.requisitos = { antiguedad: false, documentacion: false, evidenciaVentas: false, estadosFinancieros: false, referencias: false, visitaTrabajador: false, evaluacionRiesgo: false };
  if (!c.proceso.etapas) c.proceso.etapas = { contrato: false, desembolso: false, seguimientoSemanal: false, reporte: false, liquidacion: false, revisionMensual: false };
  return c.proceso;
}
function mesesDesde(fechaStr) {
  if (!fechaStr) return null;
  const d = new Date(fechaStr + 'T00:00:00');
  if (isNaN(d)) return null;
  const hoy = new Date();
  return Math.max(0, (hoy.getFullYear() - d.getFullYear()) * 12 + (hoy.getMonth() - d.getMonth()));
}

function mostrarNotificacion(msg, esError) {
  const toast = el('toast');
  el('toast-msg').innerText = msg;
  toast.classList.toggle('toast-error', !!esError);
  toast.style.display = 'block';
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => toast.style.display = 'none', 3200);
}

function openModal(titleHtml, bodyHtml) {
  el('modal-box').innerHTML = `
    <div class="modal-header">
      <h3>${titleHtml}</h3>
      <button class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    ${bodyHtml}`;
  el('modal-overlay').classList.add('open');
}
function closeModal() { el('modal-overlay').classList.remove('open'); guardarEstado(); }
function handleModalOverlayClick(e) { if (e.target === el('modal-overlay')) closeModal(); }
window.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

let _accionConfirmarPendiente = null;
function confirmarAccion(mensaje, callback) {
  _accionConfirmarPendiente = callback;
  openModal('Confirmar acción', `
    <p style="font-size:.88rem;color:#334155;margin-bottom:20px;">${escapeHTML(mensaje)}</p>
    <div style="display:flex;justify-content:flex-end;gap:10px;">
      <button class="btn-secondary" onclick="_accionConfirmarPendiente=null; closeModal();">Cancelar</button>
      <button class="btn-danger" onclick="ejecutarAccionConfirmada()">Sí, continuar</button>
    </div>
  `);
}
function ejecutarAccionConfirmada() {
  const cb = _accionConfirmarPendiente;
  _accionConfirmarPendiente = null;
  closeModal();
  if (cb) cb();
}

function switchTab(groupId, tabId, btn) {
  document.querySelectorAll(`[data-tabgroup="${groupId}"]`).forEach(elx => elx.classList.remove('active'));
  const target = el(tabId);
  if (target) target.classList.add('active');
  if (btn) {
    const parent = btn.parentElement;
    parent.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }
}

function crearGraficoSeguro(canvasId, config) {
  const ctx = document.getElementById(canvasId);
  if (!ctx || !window.Chart) return null;
  if (CHARTS[canvasId]) {
    CHARTS[canvasId].destroy();
  }
  CHARTS[canvasId] = new Chart(ctx, config);
  return CHARTS[canvasId];
}

/* ---------------- LOGIN ---------------- */
function hayAdminRegistrado() {
  return DB.usuarios.some(u => u.rol === 'admin');
}

function handleRolChange() {
  const rol = el('selectRol').value;
  const grupo = el('grupo-entidad');
  const label = el('label-entidad');
  const select = el('selectEntidad');
  const inputUsuario = el('inputUsuario');
  ocultarErrorLogin();

  const candidatos = DB.usuarios.filter(u => u.rol === rol && u.activo);

  if (rol === 'admin' && !hayAdminRegistrado()) {
    grupo.style.display = 'none';
    inputUsuario.value = 'Administrador';
    return;
  }

  grupo.style.display = 'block';
  label.innerText = rol === 'client' ? 'Seleccione su usuario (negocio)' : rol === 'worker' ? 'Seleccione su usuario' : 'Seleccione su usuario administrador';
  select.innerHTML = candidatos.length
    ? candidatos.map(u => `<option value="${u.id}">${escapeHTML(u.nombre)}${u.entidadNombre && u.entidadNombre !== '-' ? ' — ' + escapeHTML(u.entidadNombre) : ''}</option>`).join('')
    : `<option value="">No hay usuarios activos con este rol</option>`;
  select.onchange = () => {
    const u = DB.usuarios.find(x => x.id === Number(select.value));
    inputUsuario.value = u ? u.nombre : '';
  };
  const primero = DB.usuarios.find(x => x.id === Number(select.value));
  inputUsuario.value = primero ? primero.nombre : (candidatos[0] ? candidatos[0].nombre : '');
}

function togglePassword() {
  const pass = el('inputPassword');
  const eye = el('password-eye');
  const isHidden = pass.type === 'password';
  pass.type = isHidden ? 'text' : 'password';
  eye.classList.toggle('fa-eye', !isHidden);
  eye.classList.toggle('fa-eye-slash', isHidden);
}

function mostrarErrorLogin(msg) {
  const box = el('login-error');
  box.innerText = msg;
  box.classList.add('show');
}
function ocultarErrorLogin() {
  el('login-error').classList.remove('show');
}

async function realizarLogin(e) {
  e.preventDefault();
  ocultarErrorLogin();
  const rol = el('selectRol').value;
  const password = el('inputPassword').value;
  const btn = el('btn-login');

  if (!rol) { mostrarErrorLogin('Seleccione un rol para continuar.'); return; }
  if (!password) { mostrarErrorLogin('Ingrese su contraseña.'); return; }

  btn.disabled = true;
  await cargarEstadoRemoto();
  btn.disabled = false;

  const modoBootstrap = rol === 'admin' && !hayAdminRegistrado();

  if (!modoBootstrap) {
    const entidadId = el('selectEntidad').value ? Number(el('selectEntidad').value) : null;
    if (!entidadId) { mostrarErrorLogin('Seleccione su usuario en la lista.'); return; }
    const usuario = DB.usuarios.find(u => u.id === entidadId && u.rol === rol);
    if (!usuario || !usuario.activo) { mostrarErrorLogin('Este usuario no existe o está desactivado. Contacte al administrador.'); return; }
    if (usuario.password !== password) { mostrarErrorLogin('Contraseña incorrecta.'); return; }

    SESSION.rol = rol;
    SESSION.usuario = usuario.nombre;
    SESSION.usuarioId = usuario.id;
    SESSION.clienteId = rol === 'client' ? usuario.entidadId : null;
    SESSION.trabajadorId = rol === 'worker' ? usuario.entidadId : null;
    if (rol === 'client' && !getCliente(SESSION.clienteId)) { mostrarErrorLogin('Este usuario ya no tiene un negocio asociado. Contacte al administrador.'); return; }
    if (rol === 'worker' && !getTrabajador(SESSION.trabajadorId)) { mostrarErrorLogin('Este usuario ya no tiene un perfil de trabajador asociado. Contacte al administrador.'); return; }
  } else {
    SESSION.rol = 'admin';
    SESSION.usuario = 'Administrador';
    SESSION.usuarioId = null;
    SESSION.clienteId = null;
    SESSION.trabajadorId = null;
  }
  SESSION.vista = null;

  el('view-login').style.display = 'none';
  el('view-app').style.display = 'grid';
  el('header-user-name').innerText = SESSION.usuario;
  el('header-avatar-initials').innerText = SESSION.usuario.substring(0, 2).toUpperCase();

  if (rol === 'client') initClienteUI();
  else if (rol === 'worker') initTrabajadorUI();
  else if (rol === 'admin') initAdminUI();

  guardarSesionLocal();
  el('inputPassword').value = '';
  registrarAuditoria('Inicio de sesión', `Rol: ${nombreRol(rol)}${modoBootstrap ? ' (modo configuración inicial)' : ''}`);
  guardarEstado();
  mostrarNotificacion(modoBootstrap ? 'Sesión iniciada en modo configuración inicial. Crea tu usuario administrador en Configuración → Usuarios.' : 'Sesión iniciada con éxito');
}

function cerrarSesion() {
  if (SESSION.rol) registrarAuditoria('Cierre de sesión', `Rol: ${nombreRol(SESSION.rol)}`);
  el('view-app').style.display = 'none';
  el('view-login').style.display = 'flex';
  el('content-container').innerHTML = '';
  el('form-login').reset();
  el('grupo-entidad').style.display = 'none';
  ocultarErrorLogin();
  SESSION.rol = null; SESSION.usuario = null; SESSION.usuarioId = null; SESSION.clienteId = null; SESSION.trabajadorId = null; SESSION.vista = null;
  guardarEstado();
  mostrarNotificacion('Sesión finalizada');
}

function setMenu(items) {
  const menu = el('menuLateral');
  menu.innerHTML = items.map((it, i) =>
    `<li><a class="nav-link${i === 0 ? ' active' : ''}" data-id="${it.id}" onclick="navegar('${it.id}', this)"><i class="fa-solid ${it.icon}"></i> ${it.label}</a></li>`
  ).join('');
}

let CURRENT_ROLE_ROUTES = {};
function navegar(id, elx) {
  document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
  if (elx) elx.classList.add('active');
  const route = CURRENT_ROLE_ROUTES[id];
  if (!route) { mostrarNotificacion('Módulo en construcción'); return; }
  VISTA_ACTUAL = id;
  SESSION.vista = id;
  el('titulo-pagina').innerText = route.titulo;
  el('content-container').innerHTML = route.render();
  if (route.after) route.after();
  ocultarBannerActualizacion();
  toggleMenuMobile(false);
  guardarSesionLocal();
}

function navegarInicial(defaultId) {
  const destino = (SESSION.vista && CURRENT_ROLE_ROUTES[SESSION.vista]) ? SESSION.vista : defaultId;
  const linkDestino = document.querySelector(`#menuLateral .nav-link[data-id="${destino}"]`);
  navegar(destino, linkDestino);
}

function mostrarCargaInicial(mostrar) {
  const overlay = el('loading-overlay');
  if (overlay) overlay.style.display = mostrar ? 'flex' : 'none';
}

async function iniciarApp() {
  cargarSesionLocal();
  mostrarCargaInicial(true);
  cargarCacheDB();
  const { ok } = await cargarEstadoRemotoConReintentos(2);
  asegurarDatosNuevos();
  mostrarCargaInicial(false);

  const sesionValida = SESSION.rol && (
    (SESSION.rol === 'client' && getCliente(SESSION.clienteId)) ||
    (SESSION.rol === 'worker' && getTrabajador(SESSION.trabajadorId)) ||
    (SESSION.rol === 'admin' && (SESSION.usuarioId === null ? !hayAdminRegistrado() : DB.usuarios.some(u => u.id === SESSION.usuarioId && u.activo)))
  );

  if (sesionValida) {
    el('view-login').style.display = 'none';
    el('view-app').style.display = 'grid';
    el('header-user-name').innerText = SESSION.usuario || '';
    el('header-avatar-initials').innerText = (SESSION.usuario || 'US').substring(0, 2).toUpperCase();
    if (SESSION.rol === 'client') initClienteUI();
    else if (SESSION.rol === 'worker') initTrabajadorUI();
    else if (SESSION.rol === 'admin') initAdminUI();
    if (!ok) mostrarNotificacion('Sin conexión con el servidor: mostrando la última información guardada en este dispositivo.', true);
  } else if (!ok && SESSION.rol) {
    mostrarNotificacion('No se pudo conectar con el servidor para confirmar tu sesión.', true);
  } else {
    SESSION.rol = null; SESSION.usuario = null; SESSION.usuarioId = null; SESSION.clienteId = null; SESSION.trabajadorId = null;
  }
  setInterval(guardarSesionLocal, 2000);
  window.addEventListener('beforeunload', guardarSesionLocal);
}
document.addEventListener('DOMContentLoaded', iniciarApp);

const SOLICITUD_MAX_CHARS = 500;
function abrirModalSolicitarEdicion(clienteId) {
  openModal('Solicitar Edición de Datos del Negocio', `
    <p style="font-size:.85rem;color:var(--text-muted);margin-bottom:12px;">Describe el cambio que deseas solicitar. Un administrador de JORAN revisará tu solicitud y te responderá aquí mismo.</p>
    <div class="field" style="margin-bottom:6px;">
      <label>Detalle de la solicitud</label>
      <textarea class="form-control" rows="4" id="se-mensaje" maxlength="${SOLICITUD_MAX_CHARS}" oninput="el('se-contador').innerText = this.value.length + '/${SOLICITUD_MAX_CHARS}'" placeholder="Ej: Actualizar dirección del negocio, corregir número de empleados, etc."></textarea>
      <div style="text-align:right;font-size:.7rem;color:var(--text-muted);margin-top:3px;" id="se-contador">0/${SOLICITUD_MAX_CHARS}</div>
    </div>
    <button class="btn-main" onclick="enviarSolicitudEdicion(${clienteId})"><i class="fa-solid fa-paper-plane"></i> Enviar Solicitud</button>
  `);
}

function enviarSolicitudEdicion(clienteId) {
  const mensaje = el('se-mensaje').value.trim();
  if (!mensaje) { mostrarNotificacion('Describe el cambio que deseas solicitar', true); return; }
  if (mensaje.length > SOLICITUD_MAX_CHARS) { mostrarNotificacion(`El mensaje no puede superar ${SOLICITUD_MAX_CHARS} caracteres`, true); return; }
  const hayPendiente = DB.solicitudesEdicion.some(s => s.clienteId === clienteId && s.estado === 'Pendiente');
  if (hayPendiente) { mostrarNotificacion('Ya tienes una solicitud pendiente de respuesta. Espera a que el administrador la atienda antes de enviar otra.', true); return; }
  const c = getCliente(clienteId);
  DB.solicitudesEdicion.push({
    id: DB.nextId.solicitud++,
    clienteId,
    clienteNombre: c ? c.nombre : 'Cliente eliminado',
    negocioNombre: c ? c.negocio.nombre : '-',
    mensaje,
    fecha: fechaHoyLocal(),
    estado: 'Pendiente',
    respuesta: '',
    fechaRespuesta: null
  });
  crearNotificacion('admin', null, 'Solicitud de edición', `${c.negocio.nombre} solicitó actualizar sus datos.`, 'solicitud');
  closeModal();
  guardarEstado();
  mostrarNotificacion('Solicitud de edición enviada al Administrador');
  navegar('c-negocio');
}

function renderSolicitudesCliente(clienteId) {
  const list = DB.solicitudesEdicion.filter(s => s.clienteId === clienteId).sort((a, b) => b.fecha.localeCompare(a.fecha));

  return `
  <div class="card-table">
    <div class="card-table-header"><h3>Mis Solicitudes de Edición</h3></div>
    <div class="table-scroll"><table>
      <thead><tr><th>Fecha</th><th>Solicitud</th><th>Estado</th><th>Respuesta del Administrador</th></tr></thead>

        ${list.map(s => `<tr>
          <td>${fechaLarga(s.fecha)}</td>
          <td>${escapeHTML(s.mensaje)}</td>
          <td>${s.estado === 'Pendiente' ? '<span class="badge badge-amber">Pendiente</span>' : '<span class="badge badge-green">Atendida</span>'}</td>
          <td>${s.respuesta ? escapeHTML(s.respuesta) : '<span style="color:var(--text-muted);">Sin respuesta aún</span>'}</td>
        </tr>`).join('')}
      </tbody>
    </table></div>

}

function field(label, value, esHTML) {
  const vacio = value === undefined || value === null || value === '';

  return `<div class="field"><label>${label}</label><p style="font-size:.88rem;color:#334155;font-weight:600;">${seguro}</p></div>`;

function descargarContratoInversion(clienteId) {
  const c = getCliente(clienteId);
  if (!c) { mostrarNotificacion('No se encontró información del cliente', true); return; }
  const i = c.inversion;
  const contenido =
`RESUMEN DE CONTRATO DE INVERSIÓN
${DB.parametros.nombreEmpresa}
=====================================

Cliente: ${c.nombre}
Documento: ${c.documento || '-'}
Negocio: ${c.negocio.nombre}

Capital solicitado: ${formatCOP(i.solicitado)}
Capital aprobado: ${formatCOP(i.aprobado)}
Capital recibido: ${formatCOP(i.recibido)}

Fecha de inversión: ${fechaLarga(i.fecha)}
Tipo de inversión: ${i.tipo || '-'}
Participación de JORAN: ${i.participacion}%
Estado de la inversión: ${i.estado || '-'}
Rentabilidad acumulada: ${i.rentabilidad}%

Destino de la inversión:
${i.destino || '-'}

=====================================
Generado el: ${fechaLarga(fechaHoyLocal())}
`;
  const blob = new Blob([contenido], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `Contrato_${c.negocio.nombre.replace(/\s+/g, '_')}.txt`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  mostrarNotificacion('Contrato descargado correctamente');
}

function guardarPerfilCliente(id) {
  const c = getCliente(id);
  const correo = el('perfil-correo').value.trim();
  if (correo && !/^\S+@\S+\.\S+$/.test(correo)) { mostrarNotificacion('El correo ingresado no parece válido', true); return; }
  c.telefono = el('perfil-telefono').value.trim();
  c.correo = correo;
  c.direccion = el('perfil-direccion').value.trim();
  registrarAuditoria('Perfil de cliente actualizado', c.negocio.nombre);
  guardarEstado();
  mostrarNotificacion('Perfil actualizado correctamente');
}

function sugerirAlertaNegocio() {
  const selNeg = el('seg-negocio');
  const inputVentas = el('seg-ventas');
  const box = el('seg-sugerencia');
  if (!selNeg || !inputVentas || !box) return;
  const clienteId = Number(selNeg.value);
  const ventasActuales = Number(inputVentas.value);
  if (!ventasActuales) { box.style.display = 'none'; return; }
  const anterior = ultimoSeguimiento(clienteId);
  if (!anterior || !anterior.ventas) { box.style.display = 'none'; return; }
  const variacion = ((ventasActuales - anterior.ventas) / anterior.ventas) * 100;
  let sugerido = null;
  if (variacion <= -50) sugerido = 'critico';
  else if (variacion <= -20) sugerido = 'riesgo';
  else if (variacion <= -10) sugerido = 'atencion';
  else sugerido = 'normal';
  const info = estadoInfo(sugerido);
  box.style.display = 'block';
  box.innerHTML = `<i class="fa-solid fa-lightbulb"></i> Vs. la última semana (${formatCOP(anterior.ventas)}), esto es una variación de ${variacion.toFixed(1)}%. Sugerencia: ${info.emoji} ${info.label}. <button type="button" class="btn-secondary" style="padding:2px 8px;font-size:.7rem;margin-left:4px;" onclick="el('seg-estado').value='${sugerido}';">Usar sugerencia</button>`;
}

/* ---------------- Evidencias ---------------- */
let EVID_TEMP = { fotos: [], documentos: [], facturas: [] };
function resetEvidenciasTemp() { EVID_TEMP = { fotos: [], documentos: [], facturas: [] }; }

const EVID_MAX_BYTES = 8 * 1024 * 1024;

function comprimirImagen(file, maxAncho = 1280, calidad = 0.75) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > maxAncho) {
          height = Math.round(height * (maxAncho / width));
          width = maxAncho;
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', calidad));
      };
      img.onerror = () => resolve(e.target.result);
      img.src = e.target.result;
    };
    reader.onerror = () => resolve(null);
    reader.readAsDataURL(file);
  });
}

function handleFileSelect(inputEl, tipo) {
  const files = Array.from(inputEl.files || []);
  if (!files.length) return;

  const validos = [];
  files.forEach(f => {
    if (!f.type.startsWith('image/') && f.size > EVID_MAX_BYTES) {
      mostrarNotificacion(`"${f.name}" pesa más de 8MB y no se adjuntó`, true);
    } else {
      validos.push(f);
    }
  });
  if (!validos.length) { inputEl.value = ''; return; }

  const lecturas = validos.map(file => {
    if (file.type.startsWith('image/')) {
      return comprimirImagen(file).then(dataUrl => ({ name: file.name, dataUrl, isImage: true }));
    }
    return new Promise(resolve => {
      const reader = new FileReader();
      reader.onload = () => resolve({ name: file.name, dataUrl: reader.result, isImage: false });
      reader.readAsDataURL(file);
    });
  });
  Promise.all(lecturas).then(items => {
    EVID_TEMP[tipo] = EVID_TEMP[tipo].concat(items.filter(it => it.dataUrl));
    renderEvidenciaPreview(tipo);
    inputEl.value = '';
  });
}

function renderEvidenciaPreview(tipo) {
  const cont = el('preview-' + tipo);
  if (!cont) return;
  cont.innerHTML = EVID_TEMP[tipo].map((item, i) => {
    if (item.isImage) {
      return `<span class="chip" style="display:inline-flex;align-items:center;gap:6px;padding:4px 8px 4px 4px;">
        <img src="${item.dataUrl}" style="width:28px;height:28px;object-fit:cover;border-radius:5px;">
        ${escapeHTML(item.name.length > 14 ? item.name.slice(0, 12) + '…' : item.name)}
        <i class="fa-solid fa-xmark" style="cursor:pointer;color:var(--danger-red);" onclick="removeEvidenciaItem('${tipo}',${i})"></i>
      </span>`;
    }
    return `<span class="chip"><i class="fa-solid fa-paperclip"></i> ${escapeHTML(item.name.length > 18 ? item.name.slice(0, 16) + '…' : item.name)}
      <i class="fa-solid fa-xmark" style="cursor:pointer;color:var(--danger-red);margin-left:4px;" onclick="removeEvidenciaItem('${tipo}',${i})"></i></span>`;
  }).join('') || '<span style="font-size:.75rem;color:var(--text-muted);">Sin archivos adjuntos</span>';
}

function removeEvidenciaItem(tipo, idx) {
  EVID_TEMP[tipo].splice(idx, 1);
  renderEvidenciaPreview(tipo);
}

function guardarSeguimientoTrabajador(trabajadorId) {

  const nuevo = {
    id: DB.nextId.seguimiento++,
    clienteId: Number(el('seg-negocio').value),
    trabajadorId: trabajadorId,
    fecha: el('seg-fecha').value,
    semana: el('seg-semana').value.trim(),

    visitaRealizada: el('seg-visita').checked,
    proximaVisita: el('seg-proxima').value || null,
    ventas: Number(el('seg-ventas').value) || 0,
    gastos: Number(el('seg-gastos').value) || 0,
    utilidad: Number(el('seg-utilidad').value) || 0,
    inventario: Number(el('seg-inventario').value) || 0,
    flujoCaja: Number(el('seg-flujo').value) || 0,
    clientesAtendidos: Number(el('seg-clientes').value) || 0,

    estado: el('seg-estado').value,

  };

  const fotos = ev.fotos || [];

    return `<p style="font-size:.8rem;color:var(--text-muted);margin-bottom:10px;">No se adjuntaron evidencias en este seguimiento.</p>`;

      <div class="chip-list" style="margin-bottom:12px;">

      </div>`;
  }
  if (facturas.length) {
    html += `<p style="font-size:.76rem;font-weight:700;color:var(--navy);margin-bottom:6px;">Facturas (${facturas.length})</p>
      <div class="chip-list" style="margin-bottom:12px;">

      </div>`;
  }
  return html;
}

function adminStats() {
  const clientes = DB.clientes;
  const capitalInvertido = clientes.reduce((a, c) => a + (c.inversion ? c.inversion.aprobado : 0), 0);
  const negociosActivos = clientes.length;
  const negociosCriticos = clientes.filter(c => c.estado === 'critico').length;
  const negociosRiesgo = clientes.filter(c => c.estado === 'riesgo').length;
  const negociosAtencion = clientes.filter(c => c.estado === 'atencion').length;
  const negociosNormal = clientes.filter(c => c.estado === 'normal').length;
  const utilidadGenerada = clientes.reduce((a, c) => a + (c.resultados ? c.resultados.utilidad : 0), 0);
  const seguimientosRealizados = DB.seguimientos.length;
  const refSemana = infoSemanaISO(fechaHoyLocal());
  const totalAsignados = DB.trabajadores.reduce((a, t) => a + (t.negocios ? t.negocios.length : 0), 0);
  const hechosEstaSemana = new Set(DB.seguimientos.filter(s => esMismaSemanaISO(s.fecha, refSemana)).map(s => s.clienteId)).size;
  const seguimientosPendientes = totalAsignados - hechosEstaSemana;
  return { capitalInvertido, negociosActivos, negociosCriticos, negociosRiesgo, negociosAtencion, negociosNormal, utilidadGenerada, seguimientosRealizados, seguimientosPendientes: Math.max(0, seguimientosPendientes) };
}

function adminCapitalStats() {
  asegurarDatosNuevos();
  const invertido = DB.clientes.reduce((a, c) => a + (Number(c.inversion?.recibido) || 0), 0);
  const recuperado = DB.pagos.filter(p => p.tipo === 'recuperacion' || !p.tipo).reduce((a, p) => a + (Number(p.monto) || 0), 0);
  const gan = DB.clientes.reduce((a, c) => a + (Number(c.resultados?.utilidad) || 0) * (Number(c.inversion?.participacion) || 0) / 100, 0);
  const disp = Math.max(0, (Number(DB.capital.total) || 0) - invertido + recuperado);
  return { invertido, recuperado, gan, disp };
}

  });
  const pendientes = list.filter(s => s.estado === 'Pendiente').length;
  return `
  ${pendientes ? `<p style="font-size:.78rem;color:var(--warning-amber);font-weight:700;margin-bottom:10px;"><i class="fa-solid fa-circle-exclamation"></i> ${pendientes} solicitud${pendientes === 1 ? '' : 'es'} pendiente${pendientes === 1 ? '' : 's'} de respuesta</p>` : ''}

function atenderSolicitudEdicion(id) {
  const s = DB.solicitudesEdicion.find(x => x.id === id);
  if (!s) return;
  const respuestaEl = el('ar-respuesta');
  s.estado = 'Atendida';
  s.respuesta = respuestaEl ? respuestaEl.value.trim() : (s.respuesta || '');
  s.fechaRespuesta = fechaHoyLocal();
  registrarAuditoria('Solicitud de edición atendida', `${s.clienteNombre} — ${s.negocioNombre}`);
  closeModal();
  const tabla = el('tabla-solicitudes-edicion');
  if (tabla) tabla.innerHTML = tablaSolicitudesEdicion();
  mostrarNotificacion('Solicitud marcada como atendida');
}

function filtrarClientesAdmin(t) {
  const term = t.toLowerCase().trim();
  const f = DB.clientes.filter(c => c.nombre.toLowerCase().includes(term) || c.negocio.nombre.toLowerCase().includes(term) || (c.negocio.ciudad||'').toLowerCase().includes(term));

  if (tbody) tbody.innerHTML = renderFilasClientes(f);

function guardarNuevoCliente() {
  const nombre = el('nc-nombre').value.trim();
  const telefono = el('nc-telefono').value.trim();
  const negnombre = el('nc-negnombre').value.trim();
  if (!nombre) { mostrarNotificacion('Ingrese el nombre completo del cliente', true); return; }
  if (!telefono) { mostrarNotificacion('Ingrese el teléfono del cliente', true); return; }
  if (!negnombre) { mostrarNotificacion('Ingrese el nombre del negocio', true); return; }
  const correo = el('nc-correo').value.trim();
  if (correo && !/^\S+@\S+\.\S+$/.test(correo)) { mostrarNotificacion('El correo ingresado no parece válido', true); return; }

  const id = DB.nextId.cliente++;
  DB.clientes.push({
    id,
    nombre,
    documento: el('nc-documento').value.trim(),
    telefono,
    correo,
    direccion: el('nc-direccion').value.trim(),
    negocio: {
      nombre: negnombre,
      tipo: el('nc-negtipo').value,
      direccion: el('nc-negdireccion').value.trim(),
      ciudad: el('nc-ciudad').value.trim(),
      fechaInicio: el('nc-fechainicio').value,
      descripcion: el('nc-descripcion').value.trim(),
      empleados: Number(el('nc-empleados').value) || 1
    },
    inversion: {
      solicitado: Number(el('nc-solicitado').value) || 0,
      aprobado: Number(el('nc-aprobado').value) || 0,
      recibido: Number(el('nc-recibido').value) || 0,
      fecha: el('nc-fechainversion').value,
      tipo: el('nc-tipoinversion').value.trim(),
      participacion: Number(el('nc-participacion').value) || 0,
      destino: el('nc-destino').value.trim(),
      estado: 'Activa',
      rentabilidad: 0
    },
    resultados: { ventas: 0, gastos: 0, utilidad: 0, inventario: 0, deudas: 0, metas: 0 },
    estado: 'normal',
    proceso: { requisitos: { antiguedad: false, documentacion: false, evidenciaVentas: false, estadosFinancieros: false, referencias: false, visitaTrabajador: false, evaluacionRiesgo: false }, etapas: { contrato: false, desembolso: false, seguimientoSemanal: false, reporte: false, liquidacion: false, revisionMensual: false } }
  });
  registrarAuditoria('Cliente registrado', `${nombre} — ${negnombre}`);
  closeModal();
  mostrarNotificacion('Cliente registrado correctamente');
  navegar('a-clientes');
}

function eliminarCliente(id) {
  const c = getCliente(id);
  if (!c) return;
  confirmarAccion(`¿Eliminar a ${c.nombre} y su negocio "${c.negocio.nombre}"? Esta acción también eliminará sus seguimientos y no se puede deshacer.`, () => {
    DB.clientes = DB.clientes.filter(x => x.id !== id);
    DB.seguimientos = DB.seguimientos.filter(s => s.clienteId !== id);
    DB.trabajadores.forEach(t => { t.negocios = t.negocios.filter(nid => nid !== id); });
    DB.usuarios.forEach(u => { if (u.rol === 'client' && u.entidadId === id) u.activo = false; });
    registrarAuditoria('Cliente eliminado', `${c.nombre} — ${c.negocio.nombre}`);
    guardarEstado();
    mostrarNotificacion('Cliente eliminado correctamente');
    navegar('a-clientes');
  });
}

};
const ETAPAS_LABELS = {
  contrato: '1. Contrato firmado',
  desembolso: '2. Desembolso realizado',
  seguimientoSemanal: '3. Seguimiento semanal en curso',
  reporte: '4. Reporte entregado al cliente',

};

function renderProcesoInversion(c) {
  const p = asegurarProcesoCliente(c);
  const seguimientoAuto = seguimientosDeCliente(c.id).length > 0;
  const total = Object.keys(REQUISITOS_LABELS).length;
  const cumplidos = Object.keys(REQUISITOS_LABELS).filter(k => p.requisitos[k]).length;
  const puntaje = Math.round((cumplidos / total) * 100);
  const apto = puntaje >= DB.parametros.puntajeMinimoAprobacion;
  const meses = mesesDesde(c.negocio.fechaInicio);
  const antiguedadOk = meses === null || meses >= DB.parametros.mesesMinimoFuncionamiento;
  const excedeMax = c.inversion.aprobado > DB.parametros.montoMaximoInversion;

  return `
  <div class="form-box">
    <h4>Antes de Aprobar — Requisitos</h4>
    ${meses !== null ? `<p style="font-size:.78rem;margin-bottom:8px;color:${antiguedadOk ? 'var(--success-green)' : 'var(--danger-red)'};"><i class="fa-solid ${antiguedadOk ? 'fa-circle-check' : 'fa-circle-exclamation'}"></i> El negocio tiene ${meses} mes(es) de funcionamiento (mínimo del reglamento: ${DB.parametros.mesesMinimoFuncionamiento}).</p>` : ''}
    <div class="chip-list" style="margin-bottom:12px;">
      ${Object.keys(REQUISITOS_LABELS).map(k => `<label class="chip" style="cursor:pointer;display:inline-flex;align-items:center;gap:6px;">
        <input type="checkbox" id="req-${k}-${c.id}" ${p.requisitos[k] ? 'checked' : ''}> ${escapeHTML(REQUISITOS_LABELS[k])}
      </label>`).join('')}
    </div>
    <p style="font-size:.85rem;font-weight:700;color:${apto ? 'var(--success-green)' : 'var(--danger-red)'};">
      Puntaje: ${puntaje}% (mínimo para aprobar: ${DB.parametros.puntajeMinimoAprobacion}%) — ${apto ? 'Apto para aprobación' : 'No apto todavía'}
    </p>
    ${excedeMax ? `<p style="font-size:.78rem;color:var(--danger-red);"><i class="fa-solid fa-triangle-exclamation"></i> El capital aprobado (${formatCOP(c.inversion.aprobado)}) supera el monto máximo del reglamento (${formatCOP(DB.parametros.montoMaximoInversion)}).</p>` : ''}
    <button class="btn-main" onclick="guardarRequisitosProceso(${c.id})" style="margin-top:10px;"><i class="fa-solid fa-floppy-disk"></i> Guardar Requisitos</button>
  </div>
  <div class="form-box" style="margin-bottom:0;">
    <h4>Después de Aprobar — Etapas</h4>
    <div class="chip-list" style="margin-bottom:12px;">
      ${Object.keys(ETAPAS_LABELS).map(k => `<label class="chip" style="cursor:pointer;display:inline-flex;align-items:center;gap:6px;">
        <input type="checkbox" id="etapa-${k}-${c.id}" ${(k === 'seguimientoSemanal' ? seguimientoAuto : p.etapas[k]) ? 'checked' : ''} ${k === 'seguimientoSemanal' ? 'disabled' : ''}> ${escapeHTML(ETAPAS_LABELS[k])}
      </label>`).join('')}
    </div>
    <p style="font-size:.72rem;color:var(--text-muted);margin-bottom:10px;">El paso "Seguimiento semanal en curso" se marca solo cuando ya existe al menos un seguimiento registrado.</p>
    <button class="btn-main" onclick="guardarEtapasProceso(${c.id})"><i class="fa-solid fa-floppy-disk"></i> Guardar Etapas</button>
  </div>`;
}

function guardarRequisitosProceso(id) {
  const c = getCliente(id);
  if (!c) return;
  const p = asegurarProcesoCliente(c);
  Object.keys(REQUISITOS_LABELS).forEach(k => { const box = el(`req-${k}-${id}`); if (box) p.requisitos[k] = box.checked; });
  registrarAuditoria('Requisitos de inversión actualizados', c.negocio.nombre);
  guardarEstado();
  mostrarNotificacion('Requisitos actualizados correctamente');
}

function guardarEtapasProceso(id) {
  const c = getCliente(id);
  if (!c) return;
  const p = asegurarProcesoCliente(c);
  Object.keys(ETAPAS_LABELS).forEach(k => { if (k === 'seguimientoSemanal') return; const box = el(`etapa-${k}-${id}`); if (box) p.etapas[k] = box.checked; });
  p.etapas.seguimientoSemanal = seguimientosDeCliente(id).length > 0;
  registrarAuditoria('Etapas de inversión actualizadas', c.negocio.nombre);
  guardarEstado();
  mostrarNotificacion('Etapas actualizadas correctamente');
}

function guardarResultadosCliente(id) {
  const c = getCliente(id);
  if (!c) return;
  c.resultados.ventas = Number(el(`res-ventas-${id}`).value) || 0;
  c.resultados.gastos = Number(el(`res-gastos-${id}`).value) || 0;
  c.resultados.utilidad = Number(el(`res-utilidad-${id}`).value) || 0;
  c.resultados.inventario = Number(el(`res-inventario-${id}`).value) || 0;
  c.resultados.deudas = Number(el(`res-deudas-${id}`).value) || 0;
  c.resultados.metas = Number(el(`res-metas-${id}`).value) || 0;
  registrarAuditoria('Resultados de negocio editados', c.negocio.nombre);
  guardarEstado();
  mostrarNotificacion('Resultados del negocio actualizados');
}

function guardarNuevoTrabajador() {
  const nombre = el('nt-nombre').value.trim();
  const telefono = el('nt-telefono').value.trim();
  if (!nombre) { mostrarNotificacion('Ingrese el nombre del trabajador', true); return; }
  if (!telefono) { mostrarNotificacion('Ingrese el teléfono del trabajador', true); return; }
  const sel = Array.from(el('nt-negocios').selectedOptions).map(o => Number(o.value)).filter(v => !isNaN(v));
  DB.trabajadores.push({ id: DB.nextId.trabajador++, nombre, telefono, negocios: sel });
  registrarAuditoria('Trabajador registrado', nombre);
  closeModal();
  mostrarNotificacion('Trabajador registrado correctamente');
  navegar('a-trabajadores');
}

function eliminarTrabajador(id) {
  const t = getTrabajador(id);
  if (!t) return;
  confirmarAccion(`¿Eliminar al trabajador ${t.nombre}? Sus negocios asignados quedarán sin trabajador y sus seguimientos históricos se conservarán.`, () => {
    DB.trabajadores = DB.trabajadores.filter(x => x.id !== id);
    registrarAuditoria('Trabajador eliminado', t.nombre);
    DB.usuarios.forEach(u => { if (u.rol === 'worker' && u.entidadId === id) u.activo = false; });
    guardarEstado();
    mostrarNotificacion('Trabajador eliminado correctamente');
    navegar('a-trabajadores');
  });
}

function verTrabajadorDetalle(id) {
  const t = getTrabajador(id);
  if (!t) return;
  const negocios = t.negocios.map(nid => getCliente(nid)).filter(Boolean);
  const refSemana = infoSemanaISO(fechaHoyLocal());
  const pendientes = negocios.filter(c => !DB.seguimientos.some(s => s.clienteId === c.id && esMismaSemanaISO(s.fecha, refSemana)));
  openModal(`${escapeHTML(t.nombre)} — Trabajador de Campo`, `
    <div class="form-grid-2">${field('Teléfono', t.telefono)}${field('Negocios asignados', negocios.length)}</div>
    <div class="form-box">
      <h4>Negocios Asignados (editable)</h4>

      <select class="form-control" id="td-negocios" multiple size="8" ${DB.clientes.length ? '' : 'disabled'}>
        ${DB.clientes.length ? DB.clientes.map(c => `<option value="${c.id}" ${t.negocios.includes(c.id) ? 'selected' : ''}>${escapeHTML(c.negocio.nombre)} — ${escapeHTML(c.nombre)}</option>`).join('') : '<option value="">No hay clientes registrados</option>'}

    </div>

      <button class="btn-danger" onclick="eliminarTrabajador(${t.id})"><i class="fa-solid fa-trash"></i> Eliminar Trabajador</button>
    </div>
  `);

function guardarAsignacionesTrabajador(id) {
  const t = getTrabajador(id);

  const sel = Array.from(el('td-negocios').selectedOptions).map(o => Number(o.value)).filter(v => !isNaN(v));

  openModal('Registrar Nueva Inversión', `

    </div>

function guardarNuevaInversion() {
  const capital = Number(el('ni-capital').value) || 0;
  if (capital <= 0) { mostrarNotificacion('Ingrese un capital aprobado mayor a cero', true); return; }
  const c = getCliente(Number(el('ni-cliente').value));
  if (c) {
    const excedeMax = (c.inversion.aprobado + capital) > DB.parametros.montoMaximoInversion;
    c.inversion.aprobado += capital;
    c.inversion.recibido = c.inversion.aprobado;
    c.inversion.fecha = el('ni-fecha').value || c.inversion.fecha;
    c.inversion.tipo = el('ni-tipo').value.trim() || c.inversion.tipo;
    c.inversion.participacion = Number(el('ni-participacion').value) || c.inversion.participacion;
    registrarAuditoria('Inversión registrada', `${c.negocio.nombre} — ${formatCOP(capital)}`);
    if (excedeMax) mostrarNotificacion(`Atención: el capital aprobado total (${formatCOP(c.inversion.aprobado)}) supera el monto máximo del reglamento (${formatCOP(DB.parametros.montoMaximoInversion)})`, true);
  }
  closeModal();
  mostrarNotificacion('Inversión registrada correctamente');
  navegar('a-inversiones');
}

  crearGraficoSeguro('chart-ventas-negocio', {
    type: 'bar',
    data: { labels, datasets: [{ label: 'Ventas ($)', data: ventas, backgroundColor: '#0d2340' }] },
    options: { responsive: true, plugins: { legend: { display: false } } }
  });

  crearGraficoSeguro('chart-utilidad-negocio', {
    type: 'bar',
    data: { labels, datasets: [{ label: 'Utilidad ($)', data: utilidades, backgroundColor: '#0f9d58' }] },
    options: { responsive: true, plugins: { legend: { display: false } } }
  });

  if (DB.seguimientos.length) {
    const ordenados = [...DB.seguimientos].sort((a, b) => a.fecha.localeCompare(b.fecha));
    const semanasMap = {};
    ordenados.forEach(s => { semanasMap[s.semana] = (semanasMap[s.semana] || 0) + s.utilidad; });
    crearGraficoSeguro('chart-evolucion', {
      type: 'line',
      data: { labels: Object.keys(semanasMap), datasets: [{ label: 'Utilidad total ($)', data: Object.values(semanasMap), borderColor: '#c9a227', backgroundColor: 'rgba(201,162,39,0.1)', fill: true, tension: 0.3 }] },
      options: { responsive: true, plugins: { legend: { display: false } } }
    });
  }
}

function abrirModalRegistrarUsuario() {
  openModal('Registrar Nuevo Usuario', `
    <div class="form-grid-2">
      <div class="field"><label>Nombre <span class="req">*</span></label><input class="form-control" id="nu-nombre"></div>
      <div class="field"><label>Rol</label>
        <select class="form-control" id="nu-rol" onchange="handleRolUsuarioChange()">
          <option value="client">Cliente</option>
          <option value="worker">Trabajador</option>
          <option value="admin">Administrador</option>
        </select>
      </div>
    </div>
    <div class="form-grid-2">
      <div class="field" id="nu-grupo-entidad">
        <label>Negocio asociado</label>
        <select class="form-control" id="nu-entidad">${DB.clientes.map(c => `<option value="${c.id}">${escapeHTML(c.negocio.nombre)} — ${escapeHTML(c.nombre)}</option>`).join('') || '<option value="">No hay clientes registrados</option>'}</select>
      </div>
      <div class="field"><label>Contraseña de acceso <span class="req">*</span></label><input type="password" class="form-control" id="nu-password" placeholder="Mínimo 8 caracteres"></div>
    </div>
    <button class="btn-main" onclick="guardarNuevoUsuario()"><i class="fa-solid fa-floppy-disk"></i> Registrar Usuario</button>
  `);
}

function handleRolUsuarioChange() {
  const rol = el('nu-rol').value;
  const grupo = el('nu-grupo-entidad');
  const sel = el('nu-entidad');
  if (rol === 'client') {
    grupo.style.display = 'block';
    sel.innerHTML = DB.clientes.map(c => `<option value="${c.id}">${escapeHTML(c.negocio.nombre)} — ${escapeHTML(c.nombre)}</option>`).join('') || '<option value="">No hay clientes registrados</option>';
  } else if (rol === 'worker') {
    grupo.style.display = 'block';
    sel.innerHTML = DB.trabajadores.map(t => `<option value="${t.id}">${escapeHTML(t.nombre)}</option>`).join('') || '<option value="">No hay trabajadores registrados</option>';
  } else {
    grupo.style.display = 'none';
  }
}

function guardarNuevoUsuario() {
  const rol = el('nu-rol').value;
  const nombre = el('nu-nombre').value.trim();
  const password = el('nu-password').value;
  if (!nombre) { mostrarNotificacion('Ingrese el nombre del usuario', true); return; }
  if (!password || password.length < 8) { mostrarNotificacion('La contraseña debe tener al menos 8 caracteres', true); return; }

  let entidadId = null, entidadNombre = '-';
  if (rol === 'client') {
    entidadId = Number(el('nu-entidad').value) || null;
    const c = getCliente(entidadId);
    if (!c) { mostrarNotificacion('Seleccione un negocio válido para este cliente', true); return; }
    entidadNombre = c.negocio.nombre;
  }
  if (rol === 'worker') {
    entidadId = Number(el('nu-entidad').value) || null;
    const t = getTrabajador(entidadId);
    if (!t) { mostrarNotificacion('Seleccione un trabajador válido', true); return; }
    entidadNombre = t.nombre;
  }
  DB.usuarios.push({ id: DB.nextId.usuario++, nombre, rol, entidadId, entidadNombre, password, activo: true });
  registrarAuditoria('Usuario registrado', `${nombre} (${nombreRol(rol)})`);
  closeModal();
  mostrarNotificacion('Usuario registrado correctamente');
  navegar('a-configuracion');
  setTimeout(() => { const btn = document.querySelectorAll('#content-container .tab-btn')[1]; if (btn) btn.click(); }, 30);
}

function abrirModalMiPassword() {
  if (SESSION.rol !== 'admin' || !SESSION.usuarioId) {
    mostrarNotificacion('Solo un administrador autenticado puede cambiar su contraseña.', true);
    return;
  }
  const u = DB.usuarios.find(x => x.id === SESSION.usuarioId && x.rol === 'admin');
  if (!u) { mostrarNotificacion('No se encontró la cuenta de administrador actual.', true); return; }
  openModal('Cambiar mi contraseña de administrador', `
    <div class="field" style="margin-bottom:14px;"><label>Contraseña actual</label><input type="password" class="form-control" id="mi-pass-actual" autocomplete="current-password"></div>
    <div class="field" style="margin-bottom:14px;"><label>Nueva contraseña</label><input type="password" class="form-control" id="mi-pass-nueva" autocomplete="new-password" placeholder="Mínimo 8 caracteres"></div>
    <div class="field" style="margin-bottom:18px;"><label>Confirmar nueva contraseña</label><input type="password" class="form-control" id="mi-pass-confirmar" autocomplete="new-password"></div>
    <button class="btn-main" onclick="guardarMiPassword()"><i class="fa-solid fa-floppy-disk"></i> Guardar contraseña</button>
  `);
}

function guardarMiPassword() {
  const u = DB.usuarios.find(x => x.id === SESSION.usuarioId && x.rol === 'admin');
  if (!u) return;
  const actual = el('mi-pass-actual').value;
  const nueva = el('mi-pass-nueva').value;
  const confirmar = el('mi-pass-confirmar').value;
  if (actual !== u.password) { mostrarNotificacion('La contraseña actual no es correcta.', true); return; }
  if (!nueva || nueva.length < 8) { mostrarNotificacion('La nueva contraseña debe tener al menos 8 caracteres.', true); return; }
  if (nueva !== confirmar) { mostrarNotificacion('Las nuevas contraseñas no coinciden.', true); return; }
  u.password = nueva;
  registrarAuditoria('Administrador cambió su contraseña', u.nombre);
  guardarEstado();
  closeModal();
  mostrarNotificacion('Contraseña actualizada correctamente.');
}

function abrirModalCambiarPassword(id) {
  const u = DB.usuarios.find(x => x.id === id);
  if (!u) return;
  openModal(`Cambiar contraseña — ${escapeHTML(u.nombre)}`, `
    <div class="field" style="margin-bottom:14px;"><label>Nueva contraseña</label><input type="password" class="form-control" id="cp-password" placeholder="Mínimo 8 caracteres"></div>
    <button class="btn-main" onclick="guardarCambioPassword(${id})"><i class="fa-solid fa-floppy-disk"></i> Guardar Nueva Contraseña</button>
  `);
}
function guardarCambioPassword(id) {
  const u = DB.usuarios.find(x => x.id === id);
  if (!u) return;
  const password = el('cp-password').value;
  if (!password || password.length < 8) { mostrarNotificacion('La contraseña debe tener al menos 8 caracteres', true); return; }
  u.password = password;
  registrarAuditoria('Contraseña restablecida', u.nombre);
  guardarEstado();
  closeModal();
  mostrarNotificacion('Contraseña actualizada correctamente');
}

function toggleUsuarioActivo(id) {
  const u = DB.usuarios.find(x => x.id === id);
  if (!u) return;
  u.activo = !u.activo;
  registrarAuditoria(u.activo ? 'Usuario activado' : 'Usuario desactivado', u.nombre);
  guardarEstado();
  navegar('a-configuracion');
  setTimeout(() => { const btn = document.querySelectorAll('#content-container .tab-btn')[1]; if (btn) btn.click(); }, 30);

function eliminarUsuario(id) {
  confirmarAccion('¿Eliminar este usuario del directorio? Ya no podrá iniciar sesión.', () => {
    const u = DB.usuarios.find(x => x.id === id);
    DB.usuarios = DB.usuarios.filter(u => u.id !== id);

function descargarCopiaSeguridad() {
  const hoy = fechaHoyLocal();
  const contenido = JSON.stringify(DB, null, 2);
  const blob = new Blob([contenido], { type: 'application/json;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `Respaldo_JORAN_${hoy}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  registrarAuditoria('Copia de seguridad descargada', '');
  guardarEstado();
  mostrarNotificacion('Copia de seguridad descargada correctamente');
}
