<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INVERSIONES JORAN - Plataforma de Gestión PyMEs</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
:root{
  --navy-deep:#071427;
  --navy:#0d2340;
  --navy-mid:#123055;
  --navy-hover:#1a3d6b;
  --gold:#c9a227;
  --gold-light:#e0c05a;
  --bg-main:#f3f5f8;
  --card-bg:#ffffff;
  --text-main:#1c2733;
  --text-muted:#64748b;
  --border-color:#e2e8f0;
  --success-green:#0f9d58;
  --success-bg:#d9f2e6;
  --warning-amber:#b8860b;
  --warning-bg:#fbeecb;
  --risk-orange:#c05621;
  --risk-orange-bg:#fce3ce;
  --danger-red:#c0392b;
  --danger-bg:#fbe1de;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,sans-serif;}
body{background:var(--bg-main);color:var(--text-main);min-height:100vh;overflow-x:hidden;}
img.logo-img{display:block;object-fit:contain;}
.logo-badge{display:flex;align-items:center;justify-content:center;font-weight:800;letter-spacing:.5px;
  border-radius:50%;background:linear-gradient(160deg,var(--navy-mid) 0%,var(--navy-deep) 100%);
  color:var(--gold);border:2px solid var(--gold);flex-shrink:0;}

/* LOGIN */
#view-login{display:flex;justify-content:center;align-items:center;min-height:100vh;
  background:radial-gradient(circle at 30% 20%, #123055 0%, #071427 65%);padding:20px;}
.login-card{background:linear-gradient(160deg,var(--navy-mid) 0%,var(--navy-deep) 100%);border-radius:16px;padding:38px 32px;width:100%;max-width:430px;
  box-shadow:0 25px 60px -12px rgba(0,0,0,.6);text-align:center;color:#fff;
  border-top:4px solid var(--gold);border:1px solid rgba(201,162,39,.35);}
.login-card .logo-badge{width:90px;height:90px;margin:0 auto 14px auto;font-size:1.8rem;box-shadow:0 6px 14px rgba(0,0,0,.4);}
.login-card h2{font-size:1.25rem;font-weight:800;color:#fff;letter-spacing:.5px;margin-bottom:4px;}
.login-card .tagline{font-size:.7rem;color:var(--gold-light);text-transform:uppercase;font-weight:700;letter-spacing:1.5px;margin-bottom:24px;}
.form-group{text-align:left;margin-bottom:15px;}
.form-group label{display:block;font-size:.8rem;margin-bottom:6px;font-weight:600;color:var(--gold-light);letter-spacing:.2px;}
.login-card .form-control{background:rgba(255,255,255,.06);border:1px solid rgba(201,162,39,.4);color:#fff;}
.login-card .form-control::placeholder{color:rgba(255,255,255,.45);}
.login-card .form-control:focus{border-color:var(--gold);background:rgba(255,255,255,.1);}
.login-card select.form-control option{background:var(--navy-deep);color:#fff;}
.password-field{position:relative;}
.password-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:rgba(255,255,255,.55);cursor:pointer;font-size:.9rem;padding:0;}
.password-toggle:hover{color:var(--gold-light);}
.form-control{width:100%;border:1px solid var(--border-color);border-radius:8px;padding:10px 12px;font-size:.9rem;outline:none;background:#f8fafc;}
.form-control:focus{border-color:var(--navy);background:#fff;}
textarea.form-control{resize:vertical;font-family:inherit;}
.btn-login{width:100%;background:var(--gold);color:var(--navy-deep);border:none;padding:12px;border-radius:8px;
  font-weight:800;cursor:pointer;font-size:.95rem;transition:.2s;margin-top:8px;letter-spacing:.3px;}
.btn-login:hover{background:var(--gold-light);}
.btn-login:disabled{opacity:.55;cursor:not-allowed;}
.login-hint{font-size:.7rem;color:rgba(255,255,255,.5);margin-top:16px;}
.login-error{background:rgba(192,57,43,.18);border:1px solid rgba(192,57,43,.5);color:#ffd9d4;font-size:.78rem;
  padding:9px 12px;border-radius:8px;margin-bottom:14px;display:none;text-align:left;}
.login-error.show{display:block;}

/* APP LAYOUT */
#view-app{height:100vh;display:none;grid-template-columns:262px 1fr;position:relative;}
aside{background:linear-gradient(180deg,var(--navy-deep),var(--navy));color:#fff;padding:20px 15px;display:flex;flex-direction:column;justify-content:space-between;z-index:100;}
.brand-area{display:flex;align-items:center;gap:12px;padding-bottom:18px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:15px;}
.brand-area .logo-badge{width:42px;height:42px;font-size:.82rem;}
.brand-title h1{font-size:.92rem;letter-spacing:.4px;font-weight:800;}
.brand-title span{font-size:.62rem;color:var(--gold-light);text-transform:uppercase;font-weight:700;letter-spacing:.5px;}
.nav-menu{list-style:none;overflow-y:auto;max-height:calc(100vh - 145px);}
.nav-link{display:flex;align-items:center;gap:12px;padding:10px 14px;color:#c7d2e3;border-radius:8px;margin-bottom:3px;
  cursor:pointer;font-size:.86rem;font-weight:500;transition:.2s;text-decoration:none;}
.nav-link i{width:18px;text-align:center;font-size:.88rem;color:var(--gold-light);}
.nav-link.active,.nav-link:hover{background:rgba(201,162,39,.18);color:#fff;}
.sidebar-foot{font-size:.68rem;color:#7d8ba3;text-align:center;padding-top:10px;border-top:1px solid rgba(255,255,255,.08);}

main{display:flex;flex-direction:column;height:100vh;overflow-y:auto;background:var(--bg-main);}
header{background:var(--card-bg);border-bottom:1px solid var(--border-color);padding:13px 25px;
  display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 3px rgba(0,0,0,.03);position:sticky;top:0;z-index:50;}
.header-left{display:flex;align-items:center;gap:12px;}
.btn-menu-mobile{display:none;background:none;border:none;font-size:1.2rem;color:var(--navy);cursor:pointer;padding:6px;}
.user-profile-widget{display:flex;align-items:center;gap:10px;}
.user-avatar{width:36px;height:36px;background:var(--navy);color:var(--gold-light);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.8rem;}

.content-container{padding:26px 28px;max-width:1400px;margin:0 auto;width:100%;}

.metrics-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-bottom:20px;}
.metric-card{background:var(--card-bg);border:1px solid var(--border-color);border-radius:12px;padding:16px;
  box-shadow:0 1px 3px rgba(0,0,0,.03);display:flex;justify-content:space-between;align-items:flex-start;}
.metric-card p{font-size:.72rem;color:var(--text-muted);font-weight:700;text-transform:uppercase;margin-bottom:6px;letter-spacing:.3px;}
.metric-card h2{font-size:1.35rem;color:var(--text-main);font-weight:800;}
.metric-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0;}

.card-table{background:var(--card-bg);border:1px solid var(--border-color);border-radius:12px;padding:20px;margin-bottom:22px;box-shadow:0 1px 3px rgba(0,0,0,.03);}
.card-table-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;flex-wrap:wrap;gap:10px;}
.card-table-header h3{font-size:.98rem;color:var(--navy);font-weight:800;}
.card-table-header .subtitle{font-size:.75rem;color:var(--text-muted);margin-top:2px;}

table{width:100%;border-collapse:collapse;text-align:left;}
th{padding:10px 12px;font-size:.7rem;text-transform:uppercase;color:var(--text-muted);background:#f8fafc;border-bottom:2px solid var(--border-color);font-weight:800;letter-spacing:.3px;white-space:nowrap;}
td{padding:11px 12px;font-size:.84rem;border-bottom:1px solid var(--border-color);color:#334155;}
tr:hover td{background:#fbfbfd;}
.table-scroll{overflow-x:auto;}

.badge{padding:4px 10px;border-radius:20px;font-size:.72rem;font-weight:700;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;}
.badge-green{background:var(--success-bg);color:var(--success-green);}
.badge-amber{background:var(--warning-bg);color:var(--warning-amber);}
.badge-orange{background:var(--risk-orange-bg);color:var(--risk-orange);}
.badge-red{background:var(--danger-bg);color:var(--danger-red);}

.btn-main{background:var(--navy);color:var(--gold-light);border:none;padding:8px 15px;border-radius:7px;font-weight:700;cursor:pointer;font-size:.82rem;display:inline-flex;align-items:center;gap:6px;transition:.2s;}
.btn-main:hover{background:var(--navy-hover);}
.btn-main:disabled{opacity:.5;cursor:not-allowed;}
.btn-secondary{background:#eef1f5;color:#334155;border:none;padding:7px 12px;border-radius:7px;font-weight:600;cursor:pointer;font-size:.78rem;display:inline-flex;align-items:center;gap:5px;}
.btn-secondary:hover{background:#e2e8f0;}
.btn-danger{background:var(--danger-bg);color:var(--danger-red);border:none;padding:7px 12px;border-radius:7px;font-weight:700;cursor:pointer;font-size:.78rem;}
.btn-gold{background:var(--gold);color:#1c2733;border:none;padding:8px 15px;border-radius:7px;font-weight:800;cursor:pointer;font-size:.82rem;display:inline-flex;align-items:center;gap:6px;}
.btn-gold:hover{background:var(--gold-light);}

.form-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:12px;}
.form-grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:12px;}
.form-grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:12px;}
.form-box{background:#f8fafc;border:1px solid var(--border-color);padding:16px;border-radius:10px;margin-bottom:16px;}
.form-box h4{font-size:.8rem;color:var(--navy);text-transform:uppercase;margin-bottom:12px;font-weight:800;border-bottom:2px solid var(--gold);padding-bottom:6px;letter-spacing:.3px;display:inline-block;}
.field label{display:block;font-size:.76rem;font-weight:700;color:#475569;margin-bottom:4px;}
.field label .req{color:var(--danger-red);}

.tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--border-color);flex-wrap:wrap;}
.tab-btn{padding:9px 15px;font-size:.8rem;font-weight:700;color:var(--text-muted);background:none;border:none;cursor:pointer;border-bottom:3px solid transparent;}
.tab-btn.active{color:var(--navy);border-bottom-color:var(--gold);}
.tab-content{display:none;}
.tab-content.active{display:block;}

.progress-bar-track{background:#e2e8f0;border-radius:10px;height:14px;width:100%;overflow:hidden;}
.progress-bar-fill{height:100%;border-radius:10px;transition:width .3s ease;}

.modal-overlay{position:fixed;inset:0;background:rgba(7,20,39,.75);display:none;justify-content:center;align-items:center;z-index:1000;padding:20px;}
.modal-overlay.open{display:flex;}
.modal-box{background:#fff;padding:24px;border-radius:14px;width:100%;max-width:820px;max-height:90vh;overflow-y:auto;color:var(--text-main);box-shadow:0 20px 40px rgba(0,0,0,.3);}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:12px;border-bottom:2px solid var(--gold);}
.modal-header h3{color:var(--navy);font-size:1.05rem;font-weight:800;}
.modal-close{background:none;border:none;font-size:1.1rem;cursor:pointer;color:var(--text-muted);padding:4px;}

.chip-list{display:flex;flex-wrap:wrap;gap:8px;}
.chip{background:#eef1f5;border-radius:20px;padding:6px 12px;font-size:.78rem;font-weight:600;color:#334155;}
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;}

.file-drop{border:2px dashed var(--border-color);border-radius:10px;padding:16px;text-align:center;color:var(--text-muted);font-size:.8rem;cursor:pointer;background:#fbfcfe;}
.file-drop:hover{border-color:var(--gold);color:var(--navy);}

#toast{position:fixed;bottom:22px;right:22px;background:var(--navy-deep);color:#fff;padding:12px 18px;border-radius:9px;
  border-left:4px solid var(--gold);display:none;z-index:2000;font-size:.85rem;box-shadow:0 10px 25px rgba(0,0,0,.25);max-width:340px;}
#toast.toast-error{border-left-color:var(--danger-red);}

.empty-state{text-align:center;padding:25px;color:var(--text-muted);font-size:.85rem;}
.risk-list-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border-color);font-size:.85rem;}
.risk-list-item:last-child{border-bottom:none;}

#loading-overlay{position:fixed;inset:0;background:var(--navy-deep);display:flex;flex-direction:column;
  justify-content:center;align-items:center;z-index:5000;color:#fff;gap:14px;}
#loading-overlay .spinner{width:38px;height:38px;border:3px solid rgba(201,162,39,.25);border-top-color:var(--gold);
  border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

#sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:90;}

@media(max-width:900px){
  #view-app{grid-template-columns:1fr;}
  aside{position:fixed;top:0;left:-280px;bottom:0;width:260px;transition:left .25s ease;}
  aside.mobile-active{left:0;}
  #sidebar-backdrop.active{display:block;}
  .btn-menu-mobile{display:block;}
  .form-grid-3,.form-grid-4,.form-grid-2{grid-template-columns:1fr;}
  .content-container{padding:16px;}
}
</style>
</head>
<body>

<div id="loading-overlay">
  <div class="spinner"></div>
  <p style="font-size:.82rem;color:var(--gold-light);letter-spacing:.3px;">Cargando información de JORAN...</p>
</div>

<div id="sidebar-backdrop" onclick="toggleMenuMobile(false)"></div>

<section id="view-login">
  <div class="login-card">
    <div class="logo-badge">JR</div>
    <h2>INVERSIONES JORAN</h2>
    <div class="tagline">Plataforma de gestión PyMEs</div>
    <div class="login-error" id="login-error"></div>
    <form onsubmit="realizarLogin(event)" id="form-login">
      <div class="form-group">
        <label>Rol de Usuario</label>
        <select id="selectRol" class="form-control" required onchange="handleRolChange()">
          <option value="" disabled selected>Seleccione su rol...</option>
          <option value="client">Cliente (Mi Negocio &amp; Finanzas)</option>
          <option value="worker">Trabajador (Seguimientos &amp; Campo)</option>
          <option value="admin">Administrador (Control General &amp; Reportes)</option>
        </select>
      </div>
      <div class="form-group" id="grupo-entidad" style="display:none;">
        <label id="label-entidad">Seleccione su usuario</label>
        <select id="selectEntidad" class="form-control"></select>
      </div>
      <div class="form-group">
        <label>Nombre de Usuario</label>
        <input type="text" id="inputUsuario" class="form-control" required placeholder="Nombre de usuario" readonly>
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <div class="password-field">
          <input type="password" id="inputPassword" class="form-control" required placeholder="Ingrese su contraseña" style="padding-right:42px;">
          <button type="button" class="password-toggle" onclick="togglePassword()"><i class="fa-solid fa-eye" id="password-eye"></i></button>
        </div>
      </div>
      <button type="submit" class="btn-login" id="btn-login"><i class="fa-solid fa-lock"></i> Acceder a la Plataforma</button>
    </form>
    <button type="button" class="btn-secondary" style="width:100%;margin-top:10px;background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(201,162,39,.35);" onclick="abrirModalCrearCuenta()"><i class="fa-solid fa-user-plus"></i> Crear cuenta de cliente</button>
    <p class="login-hint"><a href="javascript:void(0)" onclick="verPoliticaDatosLogin()" style="color:var(--gold-light);text-decoration:underline;">Política de Tratamiento de Datos</a></p>
  </div>
</section>

<div id="view-app">
  <aside id="app-sidebar">
    <div>
      <div class="brand-area">
        <div class="logo-badge">JR</div>
        <div class="brand-title">
          <h1>INVERSIONES JORAN</h1>
          <span>Portal PyMEs</span>
        </div>
      </div>
      <ul class="nav-menu" id="menuLateral"></ul>
    </div>
    <div class="sidebar-foot">JORAN S.A.S. &copy; 2026</div>
  </aside>

  <main>
    <header>
      <div class="header-left">
        <button class="btn-menu-mobile" onclick="toggleMenuMobile(true)"><i class="fa-solid fa-bars"></i></button>
        <h2 id="titulo-pagina" style="font-size:1.05rem;font-weight:800;color:var(--navy);">Panel Principal</h2>
      </div>
      <div class="user-profile-widget">
        <div class="user-avatar" id="header-avatar-initials">US</div>
        <div>
          <div id="header-user-name" style="font-size:.85rem;font-weight:700;">Usuario</div>
          <div id="header-user-role" style="font-size:.7rem;color:var(--text-muted);">Rol</div>
        </div>
        <button onclick="actualizarDatosManual()" class="btn-secondary" style="margin-left:10px;" title="Actualizar datos"><i class="fa-solid fa-rotate"></i></button>
        <button onclick="cerrarSesion()" class="btn-secondary" style="margin-left:4px;color:var(--danger-red);" title="Cerrar sesión"><i class="fa-solid fa-power-off"></i></button>
      </div>
    </header>
    <div class="content-container" id="content-container"></div>
  </main>
</div>

<div class="modal-overlay" id="modal-overlay" onclick="handleModalOverlayClick(event)">
  <div class="modal-box" id="modal-box"></div>
</div>

<div id="toast"><span id="toast-msg">Notificación</span></div>

<script>
/* =========================================================
   INVERSIONES JORAN - Motor Completo de la Plataforma
   ========================================================= */

let SESSION = { rol: null, usuario: null, usuarioId: null, clienteId: null, trabajadorId: null, vista: null };
const CHARTS = {}; // Gestor de instancias de Chart.js para evitar errores de canvas

const DB = {
  clientes: [],
  trabajadores: [],
  seguimientos: [],
  usuarios: [],
  solicitudesInversion: [],
  pagos: [],
  alertas: [],
  notificaciones: [],
  solicitudesEdicion: [],
  auditoria: [],
  capital: { total: 50000000, recuperado: 0 },
  categorias: ['Tienda de barrio', 'Panadería', 'Barbería', 'Papelería', 'Restaurante', 'Ferretería', 'Droguería', 'Otro'],
  parametros: {
    moneda: 'COP', periodoSeguimiento: 'Semanal', metaCumplimientoMinimo: 80, nombreEmpresa: 'INVERSIONES JORAN S.A.S.',
    mesesMinimoFuncionamiento: 6, puntajeMinimoAprobacion: 70, montoMaximoInversion: 20000000,
    reglamentoTexto: 'Toda inversión debe destinarse exclusivamente al fin declarado por el cliente. El incumplimiento de compromisos o el hallazgo de información inconsistente puede derivar en la suspensión del desembolso o la liquidación anticipada del contrato.',
    politicaDatos: 'INVERSIONES JORAN S.A.S. recolecta datos personales y financieros de clientes únicamente para evaluar, aprobar y hacer seguimiento a sus inversiones. La información se almacena de forma segura, solo el personal autorizado según su rol puede consultarla o modificarla, y no se comparte con terceros sin autorización del titular, salvo requerimiento legal.'
  },
  permisos: { client: {}, worker: {}, admin: {} },
  nextId: { cliente: 1, trabajador: 1, seguimiento: 1, usuario: 1, solicitud: 1, solicitudInversion: 1, pago: 1, alerta: 1, notificacion: 1 }
};

const SESSION_KEY = 'joran_sesion_v3';
const DB_CACHE_KEY = 'joran_cache_db_v3';
const API_BASE = '';

let _guardadoPendiente = false;
let _guardadoEnCurso = false;
let _timerGuardadoRemoto = null;
let VISTA_ACTUAL = null;
let CURRENT_ROLE_ROUTES = {};

/* ---------------- Utilidades de Fecha y Formato ---------------- */
function fechaHoyLocal() {
  const d = new Date();
  const year = d.getFullYear();
  const month = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
}

const copFormatter = new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', maximumFractionDigits: 0 });
function formatCOP(n) { return copFormatter.format(Number(n) || 0); }

function fechaLarga(f) {
  if (!f) return '-';
  const d = new Date(f + 'T00:00:00');
  return isNaN(d) ? f : d.toLocaleDateString('es-CO', { day: '2-digit', month: '2-digit', year: 'numeric' });
}

function estadoInfo(estado) {
  const map = {
    normal: { label: 'Normal', cls: 'badge-green', dot: 'var(--success-green)', emoji: '🟢', desc: 'Negocio funcionando correctamente.' },
    atencion: { label: 'Atención', cls: 'badge-amber', dot: 'var(--warning-amber)', emoji: '🟡', desc: 'Ventas disminuyeron 10–20%.' },
    riesgo: { label: 'Riesgo', cls: 'badge-orange', dot: 'var(--risk-orange)', emoji: '🟠', desc: 'Problemas de liquidez, inventario o pagos.' },
    critico: { label: 'Crítico', cls: 'badge-red', dot: 'var(--danger-red)', emoji: '🔴', desc: 'Pérdidas, cierre, incumplimiento o inconsistencia.' }
  };
  return map[estado] || map.normal;
}
function badgeEstado(estado) {
  const info = estadoInfo(estado);
  return `<span class="badge ${info.cls}"><span class="status-dot" style="background:${info.dot}"></span>${info.label}</span>`;
}

function el(id) { return document.getElementById(id); }
function escapeHTML(str) {
  if (str === undefined || str === null) return '';
  return String(str).replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[m]);
}

function getCliente(id) { return DB.clientes.find(c => c.id === Number(id)); }
function getTrabajador(id) { return DB.trabajadores.find(t => t.id === Number(id)); }
function nombreTrabajador(id) { const t = getTrabajador(id); return escapeHTML(t ? t.nombre : 'Trabajador'); }
function nombreNegocio(id) { const c = getCliente(id); return escapeHTML(c ? c.negocio.nombre : 'Negocio'); }
function seguimientosDeCliente(id) { return DB.seguimientos.filter(s => s.clienteId === Number(id)).sort((a,b) => b.fecha.localeCompare(a.fecha)); }
function seguimientosDeTrabajador(id) { return DB.seguimientos.filter(s => s.trabajadorId === Number(id)).sort((a,b) => b.fecha.localeCompare(a.fecha)); }
function ultimoSeguimiento(clienteId) { const list = seguimientosDeCliente(clienteId); return list.length ? list[0] : null; }

function infoSemanaISO(fechaStr) {
  const d = new Date((fechaStr || '') + 'T00:00:00');
  if (isNaN(d)) return null;
  const target = new Date(d.valueOf());
  const dayNr = (d.getDay() + 6) % 7;
  target.setDate(target.getDate() - dayNr + 3);
  const firstThursday = new Date(target.getFullYear(), 0, 4);
  return { anio: target.getFullYear(), semana: 1 + Math.round((target - firstThursday) / (7 * 86400000)) };
}
function esMismaSemanaISO(fechaStr, referencia) {
  const info = infoSemanaISO(fechaStr);
  return !!(info && referencia && info.anio === referencia.anio && info.semana === referencia.semana);
}
function semanaActualLabel() {
  const info = infoSemanaISO(fechaHoyLocal());
  return info ? `Semana ${info.semana} · ${info.anio}` : 'Semana Actual';
}

function mesesDesde(fechaStr) {
  if (!fechaStr) return null;
  const d = new Date(fechaStr + 'T00:00:00');
  if (isNaN(d)) return null;
  const hoy = new Date();
  return Math.max(0, (hoy.getFullYear() - d.getFullYear()) * 12 + (hoy.getMonth() - d.getMonth()));
}

}

/* ---------------- Persistencia ---------------- */
function guardarSesionLocal() {
  try { localStorage.setItem(SESSION_KEY, JSON.stringify(SESSION)); } catch (e) {}
}
function cargarSesionLocal() {
  try {
    const raw = localStorage.getItem(SESSION_KEY);
    if (raw) Object.assign(SESSION, JSON.parse(raw));
  } catch (e) {}
}

function guardarCacheDB() {
  try {
    localStorage.setItem(DB_CACHE_KEY, JSON.stringify(DB));
  } catch (e) {
    console.warn('LocalStorage lleno por evidencias fotográficas.', e);
  }
}
function cargarCacheDB() {
  try {
    const raw = localStorage.getItem(DB_CACHE_KEY);
    if (raw) Object.assign(DB, JSON.parse(raw));
  } catch (e) {}
}

async function cargarEstadoRemoto() {
  try {
    const res = await fetch(API_BASE + '/api/estado');
    if (!res.ok) return { ok: false };
    const datos = await res.json();
    if (datos && typeof datos === 'object' && Object.keys(datos).length) {
      Object.assign(DB, datos);
      guardarCacheDB();
      return { ok: true };
    }
  } catch (e) {
    return { ok: false };
  }
  return { ok: false };
}

function guardarEstado() {
  guardarSesionLocal();
  guardarCacheDB();
  _guardadoPendiente = true;
  clearTimeout(_timerGuardadoRemoto);
  _timerGuardadoRemoto = setTimeout(enviarEstadoRemoto, 750);
}

async function enviarEstadoRemoto() {
  if (_guardadoEnCurso || !_guardadoPendiente) return;
  _guardadoPendiente = false;
  _guardadoEnCurso = true;
  try {
    await fetch(API_BASE + '/api/estado', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(DB)
    });
  } catch (e) {
    _guardadoPendiente = true;
  } finally {
    _guardadoEnCurso = false;
  }
}

async function actualizarDatosManual() {
  mostrarNotificacion('Buscando datos actualizados...');
  const { ok } = await cargarEstadoRemoto();
  if (ok) {
    const activo = document.querySelector('.nav-link.active');
    if (activo) activo.click();
    mostrarNotificacion('Datos actualizados');
  } else {
    mostrarNotificacion('Modo local: datos cargados de este dispositivo');
  }
}

function registrarAuditoria(accion, detalle) {
  if (!DB.auditoria) DB.auditoria = [];
  const d = new Date();
  DB.auditoria.unshift({
    fecha: fechaHoyLocal(),
    hora: d.toTimeString().slice(0, 5),
    usuario: SESSION.usuario || 'Sistema',
    rol: SESSION.rol || '-',
    accion,
    detalle: detalle || ''
  });
  if (DB.auditoria.length > 300) DB.auditoria.length = 300;
}

function crearNotificacion(rol, entidadId, titulo, mensaje, tipo) {
  if (!DB.notificaciones) DB.notificaciones = [];
  DB.notificaciones.unshift({
    id: DB.nextId.notificacion++,
    rol,
    entidadId,
    titulo,
    mensaje,
    tipo: tipo || 'info',
    leida: false,
    fecha: fechaHoyLocal()
  });
}

function asegurarProcesoCliente(c) {
  if (!c.proceso) c.proceso = {};
  if (!c.proceso.requisitos) c.proceso.requisitos = { antiguedad: false, documentacion: false, evidenciaVentas: false, estadosFinancieros: false, referencias: false, visitaTrabajador: false, evaluacionRiesgo: false };
  if (!c.proceso.etapas) c.proceso.etapas = { contrato: false, desembolso: false, seguimientoSemanal: false, reporte: false, liquidacion: false, revisionMensual: false };
  return c.proceso;
}

function asegurarDatosNuevos() {
  DB.solicitudesInversion = Array.isArray(DB.solicitudesInversion) ? DB.solicitudesInversion : [];
  DB.pagos = Array.isArray(DB.pagos) ? DB.pagos : [];
  DB.alertas = Array.isArray(DB.alertas) ? DB.alertas : [];
  DB.notificaciones = Array.isArray(DB.notificaciones) ? DB.notificaciones : [];
  DB.solicitudesEdicion = Array.isArray(DB.solicitudesEdicion) ? DB.solicitudesEdicion : [];
  DB.capital = DB.capital || { total: 50000000, recuperado: 0 };
  DB.nextId = DB.nextId || {};
  ['solicitudInversion','pago','alerta','notificacion','solicitud'].forEach(k => { if (!DB.nextId[k]) DB.nextId[k] = 1; });
  DB.clientes.forEach(c => {
    c.resultados = c.resultados || { ventas: 0, gastos: 0, utilidad: 0, inventario: 0, deudas: 0, metas: 0 };
    c.inversion = c.inversion || { solicitado: 0, aprobado: 0, recibido: 0, fecha: '', tipo: '', participacion: 0, destino: '', estado: 'Pendiente', rentabilidad: 0 };
    asegurarProcesoCliente(c);
  });
  asegurarPermisosDefault();
}

/* ---------------- Login ---------------- */
function hayAdminRegistrado() { return DB.usuarios.some(u => u.rol === 'admin'); }

function handleRolChange() {
  const rol = el('selectRol').value;
  const grupo = el('grupo-entidad');
  const sel = el('selectEntidad');
  const inp = el('inputUsuario');
  el('login-error').classList.remove('show');

  const candidatos = DB.usuarios.filter(u => u.rol === rol && u.activo);
  if (rol === 'admin' && !hayAdminRegistrado()) {
    grupo.style.display = 'none';
    inp.value = 'Administrador Inicial';
    return;
  }
  grupo.style.display = 'block';
  sel.innerHTML = candidatos.length
    ? candidatos.map(u => `<option value="${u.id}">${escapeHTML(u.nombre)} ${u.entidadNombre && u.entidadNombre !== '-' ? '— ' + escapeHTML(u.entidadNombre) : ''}</option>`).join('')
    : `<option value="">No hay usuarios registrados</option>`;
  sel.onchange = () => {
    const u = DB.usuarios.find(x => x.id === Number(sel.value));
    inp.value = u ? u.nombre : '';
  };
  const primero = DB.usuarios.find(x => x.id === Number(sel.value));
  inp.value = primero ? primero.nombre : (candidatos[0] ? candidatos[0].nombre : '');
}

function togglePassword() {
  const p = el('inputPassword');
  const eye = el('password-eye');
  const isHide = p.type === 'password';
  p.type = isHide ? 'text' : 'password';
  eye.className = isHide ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
}

function realizarLogin(e) {
  e.preventDefault();
  const rol = el('selectRol').value;
  const pass = el('inputPassword').value;
  const isBootstrap = rol === 'admin' && !hayAdminRegistrado();

  if (!isBootstrap) {
    const uid = Number(el('selectEntidad').value);
    const u = DB.usuarios.find(x => x.id === uid && x.rol === rol);
    if (!u || !u.activo) {
      el('login-error').innerText = 'Usuario no encontrado o desactivado.';
      el('login-error').classList.add('show');
      return;
    }
    if (u.password !== pass) {
      el('login-error').innerText = 'Contraseña incorrecta.';
      el('login-error').classList.add('show');
      return;
    }
    SESSION = { rol, usuario: u.nombre, usuarioId: u.id, clienteId: u.entidadId, trabajadorId: u.entidadId, vista: null };
  } else {
    SESSION = { rol: 'admin', usuario: 'Administrador Inicial', usuarioId: null, clienteId: null, trabajadorId: null, vista: null };
  }

  el('view-login').style.display = 'none';
  el('view-app').style.display = 'grid';
  el('header-user-name').innerText = SESSION.usuario;
  el('header-avatar-initials').innerText = (SESSION.usuario || 'US').slice(0,2).toUpperCase();

  if (rol === 'client') initClienteUI();
  else if (rol === 'worker') initTrabajadorUI();
  else initAdminUI();

  guardarSesionLocal();
  registrarAuditoria('Inicio de sesión', `Rol: ${rol}`);
  guardarEstado();
}

function cerrarSesion() {
  SESSION = { rol: null, usuario: null, usuarioId: null, clienteId: null, trabajadorId: null, vista: null };
  guardarSesionLocal();
  el('view-app').style.display = 'none';
  el('view-login').style.display = 'flex';
  el('form-login').reset();
  el('grupo-entidad').style.display = 'none';
}

function setMenu(items) {
  el('menuLateral').innerHTML = items.map((it, i) =>
    `<li><a class="nav-link ${i===0?'active':''}" data-id="${it.id}" onclick="navegar('${it.id}', this)"><i class="fa-solid ${it.icon}"></i> ${it.label}</a></li>`
  ).join('');
}

function navegar(id, linkEl) {
  document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
  if (linkEl) linkEl.classList.add('active');
  const route = CURRENT_ROLE_ROUTES[id];
  if (!route) return;
  VISTA_ACTUAL = id;
  SESSION.vista = id;
  el('titulo-pagina').innerText = route.titulo;
  el('content-container').innerHTML = route.render();
  if (route.after) route.after();
  toggleMenuMobile(false);
  guardarSesionLocal();
}

function field(label, value, esHTML) {
  const vacio = value === undefined || value === null || value === '';
  const seguro = vacio ? '-' : (esHTML ? value : escapeHTML(value));
  return `<div class="field"><label>${label}</label><p style="font-size:.85rem;color:#334155;font-weight:600;">${seguro}</p></div>`;
}

function metricCard(icon, bg, color, label, value, sub, subcolor) {
  return `<div class="metric-card"><div><p>${label}</p><h2>${value}</h2>${sub ? `<small style="color:${subcolor||'var(--text-muted)'};font-size:.73rem;">${escapeHTML(sub)}</small>` : ''}</div><div class="metric-icon" style="background:${bg};color:${color};"><i class="fa-solid ${icon}"></i></div></div>`;
}

  const mensaje = el('se-mensaje').value.trim();

  const c = getCliente(clienteId);
  DB.solicitudesEdicion.push({
    id: DB.nextId.solicitud++,
    clienteId,
    clienteNombre: c ? c.nombre : 'Cliente',
    negocioNombre: c ? c.negocio.nombre : '-',
    mensaje,
    fecha: fechaHoyLocal(),
    estado: 'Pendiente',
    respuesta: '',
    fechaRespuesta: null
  });
  crearNotificacion('admin', null, 'Solicitud de edición', `${c.negocio.nombre} solicitó actualizar sus datos.`, 'solicitud');
  closeModal();
  guardarEstado();
  mostrarNotificacion('Solicitud enviada al Administrador');
  navegar('c-negocio');
}

  const monto = Number(el('si-monto').value) || 0;
  const dest = el('si-dest').value.trim();
  const tipo = el('si-tipo').value.trim() || 'Expansión';
  const c = getCliente(clienteId);

  DB.solicitudesInversion.unshift({
    id: DB.nextId.solicitudInversion++,
    clienteId,
    clienteNombre: c.nombre,
    negocioNombre: c.negocio.nombre,
    montoSolicitado: monto,
    destino: dest,
    tipo,
    estado: 'Pendiente',
    comentario: '',

  });
  crearNotificacion('admin', null, 'Nueva solicitud de inversión', `${c.negocio.nombre} solicita ${formatCOP(monto)}.`, 'solicitud');

  closeModal();
  mostrarNotificacion('Solicitud enviada exitosamente');

function sugerirAlertaNegocio() {
  const cid = Number(el('seg-negocio').value);
  const ventas = Number(el('seg-ventas').value) || 0;
  const box = el('seg-sugerencia');
  if (!ventas) { box.style.display = 'none'; return; }
  const ant = ultimoSeguimiento(cid);
  if (!ant || !ant.ventas) { box.style.display = 'none'; return; }

  const diff = ((ventas - ant.ventas) / ant.ventas) * 100;
  let sug = 'normal';
  if (diff <= -50) sug = 'critico';
  else if (diff <= -20) sug = 'riesgo';
  else if (diff <= -10) sug = 'atencion';

  box.style.display = 'block';
  box.innerHTML = `<i class="fa-solid fa-lightbulb"></i> Variación vs anterior (${formatCOP(ant.ventas)}): ${diff.toFixed(1)}%. Sugerencia: <b>${estadoInfo(sug).label}</b>. <button type="button" class="btn-secondary" style="padding:2px 6px;font-size:.7rem;" onclick="el('seg-estado').value='${sug}'">Aplicar</button>`;
}

function comprimirImagen(file) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        const max = 1000;
        if (width > max) { height = Math.round(height * (max / width)); width = max; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', 0.7));
      };
      img.onerror = () => resolve(e.target.result);
      img.src = e.target.result;
    };
    reader.onerror = () => resolve(null);
    reader.readAsDataURL(file);
  });
}

function handleFileSelect(inputEl, tipo) {
  const files = Array.from(inputEl.files || []);
  if (!files.length) return;
  const lecturas = files.map(file => {
    if (file.type.startsWith('image/')) {
      return comprimirImagen(file).then(dataUrl => ({ name: file.name, dataUrl, isImage: true }));
    }
    return new Promise(resolve => {
      const r = new FileReader();
      r.onload = () => resolve({ name: file.name, dataUrl: r.result, isImage: false });
      r.readAsDataURL(file);
    });
  });
  Promise.all(lecturas).then(items => {
    EVID_TEMP[tipo] = EVID_TEMP[tipo].concat(items.filter(it => it.dataUrl));
    renderEvidenciaPreview(tipo);
    inputEl.value = '';
  });
}

function renderEvidenciaPreview(tipo) {
  const cont = el('preview-' + tipo);
  if (!cont) return;
  cont.innerHTML = EVID_TEMP[tipo].map((item, i) => `
    <span class="chip">${escapeHTML(item.name.slice(0, 14))}
      <i class="fa-solid fa-xmark" style="cursor:pointer;color:var(--danger-red);margin-left:4px;" onclick="removeEvidenciaItem('${tipo}',${i})"></i>
    </span>`).join('') || '<span style="font-size:.75rem;color:var(--text-muted);">Sin archivos</span>';
}

function removeEvidenciaItem(tipo, idx) {
  EVID_TEMP[tipo].splice(idx, 1);
  renderEvidenciaPreview(tipo);
}

  };

  DB.seguimientos.unshift(nuevo);
  const cli = getCliente(cid);
  if (cli) {
    cli.estado = nuevo.estado;
    cli.resultados.ventas = nuevo.ventas;
    cli.resultados.gastos = nuevo.gastos;
    cli.resultados.utilidad = nuevo.utilidad;
    cli.resultados.inventario = nuevo.inventario;
  }

  registrarAuditoria('Seguimiento guardado', `${cli ? cli.negocio.nombre : 'Negocio'} — ${nuevo.estado}`);
  resetEvidenciasTemp();
  guardarEstado();
  mostrarNotificacion('¡Seguimiento guardado exitosamente!');
  navegar('w-inicio');

function adminStats() {
  const invertido = DB.clientes.reduce((a, c) => a + (Number(c.inversion?.aprobado) || 0), 0);
  const recuperado = DB.pagos.reduce((a, p) => a + (Number(p.monto) || 0), 0);
  const disponible = Math.max(0, (DB.capital.total || 0) - invertido + recuperado);
  const utilidadGen = DB.clientes.reduce((a, c) => a + (Number(c.resultados?.utilidad) || 0), 0);
  const refSemana = infoSemanaISO(fechaHoyLocal());
  const totalAsignados = DB.trabajadores.reduce((a, t) => a + (t.negocios ? t.negocios.length : 0), 0);
  const hechosEstaSemana = new Set(DB.seguimientos.filter(s => esMismaSemanaISO(s.fecha, refSemana)).map(s => s.clienteId)).size;
  return {
    invertido, recuperado, disponible, utilidadGen,
    negociosActivos: DB.clientes.length,
    negociosRiesgo: DB.clientes.filter(c => c.estado === 'riesgo').length,
    negociosCriticos: DB.clientes.filter(c => c.estado === 'critico').length,
    negociosAtencion: DB.clientes.filter(c => c.estado === 'atencion').length,
    negociosNormal: DB.clientes.filter(c => c.estado === 'normal').length,
    seguimientosRealizados: DB.seguimientos.length,
    seguimientosPendientes: Math.max(0, totalAsignados - hechosEstaSemana)
  };
}

function guardarNuevoCliente() {
  const nombre = el('nc-nombre').value.trim();
  const tel = el('nc-telefono').value.trim();
  const neg = el('nc-negnombre').value.trim();
  if (!nombre || !tel || !neg) { mostrarNotificacion('Completa nombre, teléfono y nombre del negocio.', true); return; }
  const id = DB.nextId.cliente++;
  const cap = Number(el('nc-aprobado').value) || 0;

  DB.clientes.push({
    id, nombre, documento: el('nc-documento').value.trim(), telefono: tel, correo: el('nc-correo').value.trim(), direccion: el('nc-direccion').value.trim(),
    negocio: { nombre: neg, tipo: el('nc-negtipo').value, direccion: el('nc-negdireccion').value.trim(), ciudad: el('nc-ciudad').value.trim(), fechaInicio: el('nc-fechainicio').value, empleados: Number(el('nc-empleados').value)||1, descripcion: '' },
    inversion: { solicitado: cap, aprobado: cap, recibido: cap, fecha: fechaHoyLocal(), tipo: el('nc-tipoinversion').value.trim(), participacion: Number(el('nc-participacion').value)||0, destino: el('nc-destino').value.trim(), estado: cap>0?'Activa':'Pendiente', rentabilidad: 0 },
    resultados: { ventas: 0, gastos: 0, utilidad: 0, inventario: 0, deudas: 0, metas: 0 },
    estado: 'normal',
    proceso: { requisitos: { antiguedad: false, documentacion: false, evidenciaVentas: false, estadosFinancieros: false, referencias: false, visitaTrabajador: false, evaluacionRiesgo: false }, etapas: { contrato: false, desembolso: false, seguimientoSemanal: false, reporte: false, liquidacion: false, revisionMensual: false } }
  });

  registrarAuditoria('Cliente registrado', `${nombre} — ${neg}`);
  guardarEstado();
  closeModal();
  mostrarNotificacion('Cliente registrado exitosamente');
  navegar('a-clientes');
}

const REQUISITOS_LABELS = {
  antiguedad: 'Antigüedad mínima del negocio',
  documentacion: 'Documentación legal completa',
  evidenciaVentas: 'Evidencia de ventas verificada',
  estadosFinancieros: 'Estados financieros básicos',
  referencias: 'Referencias comerciales comprobadas',
  visitaTrabajador: 'Visita de campo del asesor realizada',
  evaluacionRiesgo: 'Evaluación de riesgo aprobada'
};
const ETAPAS_LABELS = {
  contrato: '1. Contrato firmado',
  desembolso: '2. Desembolso realizado',
  seguimientoSemanal: '3. Seguimiento semanal activo',
  reporte: '4. Reporte entregado',
  liquidacion: '5. Liquidación / Cierre',
  revisionMensual: '6. Revisión mensual al día'
};

function renderProcesoInversion(c) {
  const p = asegurarProcesoCliente(c);
  const total = Object.keys(REQUISITOS_LABELS).length;
  const cumplidos = Object.keys(REQUISITOS_LABELS).filter(k => p.requisitos[k]).length;
  const puntaje = Math.round((cumplidos / total) * 100);
  const apto = puntaje >= DB.parametros.puntajeMinimoAprobacion;
  const meses = mesesDesde(c.negocio.fechaInicio);
  const antiguedadOk = meses === null || meses >= DB.parametros.mesesMinimoFuncionamiento;

  return `
  <div class="form-box">
    <h4>Requisitos de Aprobación</h4>
    ${meses !== null ? `<p style="font-size:.78rem;margin-bottom:8px;color:${antiguedadOk ? 'var(--success-green)' : 'var(--danger-red)'};"><i class="fa-solid ${antiguedadOk ? 'fa-circle-check' : 'fa-circle-exclamation'}"></i> Antigüedad: ${meses} meses (mínimo: ${DB.parametros.mesesMinimoFuncionamiento}).</p>` : ''}
    <div class="chip-list" style="margin-bottom:12px;">
      ${Object.keys(REQUISITOS_LABELS).map(k => `<label class="chip" style="cursor:pointer;display:inline-flex;align-items:center;gap:6px;">
        <input type="checkbox" id="req-${k}-${c.id}" ${p.requisitos[k] ? 'checked' : ''}> ${escapeHTML(REQUISITOS_LABELS[k])}
      </label>`).join('')}
    </div>
    <p style="font-size:.85rem;font-weight:700;color:${apto ? 'var(--success-green)' : 'var(--danger-red)'};">
      Puntaje: ${puntaje}% (mínimo: ${DB.parametros.puntajeMinimoAprobacion}%) — ${apto ? 'Apto para inversión' : 'No apto'}
    </p>
    <button class="btn-main" onclick="guardarRequisitosProceso(${c.id})" style="margin-top:10px;"><i class="fa-solid fa-floppy-disk"></i> Guardar Requisitos</button>
  </div>
  <div class="form-box">
    <h4>Etapas del Ciclo de Inversión</h4>
    <div class="chip-list" style="margin-bottom:12px;">
      ${Object.keys(ETAPAS_LABELS).map(k => `<label class="chip" style="cursor:pointer;display:inline-flex;align-items:center;gap:6px;">
        <input type="checkbox" id="etapa-${k}-${c.id}" ${p.etapas[k] ? 'checked' : ''}> ${escapeHTML(ETAPAS_LABELS[k])}
      </label>`).join('')}
    </div>
    <button class="btn-main" onclick="guardarEtapasProceso(${c.id})"><i class="fa-solid fa-floppy-disk"></i> Guardar Etapas</button>
  </div>`;
}

function guardarRequisitosProceso(id) {
  const c = getCliente(id);
  const p = asegurarProcesoCliente(c);
  Object.keys(REQUISITOS_LABELS).forEach(k => { const b = el(`req-${k}-${id}`); if (b) p.requisitos[k] = b.checked; });
  guardarEstado();
  mostrarNotificacion('Requisitos guardados');
}

function guardarEtapasProceso(id) {
  const c = getCliente(id);
  const p = asegurarProcesoCliente(c);
  Object.keys(ETAPAS_LABELS).forEach(k => { const b = el(`etapa-${k}-${id}`); if (b) p.etapas[k] = b.checked; });
  guardarEstado();
  mostrarNotificacion('Etapas guardadas');
}

function guardarResultadosCliente(id) {
  const c = getCliente(id);
  c.resultados.ventas = Number(el(`res-ventas-${id}`).value) || 0;
  c.resultados.gastos = Number(el(`res-gastos-${id}`).value) || 0;
  c.resultados.utilidad = Number(el(`res-utilidad-${id}`).value) || 0;
  c.resultados.inventario = Number(el(`res-inventario-${id}`).value) || 0;
  c.resultados.deudas = Number(el(`res-deudas-${id}`).value) || 0;
  c.resultados.metas = Number(el(`res-metas-${id}`).value) || 0;
  guardarEstado();
  mostrarNotificacion('Resultados actualizados');
}

function eliminarCliente(id) {
  const c = getCliente(id);
  if (!c) return;
  if (confirm(`¿Eliminar al cliente ${c.nombre} (${c.negocio.nombre}) y todos sus seguimientos?`)) {
    DB.clientes = DB.clientes.filter(x => x.id !== id);
    DB.seguimientos = DB.seguimientos.filter(s => s.clienteId !== id);
    DB.trabajadores.forEach(t => { t.negocios = (t.negocios||[]).filter(nid => nid !== id); });
    guardarEstado();
    mostrarNotificacion('Cliente eliminado');
    navegar('a-clientes');
  }
}

function abrirModalResolverSolicitud(id) {
  const s = DB.solicitudesInversion.find(x => x.id === id);
  if (!s) return;
  openModal('Evaluar Solicitud de Inversión', `
    <p style="margin-bottom:12px;"><b>${escapeHTML(s.negocioNombre)}</b> solicita ${formatCOP(s.montoSolicitado)}.</p>
    <div class="field" style="margin-bottom:12px;"><label>Decisión</label>
      <select class="form-control" id="rs-estado"><option value="Aprobada">Aprobar</option><option value="Rechazada">Rechazar</option></select>
    </div>
    <div class="field" style="margin-bottom:16px;"><label>Comentarios para el cliente</label><textarea class="form-control" id="rs-comentario" rows="3"></textarea></div>
    <button class="btn-main" onclick="resolverSolicitud(${id})">Confirmar Decisión</button>
  `);
}

function resolverSolicitud(id) {
  const s = DB.solicitudesInversion.find(x => x.id === id);
  const est = el('rs-estado').value;
  s.estado = est;
  s.comentario = el('rs-comentario').value.trim();
  const c = getCliente(s.clienteId);
  if (c && est === 'Aprobada') {
    c.inversion.aprobado = s.montoSolicitado;
    c.inversion.recibido = s.montoSolicitado;
    c.inversion.estado = 'Activa';
  }
  crearNotificacion('client', s.clienteId, 'Solicitud de inversión', `Tu solicitud fue ${est.toLowerCase()}.`, 'solicitud');
  guardarEstado();
  closeModal();
  mostrarNotificacion(`Solicitud ${est.toLowerCase()}`);
  navegar('a-solicitudes');
}

function guardarConfiguracionAdmin() {
  DB.parametros.nombreEmpresa = el('cfg-nombre').value.trim() || DB.parametros.nombreEmpresa;
  DB.parametros.moneda = el('cfg-moneda').value.trim() || 'COP';
  DB.capital.total = Number(el('cfg-cap-total').value) || 0;
  guardarEstado();
  mostrarNotificacion('Parámetros guardados');
}

function guardarMetaCliente(id) {
  const c = getCliente(id);
  c.resultados.metas = Number(el(`meta-${id}`).value) || 0;
  guardarEstado();
  mostrarNotificacion(`Meta de ${c.negocio.nombre} guardada`);
}

function agregarCategoria() {
  const v = el('nueva-categoria').value.trim();
  if (v && !DB.categorias.includes(v)) {
    DB.categorias.push(v);
    guardarEstado();
    navegar('a-configuracion');
    setTimeout(() => { document.querySelectorAll('.tab-btn')[4].click(); }, 40);
  }
}

function eliminarCategoria(idx) {
  DB.categorias.splice(idx, 1);
  guardarEstado();
  navegar('a-configuracion');
  setTimeout(() => { document.querySelectorAll('.tab-btn')[4].click(); }, 40);
}

function guardarReglamento() {
  DB.parametros.mesesMinimoFuncionamiento = Number(el('rgl-meses').value) || 6;
  DB.parametros.puntajeMinimoAprobacion = Number(el('rgl-puntaje').value) || 70;
  DB.parametros.montoMaximoInversion = Number(el('rgl-monto').value) || 20000000;
  DB.parametros.reglamentoTexto = el('rgl-texto').value.trim();
  guardarEstado();
  mostrarNotificacion('Reglamento guardado');
}

function descargarCopiaSeguridad() {
  const blob = new Blob([JSON.stringify(DB, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `Respaldo_JORAN_${fechaHoyLocal()}.json`;
  a.click();
}

function exportarClientesCSV() {
  if (!DB.clientes.length) return;
  let csv = 'ID,Nombre,Documento,Telefono,Negocio,Ciudad,CapitalAprobado,Estado\n';
  DB.clientes.forEach(c => {
    csv += `"${c.id}","${c.nombre}","${c.documento||''}","${c.telefono}","${c.negocio.nombre}","${c.negocio.ciudad}","${c.inversion.aprobado}","${c.estado}"\n`;
  });
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `Clientes_JORAN_${fechaHoyLocal()}.csv`;
  a.click();
}

function abrirModalRegistrarUsuario() {
  openModal('Registrar Nuevo Usuario', `
    <div class="form-grid-2">
      <div class="field"><label>Nombre Completo *</label><input class="form-control" id="nu-nombre"></div>
      <div class="field"><label>Rol</label>
        <select class="form-control" id="nu-rol" onchange="handleRolUsuarioChange()">
          <option value="client">Cliente</option>
          <option value="worker">Trabajador</option>
          <option value="admin">Administrador</option>
        </select>
      </div>
    </div>
    <div class="field" id="nu-grupo-entidad" style="margin-bottom:12px;"><label>Vincular a Negocio / Trabajador</label>
      <select class="form-control" id="nu-entidad">${DB.clientes.map(c => `<option value="${c.id}">${escapeHTML(c.negocio.nombre)} — ${escapeHTML(c.nombre)}</option>`).join('')}</select>
    </div>
    <div class="field" style="margin-bottom:16px;"><label>Contraseña de Acceso *</label><input type="password" class="form-control" id="nu-pass"></div>
    <button class="btn-main" onclick="guardarNuevoUsuario()"><i class="fa-solid fa-floppy-disk"></i> Registrar Usuario</button>
  `);
}

function handleRolUsuarioChange() {
  const r = el('nu-rol').value;
  const gr = el('nu-grupo-entidad');
  const sel = el('nu-entidad');
  if (r === 'client') {
    gr.style.display = 'block';
    sel.innerHTML = DB.clientes.map(c => `<option value="${c.id}">${escapeHTML(c.negocio.nombre)} — ${escapeHTML(c.nombre)}</option>`).join('');
  } else if (r === 'worker') {
    gr.style.display = 'block';
    sel.innerHTML = DB.trabajadores.map(t => `<option value="${t.id}">${escapeHTML(t.nombre)}</option>`).join('');
  } else {
    gr.style.display = 'none';
  }
}

function guardarNuevoUsuario() {
  const nombre = el('nu-nombre').value.trim();
  const pass = el('nu-pass').value;
  const rol = el('nu-rol').value;
  if (!nombre || !pass) { mostrarNotificacion('Ingresa nombre y contraseña.', true); return; }

  let entidadId = null, entidadNombre = '-';
  if (rol === 'client') {
    entidadId = Number(el('nu-entidad').value);
    entidadNombre = (getCliente(entidadId) || {}).negocio?.nombre || '-';
  } else if (rol === 'worker') {
    entidadId = Number(el('nu-entidad').value);
    entidadNombre = (getTrabajador(entidadId) || {}).nombre || '-';
  }

  DB.usuarios.push({ id: DB.nextId.usuario++, nombre, rol, password: pass, activo: true, entidadId, entidadNombre });
  guardarEstado();
  closeModal();
  mostrarNotificacion('Usuario registrado');
  navegar('a-configuracion');
  setTimeout(() => { document.querySelectorAll('.tab-btn')[1].click(); }, 40);
}

function toggleUsuarioActivo(id) {
  const u = DB.usuarios.find(x => x.id === id);
  if (u) {
    u.activo = !u.activo;
    guardarEstado();
    navegar('a-configuracion');
    setTimeout(() => { document.querySelectorAll('.tab-btn')[1].click(); }, 40);
  }
}

function crearCuentaCliente() {
  const nombre = el('cc-nombre').value.trim();
  const tel = el('cc-tel').value.trim();
  const neg = el('cc-neg').value.trim();
  const monto = Number(el('cc-monto').value) || 0;
  const dest = el('cc-dest').value.trim();
  const pass = el('cc-pass').value;

  if (!nombre || !tel || !neg || monto <= 0 || !dest || !pass) {
    mostrarNotificacion('Completa todos los campos obligatorios.', true);
    return;
  }

  const cid = DB.nextId.cliente++;
  DB.clientes.push({
    id: cid, nombre, documento: el('cc-doc').value.trim(), telefono: tel, correo: el('cc-email').value.trim(), direccion: '',
    negocio: { nombre: neg, tipo: el('cc-tipo').value, direccion: '', ciudad: 'Bogotá', fechaInicio: fechaHoyLocal(), empleados: 1, descripcion: '' },
    inversion: { solicitado: monto, aprobado: 0, recibido: 0, fecha: '', tipo: 'Solicitud Inicial', participacion: 0, destino: dest, estado: 'Pendiente', rentabilidad: 0 },
    resultados: { ventas: 0, gastos: 0, utilidad: 0, inventario: 0, deudas: 0, metas: 0 },
    estado: 'normal',
    proceso: { requisitos: { antiguedad: false, documentacion: false, evidenciaVentas: false, estadosFinancieros: false, referencias: false, visitaTrabajador: false, evaluacionRiesgo: false }, etapas: { contrato: false, desembolso: false, seguimientoSemanal: false, reporte: false, liquidacion: false, revisionMensual: false } }
  });

  DB.usuarios.push({ id: DB.nextId.usuario++, nombre, rol: 'client', password: pass, activo: true, entidadId: cid, entidadNombre: neg });
  DB.solicitudesInversion.unshift({ id: DB.nextId.solicitudInversion++, clienteId: cid, clienteNombre: nombre, negocioNombre: neg, montoSolicitado: monto, destino: dest, estado: 'Pendiente', fecha: fechaHoyLocal() });

  guardarEstado();
  closeModal();
  mostrarNotificacion('Cuenta creada con éxito. Ya puedes iniciar sesión.');
}

function verPoliticaDatosLogin() {
  openModal('Política de Tratamiento de Datos', `<p style="font-size:.85rem;color:#334155;line-height:1.6;">${escapeHTML(DB.parametros.politicaDatos)}</p>`);
}

/* ---------------- Inicialización ---------------- */
async function iniciarApp() {
  cargarCacheDB();
  cargarSesionLocal();
  asegurarDatosNuevos();
  await cargarEstadoRemoto();
  el('loading-overlay').style.display = 'none';

  if (SESSION.rol) {
    el('view-login').style.display = 'none';
    el('view-app').style.display = 'grid';
    el('header-user-name').innerText = SESSION.usuario || 'Usuario';
    el('header-avatar-initials').innerText = (SESSION.usuario || 'US').slice(0,2).toUpperCase();
    if (SESSION.rol === 'client') initClienteUI();
    else if (SESSION.rol === 'worker') initTrabajadorUI();
    else initAdminUI();
  }
}

document.addEventListener('DOMContentLoaded', iniciarApp);
</script>
