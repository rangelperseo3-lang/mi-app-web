[cite: 1]<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INVERSIONES JORAN - Plataforma de Gestión PyMEs</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
:root{
  --navy-deep:#071427;
  --navy:#0d2340;
  --navy-mid:#123055;
  --navy-hover:#1a3d6b;
  --gold:#c9a227;
  --gold-light:#e0c05a;
  --bg-main:#f3f5f8;
  --card-bg:#ffffff;
  --text-main:#1c2733;
  --text-muted:#64748b;
  --border-color:#e2e8f0;
  --success-green:#0f9d58;
  --success-bg:#d9f2e6;
  --warning-amber:#b8860b;
  --warning-bg:#fbeecb;
  --danger-red:#c0392b;
  --danger-bg:#fbe1de;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,sans-serif;}
body{background:var(--bg-main);color:var(--text-main);min-height:100vh;overflow-x:hidden;}
img.logo-img{display:block;object-fit:contain;}
.logo-badge{display:flex;align-items:center;justify-content:center;font-weight:800;letter-spacing:.5px;
  border-radius:50%;background:linear-gradient(160deg,var(--navy-mid) 0%,var(--navy-deep) 100%);
  color:var(--gold);border:2px solid var(--gold);flex-shrink:0;}

/* LOGIN */
#view-login{display:flex;justify-content:center;align-items:center;min-height:100vh;
  background:radial-gradient(circle at 30% 20%, #123055 0%, #071427 65%);}
.login-card{background:linear-gradient(160deg,var(--navy-mid) 0%,var(--navy-deep) 100%);border-radius:16px;padding:42px 34px;width:100%;max-width:430px;
  box-shadow:0 25px 60px -12px rgba(0,0,0,.6);text-align:center;color:#fff;
  border-top:4px solid var(--gold);border:1px solid rgba(201,162,39,.35);}
.login-card .logo-img{width:110px;height:110px;margin:0 auto 14px auto;filter:drop-shadow(0 6px 14px rgba(0,0,0,.4));}
.login-card .logo-badge{width:110px;height:110px;margin:0 auto 14px auto;font-size:2.1rem;box-shadow:0 6px 14px rgba(0,0,0,.4);}
.login-card h2{font-size:1.25rem;font-weight:800;color:#fff;letter-spacing:.5px;margin-bottom:4px;}
.login-card .tagline{font-size:.7rem;color:var(--gold-light);text-transform:uppercase;font-weight:700;letter-spacing:1.5px;margin-bottom:26px;}
.form-group{text-align:left;margin-bottom:16px;}
.form-group label{display:block;font-size:.8rem;margin-bottom:6px;font-weight:600;color:var(--gold-light);letter-spacing:.2px;}
.login-card .form-control{background:rgba(255,255,255,.06);border:1px solid rgba(201,162,39,.4);color:#fff;}
.login-card .form-control::placeholder{color:rgba(255,255,255,.45);}
.login-card .form-control:focus{border-color:var(--gold);background:rgba(255,255,255,.1);}
.login-card select.form-control option{background:var(--navy-deep);color:#fff;}
.password-field{position:relative;}
.password-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:rgba(255,255,255,.55);cursor:pointer;font-size:.9rem;padding:0;}
.password-toggle:hover{color:var(--gold-light);}
.form-control{width:100%;border:1px solid var(--border-color);border-radius:8px;padding:11px 12px;font-size:.92rem;outline:none;background:#f8fafc;}
.form-control:focus{border-color:var(--navy);background:#fff;}
textarea.form-control{resize:vertical;font-family:inherit;}
.btn-login{width:100%;background:var(--gold);color:var(--navy-deep);border:none;padding:12px;border-radius:8px;
  font-weight:800;cursor:pointer;font-size:.98rem;transition:.2s;margin-top:8px;letter-spacing:.3px;}
.btn-login:hover{background:var(--gold-light);}
.login-hint{font-size:.68rem;color:rgba(255,255,255,.4);margin-top:16px;}

/* APP LAYOUT */
#view-app{height:100vh;display:none;grid-template-columns:262px 1fr;}
aside{background:linear-gradient(180deg,var(--navy-deep),var(--navy));color:#fff;padding:20px 15px;display:flex;flex-direction:column;justify-content:space-between;}
.brand-area{display:flex;align-items:center;gap:12px;padding-bottom:18px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:15px;}
.brand-area .logo-img{width:42px;height:42px;}
.brand-area .logo-badge{width:42px;height:42px;font-size:.82rem;}
.brand-title h1{font-size:.92rem;letter-spacing:.4px;font-weight:800;}
.brand-title span{font-size:.62rem;color:var(--gold-light);text-transform:uppercase;font-weight:700;letter-spacing:.5px;}
.nav-menu{list-style:none;overflow-y:auto;max-height:calc(100vh - 150px);}
.nav-link{display:flex;align-items:center;gap:12px;padding:10px 14px;color:#c7d2e3;border-radius:8px;margin-bottom:3px;
  cursor:pointer;font-size:.86rem;font-weight:500;transition:.2s;text-decoration:none;}
.nav-link i{width:18px;text-align:center;font-size:.88rem;color:var(--gold-light);}
.nav-link.active,.nav-link:hover{background:rgba(201,162,39,.16);color:#fff;}
.sidebar-foot{font-size:.68rem;color:#7d8ba3;text-align:center;padding-top:10px;border-top:1px solid rgba(255,255,255,.08);}

main{display:flex;flex-direction:column;height:100vh;overflow-y:auto;background:var(--bg-main);}
header{background:var(--card-bg);border-bottom:1px solid var(--border-color);padding:14px 30px;
  display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 3px rgba(0,0,0,.03);position:sticky;top:0;z-index:50;}
.user-profile-widget{display:flex;align-items:center;gap:12px;}
.user-avatar{width:38px;height:38px;background:var(--navy);color:var(--gold-light);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.8rem;}

.content-container{padding:28px 30px;max-width:1400px;margin:0 auto;width:100%;}
.hub-module{display:none;}
.hub-module.active{display:block;}

.metrics-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px;margin-bottom:24px;}
.metric-card{background:var(--card-bg);border:1px solid var(--border-color);border-radius:12px;padding:18px;
  box-shadow:0 1px 3px rgba(0,0,0,.03);display:flex;justify-content:space-between;align-items:flex-start;}
.metric-card p{font-size:.72rem;color:var(--text-muted);font-weight:700;text-transform:uppercase;margin-bottom:6px;letter-spacing:.3px;}
.metric-card h2{font-size:1.4rem;color:var(--text-main);font-weight:800;}
.metric-icon{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.05rem;flex-shrink:0;}

.card-table{background:var(--card-bg);border:1px solid var(--border-color);border-radius:12px;padding:20px;margin-bottom:24px;box-shadow:0 1px 3px rgba(0,0,0,.03);}
.card-table-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;flex-wrap:wrap;gap:10px;}
.card-table-header h3{font-size:.98rem;color:var(--navy);font-weight:800;}
.card-table-header .subtitle{font-size:.75rem;color:var(--text-muted);margin-top:2px;}

table{width:100%;border-collapse:collapse;text-align:left;}
th{padding:11px;font-size:.7rem;text-transform:uppercase;color:var(--text-muted);background:#f8fafc;border-bottom:2px solid var(--border-color);font-weight:800;letter-spacing:.3px;white-space:nowrap;}
td{padding:11px;font-size:.85rem;border-bottom:1px solid var(--border-color);color:#334155;}
tr:hover td{background:#fbfbfd;}
.table-scroll{overflow-x:auto;}

.badge{padding:4px 10px;border-radius:20px;font-size:.72rem;font-weight:700;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;}
.badge-green{background:var(--success-bg);color:var(--success-green);}
.badge-amber{background:var(--warning-bg);color:var(--warning-amber);}
.badge-red{background:var(--danger-bg);color:var(--danger-red);}

.btn-main{background:var(--navy);color:var(--gold-light);border:none;padding:9px 16px;border-radius:7px;font-weight:700;cursor:pointer;font-size:.82rem;display:inline-flex;align-items:center;gap:6px;transition:.2s;}
.btn-main:hover{background:var(--navy-hover);}
.btn-secondary{background:#eef1f5;color:#334155;border:none;padding:7px 13px;border-radius:7px;font-weight:600;cursor:pointer;font-size:.78rem;}
.btn-secondary:hover{background:#e2e8f0;}
.btn-danger{background:var(--danger-bg);color:var(--danger-red);border:none;padding:7px 13px;border-radius:7px;font-weight:700;cursor:pointer;font-size:.78rem;}
.btn-gold{background:var(--gold);color:#1c2733;border:none;padding:9px 16px;border-radius:7px;font-weight:800;cursor:pointer;font-size:.82rem;display:inline-flex;align-items:center;gap:6px;}
.btn-gold:hover{background:var(--gold-light);}

.form-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:15px;}
.form-grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:15px;}
.form-grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:15px;}
.form-box{background:#f8fafc;border:1px solid var(--border-color);padding:16px;border-radius:10px;margin-bottom:16px;}
.form-box h4{font-size:.8rem;color:var(--navy);text-transform:uppercase;margin-bottom:12px;font-weight:800;border-bottom:2px solid var(--gold);padding-bottom:6px;letter-spacing:.3px;display:inline-block;}
.field label{display:block;font-size:.76rem;font-weight:700;color:#475569;margin-bottom:4px;}

.tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--border-color);flex-wrap:wrap;}
.tab-btn{padding:9px 16px;font-size:.8rem;font-weight:700;color:var(--text-muted);background:none;border:none;cursor:pointer;border-bottom:3px solid transparent;}
.tab-btn.active{color:var(--navy);border-bottom-color:var(--gold);}
.tab-content{display:none;}
.tab-content.active{display:block;}

.progress-bar-track{background:#e2e8f0;border-radius:10px;height:14px;width:100%;overflow:hidden;}
.progress-bar-fill{height:100%;border-radius:10px;}

.modal-overlay{position:fixed;inset:0;background:rgba(7,20,39,.72);display:none;justify-content:center;align-items:center;z-index:1000;padding:20px;}
.modal-overlay.open{display:flex;}
.modal-box{background:#fff;padding:26px;border-radius:14px;width:100%;max-width:820px;max-height:90vh;overflow-y:auto;color:var(--text-main);}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;padding-bottom:12px;border-bottom:2px solid var(--gold);}
.modal-header h3{color:var(--navy);font-size:1.05rem;font-weight:800;}
.modal-close{background:none;border:none;font-size:1.1rem;cursor:pointer;color:var(--text-muted);}

.chip-list{display:flex;flex-wrap:wrap;gap:8px;}
.chip{background:#eef1f5;border-radius:20px;padding:6px 12px;font-size:.78rem;font-weight:600;color:#334155;}

.status-dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px;}

.file-drop{border:2px dashed var(--border-color);border-radius:10px;padding:18px;text-align:center;color:var(--text-muted);font-size:.8rem;cursor:pointer;background:#fbfcfe;}
.file-drop:hover{border-color:var(--gold);color:var(--navy);}

#toast{position:fixed;bottom:22px;right:22px;background:var(--navy-deep);color:#fff;padding:13px 20px;border-radius:9px;
  border-left:4px solid var(--gold);display:none;z-index:2000;font-size:.88rem;box-shadow:0 10px 25px rgba(0,0,0,.25);max-width:320px;}

.empty-state{text-align:center;padding:30px;color:var(--text-muted);font-size:.85rem;}
.risk-list-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border-color);font-size:.85rem;}
.risk-list-item:last-child{border-bottom:none;}

@media(max-width:900px){
  #view-app{grid-template-columns:1fr;}
  aside{display:none;}
  .form-grid-3,.form-grid-4,.form-grid-2{grid-template-columns:1fr;}
}
</style>

<body>

<section id="view-login">
  <div class="login-card">
    <div class="logo-badge">JR</div>
    <h2>INVERSIONES JORAN</h2>
    <div class="tagline">Plataforma de gestión PyMEs</div>
    <form onsubmit="realizarLogin(event)">
      <div class="form-group">
        <label>Rol de Usuario</label>
        <select id="selectRol" class="form-control" required onchange="handleRolChange()">
          <option value="" disabled selected>Seleccione rol...</option>
          <option value="client">Cliente (Mi Negocio &amp; Finanzas)</option>
          <option value="worker">Trabajador (Seguimientos &amp; Campo)</option>
          <option value="admin">Administrador (Control General &amp; Reportes)</option>
        </select>
      </div>
      <div class="form-group" id="grupo-entidad" style="display:none;">
        <label id="label-entidad">Seleccione su negocio</label>
        <select id="selectEntidad" class="form-control"></select>
      </div>
      <div class="form-group">
        <label>Nombre de Usuario</label>
        <input type="text" id="inputUsuario" class="form-control" required placeholder="Ingrese su nombre">
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <div class="password-field">
          <input type="password" id="inputPassword" class="form-control" required placeholder="Ingrese su contraseña" style="padding-right:42px;">
          <button type="button" class="password-toggle" onclick="togglePassword()"><i class="fa-solid fa-eye" id="password-eye"></i></button>
        </div>
      </div>
      <button type="submit" class="btn-login"><i class="fa-solid fa-lock"></i> Acceder a la Plataforma</button>
      <p class="login-hint">Prototipo de demostración — cualquier contraseña es válida.</p>
    </form>
  </div>
</section>

<div id="view-app">
  <aside>
    <div>
      <div class="brand-area">
        <div class="logo-badge">JR</div>
        <div class="brand-title">
          <h1>INVERSIONES JORAN</h1>
          <span>Portal PyMEs</span>
        </div>
      </div>
      <ul class="nav-menu" id="menuLateral"></ul>
    </div>
    <div class="sidebar-foot">JORAN S.A.S. &copy; 2026</div>
  </aside>

  <main>
    <header>
      <h2 id="titulo-pagina" style="font-size:1.1rem;font-weight:800;color:var(--navy);">Panel Principal</h2>
      <div class="user-profile-widget">
        <div class="user-avatar" id="header-avatar-initials">US</div>
        <div>
          <div id="header-user-name" style="font-size:.86rem;font-weight:700;">Usuario</div>
          <div id="header-user-role" style="font-size:.7rem;color:var(--text-muted);">Rol</div>
        </div>
        <button onclick="cerrarSesion()" class="btn-secondary" style="margin-left:14px;color:var(--danger-red);"><i class="fa-solid fa-power-off"></i></button>
      </div>
    </header>
    <div class="content-container" id="content-container"></div>
  </main>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal-box" id="modal-box"></div>
</div>

<div id="toast"><span id="toast-msg">Notificación</span></div>

<script>
/* =========================================================
   INVERSIONES JORAN - Lógica de la plataforma
   ========================================================= */

let SESSION = { rol: null, usuario: null, clienteId: null, trabajadorId: null };

const DB = {
  clientes: [],
  trabajadores: [],
  seguimientos: [],
  usuarios: [],
  categorias: ['Tienda de barrio', 'Panadería', 'Barbería', 'Papelería', 'Restaurante', 'Ferretería', 'Otro'],
  parametros: { moneda: 'COP', periodoSeguimiento: 'Semanal', metaCumplimientoMinimo: 80, nombreEmpresa: 'INVERSIONES JORAN S.A.S.' },
  solicitudesEdicion: [],
  nextId: { cliente: 1, trabajador: 1, seguimiento: 1, usuario: 1, solicitud: 1 }
};

/* ---------------- Persistencia (localStorage) ---------------- */
const ESTADO_KEY = 'joran_estado_v1';
function guardarEstado() {
  try { localStorage.setItem(ESTADO_KEY, JSON.stringify({ DB, SESSION })); } catch (e) { /* almacenamiento no disponible */ }
}
function cargarEstado() {
  try {
    const raw = localStorage.getItem(ESTADO_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    if (data.DB) Object.assign(DB, data.DB);
    if (data.SESSION) Object.assign(SESSION, data.SESSION);
    return true;
  } catch (e) { return false; }
}

/* ---------------- Utilidades ---------------- */
function formatCOP(n) {
  const num = Number(n) || 0;
  const sign = num < 0 ? '-' : '';
  return sign + '$ ' + Math.abs(Math.round(num)).toLocaleString('es-CO');
}
function fechaLarga(f) {
  if (!f) return '-';
  const d = new Date(f + 'T00:00:00');
  if (isNaN(d)) return f;
  return d.toLocaleDateString('es-CO', { day: '2-digit', month: '2-digit', year: 'numeric' });
}
function estadoInfo(estado) {
  const map = {
    optimo: { label: 'Óptimo', cls: 'badge-green', dot: 'var(--success-green)', emoji: '🟢' },
    atencion: { label: 'En Atención', cls: 'badge-amber', dot: 'var(--warning-amber)', emoji: '🟡' },
    riesgo: { label: 'En Riesgo', cls: 'badge-red', dot: 'var(--danger-red)', emoji: '🔴' }
  };
  return map[estado] || map.optimo;
}
function badgeEstado(estado) {
  const info = estadoInfo(estado);
  return `<span class="badge ${info.cls}"><span class="status-dot" style="background:${info.dot}"></span>${info.label}</span>`;
}
function getCliente(id) { return DB.clientes.find(c => c.id === id); }
function getTrabajador(id) { return DB.trabajadores.find(t => t.id === id); }
function nombreTrabajador(id) { const t = getTrabajador(id); return t ? t.nombre : 'Trabajador eliminado'; }
function nombreNegocio(id) { const c = getCliente(id); return c ? c.negocio.nombre : 'Negocio eliminado'; }
function seguimientosDeCliente(id) { return DB.seguimientos.filter(s => s.clienteId === id).sort((a, b) => b.fecha.localeCompare(a.fecha)); }
function seguimientosDeTrabajador(id) { return DB.seguimientos.filter(s => s.trabajadorId === id).sort((a, b) => b.fecha.localeCompare(a.fecha)); }
function ultimoSeguimiento(clienteId) { const list = seguimientosDeCliente(clienteId); return list.length ? list[0] : null; }
function el(id) { return document.getElementById(id); }

function mostrarNotificacion(msg) {
  const toast = el('toast');
  el('toast-msg').innerText = msg;
  toast.style.display = 'block';
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => toast.style.display = 'none', 3200);
}

function openModal(titleHtml, bodyHtml) {
  el('modal-box').innerHTML = `
    <div class="modal-header">
      <h3>${titleHtml}</h3>
      <button class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    ${bodyHtml}`;
  el('modal-overlay').classList.add('open');
}
function closeModal() { el('modal-overlay').classList.remove('open'); guardarEstado(); }

function switchTab(groupId, tabId, btn) {
  document.querySelectorAll(`[data-tabgroup="${groupId}"]`).forEach(elx => elx.classList.remove('active'));
  el(tabId).classList.add('active');
  if (btn) {
    const parent = btn.parentElement;
    parent.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }
}

/* ---------------- LOGIN ---------------- */
function handleRolChange() {
  const rol = el('selectRol').value;
  const grupo = el('grupo-entidad');
  const label = el('label-entidad');
  const select = el('selectEntidad');
  const inputUsuario = el('inputUsuario');

  if (rol === 'client') {
    grupo.style.display = 'block';
    label.innerText = 'Seleccione su negocio';
    select.innerHTML = DB.clientes.length
      ? DB.clientes.map(c => `<option value="${c.id}">${c.negocio.nombre} — ${c.nombre}</option>`).join('')
      : `<option value="">No hay clientes registrados aún</option>`;
    select.onchange = () => { const c = getCliente(Number(select.value)); if (c) inputUsuario.value = c.nombre; };
    if (DB.clientes.length) inputUsuario.value = DB.clientes[0].nombre;
  } else if (rol === 'worker') {
    grupo.style.display = 'block';
    label.innerText = 'Seleccione su perfil de trabajador';
    select.innerHTML = DB.trabajadores.length
      ? DB.trabajadores.map(t => `<option value="${t.id}">${t.nombre}</option>`).join('')
      : `<option value="">No hay trabajadores registrados aún</option>`;
    select.onchange = () => { const t = getTrabajador(Number(select.value)); if (t) inputUsuario.value = t.nombre; };
    if (DB.trabajadores.length) inputUsuario.value = DB.trabajadores[0].nombre;
  } else {
    grupo.style.display = 'none';
    select.innerHTML = '';
    if (rol === 'admin' && !inputUsuario.value) inputUsuario.value = 'Administrador';
  }
}

function togglePassword() {
  const pass = el('inputPassword');
  const eye = el('password-eye');
  const isHidden = pass.type === 'password';
  pass.type = isHidden ? 'text' : 'password';
  eye.classList.toggle('fa-eye', !isHidden);
  eye.classList.toggle('fa-eye-slash', isHidden);
}

function realizarLogin(e) {
  e.preventDefault();
  const rol = el('selectRol').value;
  const usuario = el('inputUsuario').value.trim();
  const password = el('inputPassword').value;

  if (!rol) { mostrarNotificacion('Seleccione un rol'); return; }
  if (!usuario) { mostrarNotificacion('Ingrese su nombre de usuario'); return; }
  if (!password) { mostrarNotificacion('Por favor ingrese su contraseña'); return; }

  if (rol === 'client' && !DB.clientes.length) { 
    mostrarNotificacion('Aún no hay clientes registrados. Ingrese como Administrador para registrar el primero.'); 
    return; 
  }
  if (rol === 'worker' && !DB.trabajadores.length) { 
    mostrarNotificacion('Aún no hay trabajadores registrados. Ingrese como Administrador para registrar el primero.'); 
    return; 
  }

  const entidadId = el('selectEntidad').value ? Number(el('selectEntidad').value) : null;

  SESSION.rol = rol; 
  SESSION.usuario = usuario;
  SESSION.clienteId = rol === 'client' ? entidadId : null;
  SESSION.trabajadorId = rol === 'worker' ? entidadId : null;

  el('view-login').style.display = 'none';
  el('view-app').style.display = 'grid';
  el('header-user-name').innerText = usuario;
  el('header-avatar-initials').innerText = usuario.substring(0, 2).toUpperCase();

  if (rol === 'client') initClienteUI();
  else if (rol === 'worker') initTrabajadorUI();
  else if (rol === 'admin') initAdminUI();

  guardarEstado();
  mostrarNotificacion('Sesión iniciada con éxito');
}

function cerrarSesion() {
  el('view-app').style.display = 'none';
  el('view-login').style.display = 'flex';
  el('content-container').innerHTML = '';
  SESSION.rol = null; SESSION.usuario = null; SESSION.clienteId = null; SESSION.trabajadorId = null;
  guardarEstado();
  mostrarNotificacion('Sesión finalizada');
}

function setMenu(items) {
  const menu = el('menuLateral');
  menu.innerHTML = items.map((it, i) =>
    `<li><a class="nav-link${i === 0 ? ' active' : ''}" onclick="navegar('${it.id}', this)"><i class="fa-solid ${it.icon}"></i> ${it.label}</a></li>`
  ).join('');
}

let CURRENT_ROLE_ROUTES = {};
function navegar(id, elx) {
  document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
  if (elx) elx.classList.add('active');
  const route = CURRENT_ROLE_ROUTES[id];
  if (!route) { mostrarNotificacion('Módulo en construcción'); return; }
  el('titulo-pagina').innerText = route.titulo;
  el('content-container').innerHTML = route.render();
  if (route.after) route.after();
  guardarEstado();
}

/* ---------------- Arranque de la aplicación ---------------- */
function iniciarApp() {
  const habiaEstado = cargarEstado();
  const sesionValida = habiaEstado && SESSION.rol && (
    (SESSION.rol === 'client' && getCliente(SESSION.clienteId)) ||
    (SESSION.rol === 'worker' && getTrabajador(SESSION.trabajadorId)) ||
    SESSION.rol === 'admin'
  );
  if (sesionValida) {
    el('view-login').style.display = 'none';
    el('view-app').style.display = 'grid';
    el('header-user-name').innerText = SESSION.usuario || '';
    el('header-avatar-initials').innerText = (SESSION.usuario || 'US').substring(0, 2).toUpperCase();
    if (SESSION.rol === 'client') initClienteUI();
    else if (SESSION.rol === 'worker') initTrabajadorUI();
    else if (SESSION.rol === 'admin') initAdminUI();
  } else {
    SESSION.rol = null; SESSION.usuario = null; SESSION.clienteId = null; SESSION.trabajadorId = null;
  }
  setInterval(guardarEstado, 1000);
  window.addEventListener('beforeunload', guardarEstado);
}
document.addEventListener('DOMContentLoaded', iniciarApp);

function enviarSolicitudEdicion(clienteId) {
  const mensaje = el('se-mensaje').value.trim();
  if (!mensaje) { mostrarNotificacion('Describe el cambio que deseas solicitar'); return; }
  const c = getCliente(clienteId);
  DB.solicitudesEdicion.push({
    id: DB.nextId.solicitud++,
    clienteId,
    clienteNombre: c ? c.nombre : 'Cliente eliminado',
    negocioNombre: c ? c.negocio.nombre : '-',

function descargarContratoInversion(clienteId) {
  const c = getCliente(clienteId);
  if (!c) { mostrarNotificacion('No se encontró información del cliente'); return; }
  const i = c.inversion;
  const contenido =
`RESUMEN DE CONTRATO DE INVERSIÓN
${DB.parametros.nombreEmpresa}
=====================================

Cliente: ${c.nombre}
Documento: ${c.documento || '-'}
Negocio: ${c.negocio.nombre}

Capital solicitado: ${formatCOP(i.solicitado)}
Capital aprobado: ${formatCOP(i.aprobado)}
Capital recibido: ${formatCOP(i.recibido)}

Fecha de inversión: ${fechaLarga(i.fecha)}
Tipo de inversión: ${i.tipo || '-'}
Participación de JORAN: ${i.participacion}%
Estado de la inversión: ${i.estado || '-'}
Rentabilidad acumulada: ${i.rentabilidad}%

Destino de la inversión:
${i.destino || '-'}

=====================================
Este documento es un resumen informativo generado por la plataforma
y no reemplaza el contrato legal firmado entre las partes.
Generado el: ${fechaLarga(new Date().toISOString().slice(0, 10))}
`;
  const blob = new Blob([contenido], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `Contrato_${c.negocio.nombre.replace(/\s+/g, '_')}.txt`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  mostrarNotificacion('Contrato descargado correctamente');
}

/* ---------------- Evidencias ---------------- */
let EVID_TEMP = { fotos: [], documentos: [], facturas: [] };
function resetEvidenciasTemp() { EVID_TEMP = { fotos: [], documentos: [], facturas: [] }; }

function handleFileSelect(inputEl, tipo) {
  const files = Array.from(inputEl.files || []);
  if (!files.length) return;
  const lecturas = files.map(file => new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = () => resolve({ name: file.name, dataUrl: reader.result, isImage: file.type.startsWith('image/') });
    reader.readAsDataURL(file);
  }));
  Promise.all(lecturas).then(items => {
    EVID_TEMP[tipo] = EVID_TEMP[tipo].concat(items);
    renderEvidenciaPreview(tipo);
    inputEl.value = '';
  });
}

function renderEvidenciaPreview(tipo) {
  const cont = el('preview-' + tipo);
  if (!cont) return;
  cont.innerHTML = EVID_TEMP[tipo].map((item, i) => {
    if (item.isImage) {
      return `<span class="chip" style="display:inline-flex;align-items:center;gap:6px;padding:4px 8px 4px 4px;">
        <img src="${item.dataUrl}" style="width:28px;height:28px;object-fit:cover;border-radius:5px;">
        ${item.name.length > 14 ? item.name.slice(0, 12) + '…' : item.name}
        <i class="fa-solid fa-xmark" style="cursor:pointer;color:var(--danger-red);" onclick="removeEvidenciaItem('${tipo}',${i})"></i>
      </span>`;
    }
    return `<span class="chip"><i class="fa-solid fa-paperclip"></i> ${item.name.length > 18 ? item.name.slice(0, 16) + '…' : item.name}
      <i class="fa-solid fa-xmark" style="cursor:pointer;color:var(--danger-red);margin-left:4px;" onclick="removeEvidenciaItem('${tipo}',${i})"></i></span>`;
  }).join('') || '<span style="font-size:.75rem;color:var(--text-muted);">Sin archivos adjuntos</span>';
}

function removeEvidenciaItem(tipo, idx) {
  EVID_TEMP[tipo].splice(idx, 1);
  renderEvidenciaPreview(tipo);
}

function guardarSeguimientoTrabajador(trabajadorId) {
  if (!el('seg-semana').value.trim()) { mostrarNotificacion('Por favor indique la semana del seguimiento'); return; }
  const nuevo = {
    id: DB.nextId.seguimiento++,
    clienteId: Number(el('seg-negocio').value),
    trabajadorId: trabajadorId,
    fecha: el('seg-fecha').value,
    semana: el('seg-semana').value,
    tipo: el('seg-tipo').value,
    ventas: Number(el('seg-ventas').value) || 0,
    gastos: Number(el('seg-gastos').value) || 0,
    utilidad: Number(el('seg-utilidad').value) || 0,
    inventario: Number(el('seg-inventario').value) || 0,
    flujoCaja: Number(el('seg-flujo').value) || 0,
    clientesAtendidos: Number(el('seg-clientes').value) || 0,
    nuevosClientes: Number(el('seg-nuevosclientes').value) || 0,
    cumplimientoMetas: el('seg-cumplimiento').value,
    usoInversion: el('seg-usoinversion').value,
    problemas: el('seg-problemas').value,
    necesidades: el('seg-necesidades').value,
    estado: el('seg-estado').value,
    recomendaciones: el('seg-recomendaciones').value,
    compromisos: el('seg-compromisos').value,
    evidencias: { fotos: EVID_TEMP.fotos, documentos: EVID_TEMP.documentos, facturas: EVID_TEMP.facturas, observaciones: el('seg-observaciones').value }
  };
  DB.seguimientos.unshift(nuevo);
  const cli = getCliente(nuevo.clienteId);
  if (cli) {
    cli.estado = nuevo.estado;
    cli.resultados.ventas = nuevo.ventas;
    cli.resultados.gastos = nuevo.gastos;
    cli.resultados.utilidad = nuevo.utilidad;
    cli.resultados.inventario = nuevo.inventario;
  }
  resetEvidenciasTemp();
  mostrarNotificacion('¡Seguimiento semanal guardado correctamente!');
  navegar('w-inicio');
}

function renderEvidenciasDetalle(ev) {
  const fotos = ev.fotos || [];
  const documentos = ev.documentos || [];
  const facturas = ev.facturas || [];
  if (!fotos.length && !documentos.length && !facturas.length) {
    return `<p style="font-size:.8rem;color:var(--text-muted);margin-bottom:10px;">No se adjuntaron evidencias en este seguimiento.</p>`;
  }
  let html = '';
  if (fotos.length) {
    html += `<p style="font-size:.76rem;font-weight:700;color:var(--navy);margin-bottom:6px;">Fotos (${fotos.length})</p>
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;">
        ${fotos.map(f => `<a href="${f.dataUrl}" target="_blank" title="${f.name}"><img src="${f.dataUrl}" style="width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--border-color);"></a>`).join('')}
      </div>`;
  }
  if (documentos.length) {
    html += `<p style="font-size:.76rem;font-weight:700;color:var(--navy);margin-bottom:6px;">Documentos (${documentos.length})</p>
      <div class="chip-list" style="margin-bottom:12px;">
        ${documentos.map(d => `<a href="${d.dataUrl}" target="_blank" download="${d.name}" class="chip" style="text-decoration:none;color:#334155;"><i class="fa-solid fa-file"></i> ${d.name}</a>`).join('')}
      </div>`;
  }
  if (facturas.length) {
    html += `<p style="font-size:.76rem;font-weight:700;color:var(--navy);margin-bottom:6px;">Facturas (${facturas.length})</p>
      <div class="chip-list" style="margin-bottom:12px;">
        ${facturas.map(fa => `<a href="${fa.dataUrl}" target="_blank" download="${fa.name}" class="chip" style="text-decoration:none;color:#334155;"><i class="fa-solid fa-receipt"></i> ${fa.name}</a>`).join('')}
      </div>`;
  }
  return html;
}

function adminStats() {
  const clientes = DB.clientes;
  const capitalInvertido = clientes.reduce((a, c) => a + (c.inversion ? c.inversion.aprobado : 0), 0);
  const negociosActivos = clientes.length;
  const negociosRiesgo = clientes.filter(c => c.estado === 'riesgo').length;
  const negociosAtencion = clientes.filter(c => c.estado === 'atencion').length;
  const negociosOptimos = clientes.filter(c => c.estado === 'optimo').length;
  const utilidadGenerada = clientes.reduce((a, c) => a + (c.resultados ? c.resultados.utilidad : 0), 0);
  const seguimientosRealizados = DB.seguimientos.length;
  const semanaActual = 'Semana 19';
  const totalAsignados = DB.trabajadores.reduce((a, t) => a + (t.negocios ? t.negocios.length : 0), 0);
  const hechosEstaSemana = new Set(DB.seguimientos.filter(s => s.semana === semanaActual).map(s => s.clienteId)).size;
  const seguimientosPendientes = totalAsignados - hechosEstaSemana;
  return { capitalInvertido, negociosActivos, negociosRiesgo, negociosAtencion, negociosOptimos, utilidadGenerada, seguimientosRealizados, seguimientosPendientes: Math.max(0, seguimientosPendientes) };
}

function eliminarCliente(id) {
  const c = getCliente(id);
  if (!c) return;
  if (!confirm(`¿Eliminar a ${c.nombre} y su negocio "${c.negocio.nombre}"? Esta acción también eliminará sus seguimientos y no se puede deshacer.`)) return;
  DB.clientes = DB.clientes.filter(x => x.id !== id);
  DB.seguimientos = DB.seguimientos.filter(s => s.clienteId !== id);
  DB.trabajadores.forEach(t => { t.negocios = t.negocios.filter(nid => nid !== id); });
  closeModal();
  mostrarNotificacion('Cliente eliminado correctamente');
  navegar('a-clientes');
}

  const t = getTrabajador(id);
  if (!t) return;
  const negocios = t.negocios.map(nid => getCliente(nid)).filter(Boolean);
  const semanaActual = 'Semana 19';
  const pendientes = negocios.filter(c => !DB.seguimientos.some(s => s.clienteId === c.id && s.semana === semanaActual));
  openModal(`${t.nombre} — Trabajador de Campo`, `
    <div class="form-grid-2">${field('Teléfono', t.telefono)}${field('Negocios asignados', negocios.length)}</div>

    <div class="form-box" style="margin-bottom:0;"><h4>Seguimientos: Realizados (${seguimientosDeTrabajador(id).length}) / Pendientes (${pendientes.length})</h4>

  `);
}

function afterAdminReportes() {
  if (!window.Chart || !DB.clientes.length) return;
  const labels = DB.clientes.map(c => c.negocio.nombre);
  const ventas = DB.clientes.map(c => c.resultados.ventas);
  const utilidades = DB.clientes.map(c => c.resultados.utilidad);

  const ctxVentas = el('chart-ventas-negocio');
  if (ctxVentas) {
    new Chart(ctxVentas, {
      type: 'bar',
      data: { labels, datasets: [{ label: 'Ventas ($)', data: ventas, backgroundColor: '#0d2340' }] },
      options: { responsive: true, plugins: { legend: { display: false } } }
    });
  }

  const ctxUtil = el('chart-utilidad-negocio');
  if (ctxUtil) {
    new Chart(ctxUtil, {
      type: 'bar',
      data: { labels, datasets: [{ label: 'Utilidad ($)', data: utilidades, backgroundColor: '#0f9d58' }] },
      options: { responsive: true, plugins: { legend: { display: false } } }
    });
  }

  const ctxEvo = el('chart-evolucion');
  if (ctxEvo && DB.seguimientos.length) {
    const ordenados = [...DB.seguimientos].sort((a, b) => a.fecha.localeCompare(b.fecha));
    const semanasMap = {};
    ordenados.forEach(s => { semanasMap[s.semana] = (semanasMap[s.semana] || 0) + s.utilidad; });
    new Chart(ctxEvo, {
      type: 'line',
      data: { labels: Object.keys(semanasMap), datasets: [{ label: 'Utilidad total ($)', data: Object.values(semanasMap), borderColor: '#c9a227', backgroundColor: 'rgba(201,162,39,0.1)', fill: true, tension: 0.3 }] },
      options: { responsive: true, plugins: { legend: { display: false } } }
    });
  }
}

function renderAdminConfiguracion() {
  const p = DB.parametros;
  return `
  <div class="card-table">
    <div class="card-table-header"><h3>Parámetros Generales de la Plataforma</h3></div>
    <div class="form-grid-3">
      <div class="field"><label>Nombre de la Empresa</label><input class="form-control" value="${p.nombreEmpresa}" id="cfg-nombre"></div>
      <div class="field"><label>Moneda principal</label><input class="form-control" value="${p.moneda}" id="cfg-moneda"></div>
      <div class="field"><label>Periodo de seguimiento</label><input class="form-control" value="${p.periodoSeguimiento}" id="cfg-periodo"></div>
    </div>
    <div class="field" style="margin-bottom:16px;max-width:260px;"><label>Meta mínima cumplimiento (%)</label><input type="number" class="form-control" value="${p.metaCumplimientoMinimo}" id="cfg-cumplimiento"></div>
    <button class="btn-main" onclick="guardarConfiguracionAdmin()"><i class="fa-solid fa-floppy-disk"></i> Guardar Configuración</button>
  </div>`;
}

function guardarConfiguracionAdmin() {
  DB.parametros.nombreEmpresa = el('cfg-nombre').value;
  DB.parametros.moneda = el('cfg-moneda').value;
  DB.parametros.periodoSeguimiento = el('cfg-periodo').value;
  DB.parametros.metaCumplimientoMinimo = Number(el('cfg-cumplimiento').value) || 80;
  mostrarNotificacion('Configuración guardada correctamente');
}
</script>
</body>
</html>
